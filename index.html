<script>
const CHARS={zhenhuan:{n:"甄嬛",h:"熹贵妃",hc:"house-h",g:"female",s:{"loyalty": 2, "depth": 3, "bravery": 2, "rebel": 1, "humor": 1, "adventure": 1, "morals": 2, "wisdom": 3},t:["聪慧隐忍", "步步为营", "从纯真到狠辣", "为爱付出一切"],r:"你和她一样，有着从纯真走向成熟的心路历程。你不是天生狠辣，但为了守护爱的人，你愿意变成任何样子。",tt:"《所有人都斗的时候，她不斗》",tb:"你第一次注意到甄嬛，是在翊坤宫的那场风波之后。\n\n华妃刚罚完夏常在。一丈红。血从台阶上一直流到院子里，所有人都绕着走，低着头，生怕被沾上。连平时最嘴碎的李嬷嬷都闭了嘴，快步低头走过，裙摆提得老高。管事的太监拽着袖子催所有人散开，像是慢一步就会被血溅到脸上。\n\n只有她一个人蹲下去了。\n\n她蹲在那滩血旁边，拿帕子一点一点地擦。擦得很慢，很认真，像是怕弄疼了那块地砖。旁边的人拉她，她说不急，等擦干净了再走。她的手在抖，帕子染红了大半，但她没有停。帕子换了两条，水换了三盆，从日头偏西擦到天色暗下来。\n\n你觉得她蠢。\n\n在这后宫里，同情心是最没用的东西。你见过太多人因为多看了一眼、多说了一句话就被拖下水。你见过翠微宫的春桃，就因为给被贬的妃子递了一碗热水，被发配去浣衣局洗了三年裤子，回来时满手裂口。可甄嬛偏偏要蹲下去，偏偏要擦，偏偏要在所有人都在躲的时候做那个最显眼的人。\n\n你以为她只是天真，没见过血，不懂规矩。她进宫那年才十五岁，家里人都说她太软，在这吃人的地方活不过冬天。可她偏偏活下来了，不是靠嘴，不是靠手段，是靠一种你说不清的东西。\n\n——\n\n后来你发现不是。\n\n你见过她被人算计的时候。安陵容在她汤药里动了手脚，她喝了，吐了三天三夜，整个人瘦脱了相，颧骨都凸出来了。所有人都以为她会报复，连你也是这么想的——在这后宫里，谁被下了药不翻脸的？\n\n可她没有。她只是把那个药碗收了起来，放在柜子最深处，用布包了一层又一层。\n\n你问她为什么不追究。\n\n她说：「她也苦。」\n\n你说不出话来。\n\n你见过她被皇上冷落的时候。整个后宫都在幸灾乐祸，连平时跟她打招呼的宫女都绕着她走，像是她会传染什么病一样。太监们送菜来，分量少了一半，菜也是凉的。她一个人坐在碎玉轩里，不哭不闹，剪窗花。\n\n剪了一窗子的蝴蝶，贴在窗户上，阳光照进来的时候，满屋子都是飞的。你站在门外看了很久，觉得这个女人要么疯了，要么强大到你想象不到的程度。\n\n后来你发现，她比你想象的还要强大。\n\n——\n\n你撞见过她在深夜做的一件事，从那以后你再也没有怀疑过她。\n\n那是冬天，祺贵人死了。冷宫里拖出来的，草席一卷，扔在乱葬岗旁边。所有人都说「活该」，说她平时那么嚣张，那么爱嚼舌根，终于遭报应了。连你最老实的师姐都说：「这种人死了，老天爷开眼。」\n\n你半夜路过御花园，看见一个人影蹲在假山后面。月亮很暗，风刮得人骨头缝都疼。你走近了才看清。\n\n是甄嬛。\n\n她在给祺贵人梳头。祺贵人的头发乱七八糟的，沾了血和泥，结成了好几团。她拿一把木梳，一点一点地梳通。梳断了好几根齿，也没停。她的手冻得通红，指节都僵了，但她没有停。\n\n你站在她身后，她没有回头。\n\n「你恨她吧？」你问。祺贵人陷害过她，在皇上面前说过她的坏话，把她推入过冷宫。全后宫的人都知道她们不对付。\n\n「恨过。」她说。\n\n「现在呢？」\n\n「她以前也喜欢在头发上插一朵茉莉花。」\n\n你愣住了。\n\n她梳完了，从袖子里取出一朵压得扁扁的茉莉花——已经干了，花瓣都脆了，一碰就要碎——插在祺贵人的鬓边。然后她站起来，拍了拍裙摆上的灰，走了。没有哭，没有说话，甚至没有回头看一眼。\n\n你忽然觉得，这个女人不是善良。\n\n是残忍。她对自己太残忍了——看透了这后宫里所有人的恶，却依然选择不变成她们中的任何一个。她不是不懂恨，她是不愿意让恨把她变成另一个人。\n\n——\n\n「娘娘，」你终于忍不住问她，「你为什么……」\n\n她停下来，看着你。月光照在她脸上，她的眼睛很亮，亮得让你心口发疼。\n\n「因为我试过变成她们，」她说，「太累了。」\n\n然后她继续往前走。你站在原地，看着她的背影消失在夜色里。\n\n后来你再也没有见过她哭。一次都没有。\n\n但你知道——她不哭不是因为不难过。是因为她选择把那些难过，一点一点地，变成了对别人的好。\n\n不是因为傻。\n\n是因为她知道，如果连她都不善良了，这后宫就真的什么都没有了。"},huangshang:{n:"皇上（雍正）",h:"皇帝",hc:"house-g",g:"male",s:{"loyalty": 1, "depth": 3, "bravery": 1, "rebel": 0, "humor": 0, "adventure": 0, "morals": 1, "wisdom": 3},t:["多疑深情", "帝王孤独", "爱却不敢信", "权力的囚徒"],r:"你有着和他一样的深度——表面冷静，内心翻涌。你渴望被理解，却又害怕被看穿。",tt:"《那盏灯》",tb:"你发现了一个秘密。\\n\\n这个秘密皇上谁都没告诉，但你知道了——因为他忘了关窗。\\n\\n那天夜里你路过御书房，本来是想抄近路回寝宫。窗户半开着，烛火的光从里面透出来，在窗纸上投出一个人的影子。你无意间往里看了一眼。\\n\\n他一个人坐在案前，面前铺着一排小物件：一支玉簪，一个绣荷包，一把折扇，一枚香囊，还有一块已经磨得发亮的玉佩。他拿起一个，看一眼，放下。拿起下一个，看一眼，放下。动作很慢，像是在确认什么东西还在那里。\\n\\n然后他把所有东西收进抽屉，锁上。\\n\\n你站在窗外，忽然觉得这个全天底下最有钱有势的人，像一个守着几块碎银子过日子的老人。\\n\\n你没有出声，转身走了。\\n\\n你不知道自己为什么要记住这件事。\\n\\n——\\n\\n后来你开始留意。\\n\\n你发现每次宫宴散场后，他总是不急着回寝宫，而是绕道去御书房待一会儿。有时候是一盏茶的功夫，有时候是半个时辰。太监们在外面候着，没人敢问皇上在里面做什么。\\n\\n你有一次故意在宫宴结束后跟在他后面，隔着十几步的距离。他走得很慢，背微微佝着，像是一天的力气都用完了。进了御书房，他没有点蜡烛，就坐在黑暗里。\\n\\n你站在廊下看了一会儿，忽然觉得他不是不想被人看见，而是不敢被人看见。\\n\\n你开始做一些以前从不会做的事。\\n\\n你会在去御书房的路上的石缝里放一颗桂花糖。他会弯腰捡起来，攥在手心里，然后继续往前走。你不知道他有没有发现那是你放的。\\n\\n你会在他批折子到深夜的时候，让御膳房留一碗热粥。粥端到他面前的时候，他总是不说话，只是喝。喝完以后，碗底朝下扣在桌上，像是某种回应。\\n\\n你有一次偷偷数了数他桌上的折子——摞起来有半个人高。你忽然觉得，这个人每天要做的事，比你一辈子做过的事都多。\\n\\n你有一次在廊下等他出来，等了两个时辰。他出来的时候，脸色是一种你说不清楚的颜色——不是累，也不是难过，是那种什么都见过了所以什么都懒得再放在脸上的平静。他看见你，顿了一下，问：你在这里做什么。\\n\\n你说：没什么，路过。\\n\\n他看了你一眼，没再问。转身走了两步，又回头，说：明天子时以后别来了，风大。\\n\\n你说：哦。\\n\\n他走了。你站在廊下，风从两边的宫墙之间穿过，确实很大。但你想，他说的是子时以后别来——不是叫你不要来。\\n\\n你后来去了两次。都是在子时之前。他每次都在。他没有再说什么，只是你进去了，他就把第二把椅子往外挪一挪，挪到离炭盆更近的地方。\\n\\n你不知道他知不知道那把椅子是给你挪的。他从来不说。但每次你来，那把椅子都在。每次你走，他又把它推回去，推到角落里，像是这样就能让这件事不存在过一样。\\n\\n你觉得，他大概是知道的。\\n\\n——\\n\\n过了几天，他叫你夜里去御书房。\\n\\n你没有问为什么，去了。\\n\\n他正在批折子，听见你进来，头也没抬，指了指旁边的椅子。你坐下，等了很久，久到你觉得他不会跟你说话了，他终于放下笔，起身去倒茶。\\n\\n他倒完茶，壶底磕在桌上，发出一声很轻的响。\\n\\n你看着他的手指——那只手刚刚还握着朱笔，稳稳当当地批了几十份折子，此刻却在微微发抖。你不确定那声响是不是故意的。也许他只是累了。也许他是用一种最笨的方式告诉你：留下来，别走。\\n\\n你没有动。你端起茶杯，喝了一口。\\n\\n他重新坐回去，沉默了很久。窗外的风吹得窗纸哗哗响，你听见远处的更鼓响了三声。\\n\\n「你平时都什么时候睡？」他忽然问。\\n\\n「过了子时就睡了。」你说。\\n\\n「朕每天都到丑时。」他说完又拿起一份折子，像是随口说的一句闲话。\\n\\n你看着他，忽然意识到——他叫你过来，不是为了交代什么事。他只是想找个人陪他坐一会儿。\\n\\n你以为他忘了你在这儿，直到他又开口。\\n\\n「所有人都怕朕、敬朕、讨好朕。」\\n\\n他的声音很低，像在自言自语，又像在跟你商量一件事。\\n\\n「只有你看着朕的时候，眼睛里没有这些。」\\n\\n他顿了一下，目光从折子上移开，看了你一眼。\\n\\n「你知不知道，这比什么都难得。」\\n\\n你没有回答。你不知道该怎么回答——当一个人把全天下最重的话，用最轻的声音说出来的时候。你只是把茶杯放下，手指碰到了刚才那个磕出声响的位置，桌面还留着一点余温。\\n\\n——\\n\\n那天夜里你离开御书房的时候，回头看了一眼。\\n\\n他又在批折子了。但你注意到，那个抽屉是开着的。\\n\\n后来你每次深夜路过御书房，都会绕到那扇窗下面。\\n\\n灯总是亮着。\\n\\n灯下的人是不是在看你送的那个小东西，你不知道。也许他已经忘了。也许他根本没看。也许他看的从来就不是什么东西，而是某个人的影子。\\n\\n但灯一直亮着。\\n\\n你在那盏灯下站了很久，然后走了。走之前你在窗台石缝里放了一颗桂花糖，不知道他会不会发现。"},huanghou:{n:"皇后（乌拉那拉·宜修）",h:"皇后",hc:"house-h",g:"female",s:{"loyalty": 0, "depth": 2, "bravery": 1, "rebel": 0, "humor": 0, "adventure": 0, "morals": 0, "wisdom": 3},t:["表面端庄内心狠戾", "被嫉妒吞噬", "一生都在争夺", "可怜又可恨"],r:"你和她一样有着不被理解的痛。你渴望被看见，被珍视，而不是永远活在别人的影子下面。",tt:"《她忘了怎么笑》",tb:"你被分到景仁宫的第一天，嬷嬷把你拉到廊下，压着声音告诉你一句话：「皇后娘娘不喜欢人吵。」\n\n你记住了。\n\n所以你在景仁宫的三个月里，从来没有听见过笑声。不是那种「不敢笑」的安静——你见过别的宫里那种安静，太监宫女们憋着笑，眼神乱飞，那种安静是活的。景仁宫的安静是死的。像是这座宫殿本身就不会笑。\n\n你开始注意到一些奇怪的事。\n\n皇后娘娘对谁都一样。一样的语气，一样的表情，连走路的步子都是一样的。不多一步，不少一步。她赏你的时候说「做得好」，罚你的时候也说「做得不好」，语调没有起伏，像在读一本已经读了无数遍的书。你第一次见她嘴角动了一下，是刚入宫的时候——但那不是笑，是她面部肌肉微微抽搐了一下，很快就恢复了。你甚至怀疑那不是她自己能控制的。\n\n你以为她天生就是这样，生来就端庄，生来就没有情绪。\n\n——\n\n直到有一天你起夜，路过景仁宫的后殿。\n\n灯还亮着。都子时了，灯还亮着。你透过窗纸的缝隙看进去，看见皇后娘娘一个人坐在镜子前。\n\n她没有在梳妆。她在做一个很奇怪的动作。\n\n她用手指把自己的嘴角往上推。推上去，松手。嘴角掉下去。再推上去。再松手。\n\n一遍又一遍。\n\n她的动作很慢，很认真，像是在做一个每天必须完成的功课。推上去的时候，她会盯着镜子里的自己看一会儿，像是想确认什么。然后松手，嘴角掉下来，回到原来的位置。她再推。\n\n你站在那儿看了很久，直到腿都麻了。她推了大概有二十遍，然后停下了。她看着镜子里的自己，看了很久。然后她低下头，把铜镜扣了过来。\n\n第二天早上，你像什么都没发生一样去伺候她。她正在写字，手腕悬在半空，一笔一画地写着佛经。你递茶的时候，手抖了一下，茶水洒了一点在她的袖口上。\n\n你以为完了。景仁宫的规矩你见过，洒了茶的宫女被掌嘴的都有。\n\n她看了一眼袖口，然后抬头看你。你做好了被骂的准备，膝盖都软了。\n\n「下次小心，」她说。语气跟平时一模一样。没有生气，没有不生气。什么都没有。\n\n你退下的时候，心里忽然涌上一个念头：这个女人不是不会生气。她是连生气都觉得没必要了。\n\n——\n\n后来你知道了她的故事。纯元皇后。她的亲姐姐。皇上的白月光。她一辈子活在姐姐的影子里——姐姐穿过的衣服她不能穿，姐姐用过的东西她要供起来，连姐姐的封号她都要避讳。她坐了皇后之位二十年，却从来没有做过一天「乌拉那拉·宜修」。她只是「纯元皇后的妹妹」，只是「替姐姐坐在这里的人」。\n\n所有人都以为她恨姐姐。所有人都以为她做的那些事——害这个妃子、害那个妃子——都是出于嫉妒，出于对姐姐的恨。\n\n你也这么以为。直到你撞见了那个抽屉。\n\n你在景仁宫收拾的时候，不小心拉开了一个暗格。里面没有什么贵重的东西，只有一只旧荷包。荷包的绣工很粗糙，针脚歪歪扭扭的，线头都没有收干净，像小女孩子初学女红时做的。荷包的角落里绣了两个歪歪扭扭的字——「宜」「修」。笔画都不对，「修」字少了一竖。\n\n你愣住了。这不是纯元的东西。这是她自己的。六岁时候自己绣的。\n\n你还没来得及反应，脚步声近了。皇后娘娘站在门口，看着你手里的荷包。你吓得跪了下去，头磕在地上，额头都疼了。\n\n她没有说话。她走过来，从你手里拿过那个荷包。你以为她会罚你，会发火，会把这东西扔进火里——这是皇后的暗格，你一个下人看见了，按规矩要掌嘴的。\n\n她没有。\n\n她把那个粗糙的旧荷包贴在胸口，闭上了眼睛。\n\n你看见她的手在抖。抖得厉害，指节都白了，死死地攥着那个荷包，攥得指缝都泛白了。\n\n然后你看见了一滴水落在荷包上。很小的一滴。你不确定那是不是眼泪——因为她的脸上没有任何表情。没有哭相，没有抽动，连呼吸都没有变。那滴水就那么落下来了，像是天空自己掉下来的。\n\n「这是我六岁时候绣的，」她说，声音很平，像是在说别人的事，「姐姐说丑。但她一直带在身边。」\n\n她顿了一下。\n\n「后来她死了。我打开她的遗物，发现这个荷包放在最上面。边角都磨破了。」\n\n她不再说话了。她把荷包放回暗格，拉上抽屉，转身走了。她的背挺得很直，步子走得很稳。跟平时一样。完美的皇后。\n\n——\n\n很多年以后，你已经不在景仁宫了。但每次你看到镜子里的自己，你都会想起那个深夜，那个用手指把自己的嘴角往上推了一遍又一遍的女人。\n\n你想，她大概早就忘了笑是什么感觉了。\n\n但她还记得六岁那年，姐姐说她绣的荷包丑的时候，她们两个都笑了。\n\n那是她这辈子最后一次笑。"},huafei:{n:"华妃（年世兰）",h:"华贵妃",hc:"house-h",g:"female",s:{"loyalty": 3, "depth": 1, "bravery": 3, "rebel": 2, "humor": 0, "adventure": 1, "morals": 1, "wisdom": 1},t:["骄傲跋扈", "爱得毫无保留", "嚣张但真诚", "悲剧的深情"],r:"你和她一样，爱得毫无保留，哪怕全世界都说你傻。你的骄傲不是装的——是你唯一能保护自己的方式。",tt:"《她把最凶的样子给了所有人》",tb:"你第一次见华妃发脾气，是颂芝打翻了一盏茶。\n\n就一盏茶。温的。溅了两滴在她袖口上。那两滴茶渍还没有铜钱大。\n\n「滚出去。」她说。声音不大，不喊不叫。但整个翊坤宫的人都跪了下去，膝盖磕在地板上的声音连成一片，像是下雨。\n\n颂芝抖得像筛糠，头都不敢抬，连滚带爬地出去了。你站在角落里，大气都不敢出。你觉得这女人真狠。两滴茶，温的，溅在袖口上，至于吗？\n\n但然后你看到了一个所有人都不曾注意到的细节。\n\n颂芝滚出去之后，翊坤宫安静了。所有人都低着头，没人敢动。华妃坐在那里，一动不动。然后——她低下了头。\n\n她的目光落在那两滴茶渍上。不是在看污渍。是在看那盏被打翻的茶。碧螺春。她看了一眼，手指动了一下，像是想把它扶起来。那个动作太快了，快到你以为是错觉。但她的指尖确实在半空中停了一瞬，然后收了回去。\n\n她不是心疼茶。她是心疼那个端茶的人。\n\n——\n\n后来你成了翊坤宫的掌事宫女。你看到了更多别人看不到的东西。\n\n她每天夜里都要点一炉香。欢宜香。皇上赏的，说安神的。全后宫独一份的恩宠。所有人都觉得华妃是皇上最宠的妃子——专宠了十几年，赏赐不断，翊坤宫的摆设比皇后宫里的还贵重。别的妃子看她都带着羡慕和嫉妒，连走路都要绕着翊坤宫走。\n\n但你发现了一个奇怪的事。\n\n她点香的时候，从来不待在屋里。她把香炉点着了，就走出去，站在院子里。一站就是半个时辰。冬天也是。下雪也是。风刮得人都站不稳，她就那么站在风里，披着斗篷，隔着窗户看那炉香烧完。\n\n有一次你忍不住问：「娘娘，香点了不闻吗？」\n\n她看了你一眼，说：「闻久了，会习惯。」\n\n你没听懂。但你记住了她当时的眼神——不是愤怒，不是委屈，是一种你已经很久没有在活人脸上见过的东西。像是一口井，你看不到底，但你知道下面有东西。\n\n——\n\n那天她喝了酒。不多，就两杯。她靠在榻上，眼睛半闭着，手指一下一下地敲着扶手。翊坤宫的人都退下了，只有你还在收拾。\n\n「你过来，」她说。\n\n你走过去。\n\n「你知道这香里有什么吗？」她问。\n\n你说：「皇上赏的欢宜香，安神的。全后宫独一份。」\n\n她笑了。不是那种得意的笑，不是那种跋扈的笑。是一个很轻很轻的笑，轻到你差点以为她没笑。\n\n「是麝香，」她说。\n\n你的脑子嗡了一下。全后宫都知道欢宜香让华妃不能有孕，所有人都以为她不知道——所有人都以为她是被蒙在鼓里的那个人。\n\n「我知道，」她说，语气像是在说今天天气不错，「从一开始就知道。」\n\n「那您为什么……」\n\n「为什么不问？为什么不砸了这炉香？为什么不跟皇上闹？」她替你把话说完。\n\n你点头。\n\n她沉默了很久。香炉里的烟袅袅地飘过来，带着一种甜得发腻的味道。她看着那缕烟，像是看着一个很远很远的地方。\n\n「因为我不想让他为难，」她说。\n\n你说不出话来。一个被枕边人用麝香绝了生育的女人，说「不想让他为难」。\n\n「你以为我是在争宠？」她又笑了，这次笑出了声，但笑声里有一种很奇怪的东西——像是哭被硬生生按住了，「我不是在争宠。我是在等他来。」\n\n她顿了一下。\n\n「等了十年。」\n\n她的声音很平。太平了。平到你知道她用了多大的力气才让它这么平。\n\n「你以为我为什么对谁都那么凶？」她看着你，眼睛亮得吓人，「因为如果我对谁都凶，他来看我的时候，我就只需要对他一个人不凶。这样就够了。」\n\n——\n\n「你知道我为什么不怕任何人吗？」她忽然问。\n\n你摇头。\n\n她站起来，走到窗前。月光照在她的侧脸上，她的睫毛很长，投下一片阴影。她站在那里，背影很孤。\n\n「因为我已经没有什么可以输的了，」她说，「一个什么都不怕的人，不是因为她强大。是因为她早就输光了。」\n\n然后她转过身，把那炉还没烧完的香掐灭了。\n\n「明天换沉香，」她说，「这香闻久了，眼睛疼。」\n\n你看着她走回内室，背影挺得很直，步子很大。跟白天发脾气的时候一样。\n\n但你知道不一样了。\n\n白天的华妃是在演。深夜的华妃，才是真的。\n\n而真的她，比假的她，可怕一万倍。\n\n可怕到让你心疼。"},shenmeizhuang:{n:"沈眉庄",h:"惠贵人",hc:"house-h",g:"female",s:{"loyalty": 3, "depth": 2, "bravery": 2, "rebel": 1, "humor": 0, "adventure": 0, "morals": 3, "wisdom": 2},t:["温婉坚韧", "宁折不弯", "清醒而决绝", "最纯粹的友情"],r:"你和她一样，骨子里有着一份宁折不弯的倔强。你可以温柔，但你有底线——触到了，就绝不回头。",tt:"《她是这后宫里唯一一个敢说真话的人》",tb:"你第一次见沈眉庄折东西，是当众把皇上的赏赐退回去。\n\n不是一支钗一盒胭脂。是皇上亲手写的一幅字。御笔亲书，盖了玺印的。全后宫的妃子要是能得到一幅，能供奉一辈子，逢人就夸。\n\n「臣妾用不上，」她说，声音不大，但整个偏殿都听见了，「请皇上收回。」\n\n所有人都倒吸一口凉气。送礼的太监脸都白了，跪在那里不知道怎么办，头磕在地板上「咚咚」响。你站在旁边，手心全是汗——在这后宫里，皇上的东西，哪怕是赏你一坨屎，你都得谢恩接过来，供起来，逢年过节还要拜一拜。\n\n她没有跪。她站得笔直。\n\n太监走了之后，所有人都躲着她走。连平时跟她一起喝茶的妃子都改了道，宁可多走半条走廊也不经过碎玉轩。你跟着她回了院子，路上一直在想：这女人是不是疯了？\n\n但你很快就发现，她不是疯了。她是清醒得太厉害了。\n\n——\n\n你以为她「宁折不弯」是天生如此。从小就是这样，谁的话都不听，认准的事谁劝都没用。\n\n后来你发现不是。\n\n你是在一个很偶然的机会里发现的。那天你去碎玉轩给她送新裁的秋衣，她不在。东西放在桌上，你准备走的时候，看到了砚台旁边的东西。\n\n是一支断了的簪子。玉的。断得很整齐，不是摔断的，像是被什么很重的东西压断的。簪子的旁边放着一张纸，上面写了一行字，只写了一半：「宁可枝头抱香死——」\n\n笔尖戳在纸上，墨迹洇成了一团。洇得很深，纸都快被戳破了。像是写到这里，笔忽然停住了。停住了很久很久。久到墨都干了，笔尖还戳在那里。\n\n你没有见过那个瞬间。但你能想象——她坐在那里，笔尖悬在半空，想了很久。然后笔尖落下来，戳在纸上，洇出了一团墨。她没有继续写。她放下了笔。然后她拿起了那支簪子，折断了它。\n\n她没有写完那首诗。\n\n但她也没有弯。\n\n你忽然就明白了。她不是没有动摇过。她动摇过，而且动摇得很厉害。厉害到笔尖都能洇出一团墨。厉害到她把一根玉簪硬生生折断——那是她进宫时母亲给她的，她一直戴着。但她最终还是选择了把簪子折断，而不是把自己折断。\n\n——\n\n有一天，她叫你进去。她在泡茶。菊花茶。她倒了一杯给你，示意你坐。\n\n你没有坐。你不敢。\n\n「坐，」她说，「又不是老虎。」\n\n你坐了。\n\n她端起自己的杯子，吹了吹。菊花在热水里一朵一朵地绽开，像一只一只睁开的眼睛。她的手很稳，手指修长，指甲修剪得干干净净。\n\n「你在这宫里多久了？」她问。\n\n你说：「三年。」\n\n她点了点头，抿了一口茶。\n\n「三年了，」她说，像是在自言自语，「你有没有发现，这宫里最危险的不是说错话的人？」\n\n你想了一下。你想到了那些因为一句话被贬的妃子，那些因为一个字被发配的宫女。你想到了碎玉轩的冬天有多冷，想到了那些被拖出去的人再也没有回来。\n\n「是说真话的人？」你问。\n\n她看了你一眼。\n\n然后她笑了。很短的一下。不是那种礼貌的笑，不是那种应付的笑。是那种「你终于想明白了」的笑。\n\n「不是，」她说，「最危险的是，说真话的人最后会以为，真话是没有人要听的。」\n\n她把茶杯放下。菊花沉到了杯底，安安静静地躺着，不再浮着了。\n\n「但你要记住，」她说，声音很轻，像是怕惊动了什么，「真话不是没有人要听。是没有人敢承认自己听到了。」\n\n——\n\n然后她不再说话了。她拿起笔，继续写她的字。你坐在那里，手里的茶已经凉了。\n\n菊花的花瓣一片片地沉在杯底，像是沉在了某个很深很深的地方。\n\n你端起那杯凉了的茶，一饮而尽。苦得你皱了一下眉。\n\n但你记住了那个味道。\n\n后来她出了很多事。被陷害，被冷落，被整个后宫抛弃。皇上再也没来过碎玉轩。太监们送的菜越来越差，最后干脆不送了。她没有求过任何人。一次都没有。\n\n你最后一次见她，是在一个秋天。她在院子里晒菊花。一片一片地摘，一片一片地摊在竹匾上。阳光很好，照在她身上，她的头发有些白了，但手指很稳。\n\n你没有打扰她。你站在门口看了一会儿，然后走了。\n\n她没有抬头。但她知道你在。\n\n因为你在桌上看到了一杯刚泡好的菊花茶。还是热的。\n\n杯底下压着一张纸，上面写了一行字，是她的笔迹。\n\n「宁可枝头抱香死。」\n\n那首诗，她终于写完了。"},anlingrong:{n:"安陵容",h:"安答应",hc:"house-h",g:"female",s:{"loyalty": 0, "depth": 3, "bravery": 0, "rebel": 1, "humor": 0, "adventure": 0, "morals": 0, "wisdom": 2},t:["自卑到黑化", "敏感多疑", "才华横溢却得不到认可", "被伤害后选择伤害别人"],r:"你和她一样敏感——能察觉到别人察觉不到的情绪变化。你的痛不是矫情，是你真的感受到了。",tt:"《她只唱给深夜听》",tb:"深夜的延禧宫后殿，有人在唱歌。\\n\\n你循着声音走过去，穿过回廊的时候脚步放得很轻。歌声很细，像一根丝线悬在夜风里，随时会断。你停在窗外，没有推门，只隔着窗纸听。她唱的不是宫里的曲子，调子软软的，尾音拖得很长——你后来才知道，那是安陵容家乡的小调，松阳县的调子。宫里没有人听过。\\n\\n你听了一会儿，手指在窗棂上轻轻敲了一下。歌声停了。过了很久，屋里传来一声很轻的：谁。你说：我。门开了半条缝，她站在门后，穿一身素白的寝衣，头发散着，没有戴任何首饰。她的眼睛红红的，但很快低了下去，说夜深了，娘娘怎么来了。你说听见有人唱歌，来看看。她愣了一下，说没有，是风。\\n\\n你不信，但你不戳穿。你退了一步，转身走了。走出三步的时候你回头，门已经关上了。你站在原地站了一会儿，然后走回自己宫里。那一夜你没有睡，耳边全是那截没唱完的小调。\\n\\n从那以后你开始留意她。延禧宫的人说安陵容不爱出门，不爱串门，不爱参加妃嫔们的聚会。她一个人绣花，一个人看书，一个人对着铜镜梳头。你有一次故意从延禧宫门口路过，看见她站在院子里看一棵桂花树。你停下来跟她打招呼，她转身，笑，说娘娘怎么有空来。你走过去，站到她旁边，说桂花开了。她说嗯。你等她说下一句，她没有。你们就那样站了很久，看桂花从枝头落下来，落在她肩上，她没有拂去。\\n\\n你想靠近她，但她总是往后退。不是故意的退——是你往前走一步，她就恰好在这个时候转身去倒茶，或者忽然想起什么要去取东西，或者低头看自己的衣摆。她的退让你觉得她不是在躲你，她是在躲所有人。或者说，她只是不知道当有人靠近的时候，她该站在什么位置。\\n\\n你试过送她东西。一盒上好的胭脂，她收了，说谢谢，但你后来去她宫里，看见那盒胭脂原封不动地摆在妆台上。一匹蜀锦的料子，她也收了，说颜色好看，可你再也没见她穿过。你渐渐明白了：她收东西不是因为想要，是因为她不知道拒绝之后，对方会怎么看她。她想要的是被看见，不是被施舍。只是每次被人看见的时候，她都不知道该怎么回应。就像你第一次见她唱歌，她说没有，是风。\\n\\n有一回你在御花园碰到她一个人。她蹲在假山后面，手里攥着一支笔，在石头上写字。你走近看，写的是歌词。她听见脚步声，猛地把笔藏到身后，站起来的时候撞到了假山，疼得直吸气。你问她写什么，她说没什么。你蹲下身，捡起她掉在地上的那张纸。纸上密密麻麻写满了字，边角都磨毛了。你看了一眼，是她自己写的词，词里有一句：没人听见的歌，唱给谁听。你把纸递给她，她接过去，手指碰到你的手指，冰凉。你想说点什么安慰她，但那些话到了嘴边又咽了回去。你没有经历过她的处境——从小地方来，家世低微，进宫后处处被人看不起，连笑都怕被人笑话。你知道你说的任何话，在她听来都像是站着的人对蹲着的人说：你站起来就好了。\\n\\n真正改变的是那天夜里。你又听见她在唱歌，这一次你没有停在窗外。你推开了门。\\n\\n她吓了一跳，歌声戛然而止。你走进去，在门槛边的矮凳上坐了下来。她站在屋子中央，手足无措地看着你。你说：你唱，我听听。她不动。你闭上眼睛，把下巴靠在膝盖上。屋里的炭火噼啪作响，窗纸被风吹得微微鼓起。\\n\\n然后她开口了。\\n\\n还是那首松阳小调，声音比平时稳了一些，但尾音还是微微发颤。你没有睁眼，就那么听。她唱了一段，停了一下，像是在等你开口说点什么。你什么都没说。她又唱了一段，越唱越慢，越唱越轻。唱到最后一段的时候，她的声音忽然断了。\\n\\n你睁开眼。她站在原地，看着你，眼眶红了。她没有哭，但眼眶红得像是要哭出来。你看着她，她也看着你。你们谁都没有说话。炭火又噼啪响了一声。\\n\\n她后来什么都没说。你也没有问。你站起来，走的时候替她带上了门。\\n\\n第二天在御花园遇见她，她远远地看见你，脚步顿了一下。你走近的时候，她微微笑了一下。不是妃嫔们那种精心调整过的笑，嘴角弯的角度恰到好处，多一分谄媚少一分冷淡。她的笑很笨拙，嘴角翘得有点歪，但你看得出来——那是她在宫里唯一真心的笑。"},guojunwang:{n:"果郡王（允礼）",h:"郡王",hc:"house-h",g:"male",s:{"loyalty": 3, "depth": 2, "bravery": 2, "rebel": 2, "humor": 1, "adventure": 3, "morals": 2, "wisdom": 2},t:["风流倜傥", "深情专一", "潇洒外表下的孤独", "为爱放弃一切"],r:"你和他一样，有着浪漫到骨子里的灵魂。你不介意与众不同——你享受它。你愿意为了对的人放弃全世界。",tt:"《他唯独没有对你笑过》",tb:"你第一次见果郡王，是在中秋宫宴上。\n\n他迟到了。全殿的人都到了，就他一个没来。皇上脸色不好，太监急得来回跑，皇后端端正正地坐着，手指一下一下地敲着扶手。然后他来了——大摇大摆地走进来，衣襟敞了一半，头发散了两缕，手里还提着一壶酒。\n\n「皇兄恕罪，」他笑得坦坦荡荡，「臣弟在园子里看月亮，看忘了。」\n\n满殿的人都笑了。不是那种真心的笑，是「这个王爷又这样了」的无奈的笑。\n\n然后他的目光扫过全殿，一个一个地看，一个一个地笑。看谁都像看了很久，笑谁都像笑得很真。\n\n直到看到你。\n\n他没有笑。\n\n他看着你，目光停了一瞬，然后移开了。没有打招呼，没有点头，没有说话。就像没看到你一样。\n\n你觉得莫名其妙。\n\n后来你知道了——他对全皇宫的每个人都笑过，唯独没有对你笑过。\n\n——\n\n你以为他只是不认识你。后来你发现不是。\n\n你在御花园里遇见他，他在给花浇水。你路过的时候，他抬起头，看了一眼，又低下去了。没有笑，没有打招呼，连「借过」都没说。\n\n你在书房里翻书，他在隔壁下棋。隔着屏风你能听见他的笑声——和那个人下棋的时候笑得很大声，和另一个人讨论诗的时候笑得更响。你出去的时候经过屏风，他的笑声戛然而止，像被人掐断了一样。\n\n你在宫宴上坐在角落，他坐在上首。他敬了所有人的酒，跟所有人都说了话，连新来的小太监他都拍了拍肩膀。你的酒杯空了他也没看到——明明从你坐的角度，他的视线经过你面前的桌子足足三次。\n\n你开始觉得不对劲了。\n\n不是因为他没对你笑——是因为他「没对你笑」这件事，做得太刻意了。刻意到像是他在用力地、认真地、小心翼翼地——躲着你。\n\n——\n\n你终于忍不住，在一个深夜堵住了他。\n\n那是七月十五，中元节，宫里放了河灯。所有人都去看了，只有你没去。你知道他也不会去——因为你偷偷观察过，所有人都在的场合，他就不在。所有人都不在的时候，他反而会找个角落待着。\n\n你在王府后门的巷子里等他。等了一个时辰，他来了。\n\n他看到你的时候，脚步顿了一下。就那一下，短得几乎看不见。然后他若无其事地走过来，手里的折扇摇啊摇，像个什么都没发生的人。\n\n「王爷，」你说，「你是不是在躲我？」\n\n他摇扇子的手停住了。\n\n然后他笑了。\n\n这是你第一次见他笑——不是在宫宴上那种应付的笑，不是跟朋友喝酒那种热闹的笑。是一个很轻、很短、像是从很深很深的地底浮上来的笑。\n\n「是，」他说。\n\n你愣住了。\n\n他没有等你追问，自顾自地说了下去，声音很平，像在说别人的事。\n\n「三年前，上巳节，曲江池。你站在曲桥上，我坐在亭子里。你看了我很久。」他顿了一下，「你知道那天我在想什么吗？」\n\n你摇头。\n\n「我在想，这个人的眼睛太好看了。好看到了我一看就知道——如果我多看一眼，我这辈子就完了。」\n\n他不说话了。巷子里的风从你们之间穿过，吹得他手里的折扇哗啦啦地响。\n\n「王爷，」你说，「你怕什么？」\n\n他说：「我怕我喜欢上你。」\n\n你说：「喜欢就喜欢。」\n\n他说：「我不能喜欢。」\n\n你说：「为什么不能？」\n\n他看着你，看了很久。然后他把折扇合上，别在腰间，往前走了两步。\n\n两步的距离，你们离得很近。近到你能闻到他身上淡淡的酒味和松木香。\n\n「你知不知道，」他说，声音压得很低，「我这辈子从来没有躲过任何人。我见谁都笑，见谁都说话，见谁都交朋友。因为我对谁都无所谓——无所谓就不会受伤，无所谓就不会失控，无所谓就不会——」\n\n他顿住了。\n\n「不会什么？」你问。\n\n「不会想一个人想到三年不敢看第二眼。」\n\n——\n\n他走了。\n\n你站在巷子里，风吹得你打了个冷战。他的背影消失在巷子尽头，月白色的长衫在夜色里像一个正在散去的梦。\n\n你低头看了看自己的手——不知道什么时候攥成了拳头，指甲嵌进了掌心，疼得厉害。\n\n你忽然想起三年前那个上巳节。你站在曲桥上，看着亭子里那个笑得最响的人。你想的是：这个人笑得很真，但笑完之后，一定很累吧。\n\n原来他也看到你了。\n\n原来他看了你一眼，就用了三年的时间来躲。\n\n——\n\n后来你又见过他很多次。在宫宴上，在御花园，在书房。他见你还是会顿一下脚步，还是会移开视线，还是不会对你笑。\n\n但你不再觉得被忽略了。\n\n因为你知道了——他对所有人的笑，是因为不在乎。他唯独对你的不笑，是因为太在乎。\n\n在乎到不敢多看一眼。\n\n在乎到看了三年，也只敢说一次。\n\n——\n\n很多年以后，你在他府里的一间密室里发现了一个柜子。柜子里什么都没有，只有一把折扇、一张浣花笺，和一根枯了的柳枝。\n\n折扇的扇面上是你三年前写的那首诗。你一直以为那张纸被风吹走了。原来没有。\n\n柳枝是你和他第一次说话那天，他折的那一根。他别在扇骨上，带回了府里。\n\n浣花笺上只有一行字，是他的笔迹，歪歪扭扭的，像是喝醉了写的。\n\n「如果我不是果郡王。」\n\n后面没有写完。\n\n你站在那间密室里，手里攥着那根枯了的柳枝，站了很久。\n\n你想，这句话后面他想写什么？\n\n「如果我不是果郡王，我就能娶你」？\n\n「如果我不是果郡王，我就不需要躲你」？\n\n「如果我不是果郡王，我大概会是一个不一样的人」？\n\n你没有答案。你只知道，那个对所有人都笑的人，把一辈子的认真都给了你。然后他带着那一份认真，躲了你三年，护了你三年，没有碰过你一下。\n\n不是因为不想。是因为不能。\n\n他把那根柳枝留了一辈子。枯了也没扔。\n\n因为他知道，有些东西一旦扔了，就真的什么都没有了。"},jingfei:{n:"敬妃（冯若昭）",h:"敬妃",hc:"house-h",g:"female",s:{"loyalty": 2, "depth": 2, "bravery": 1, "rebel": 0, "humor": 0, "adventure": 0, "morals": 2, "wisdom": 3},t:["隐忍大度", "不争但智慧", "在夹缝中求生", "温柔的保护者"],r:"你和她一样，不张扬但有力量。你知道什么时候该说话，什么时候该沉默——这种智慧比锋芒更难得。",tt:"《数砖的人》",tb:"咸福宫的院子里有一千零四十二块砖。\\n\\n你知道这个数字，因为冯若昭数给你听了。那天你去找她，她不在屋里。宫女说她在地砖上，你走到后院一看，她蹲在院子里，手指一块一块地摸着地上的青砖，嘴里念念有词。你站在台阶上看了一会儿才看清——她不是在摸砖，她是在数。\\n\\n你问她数什么。她说数砖。你说数砖干什么。她说：进宫那年我十三岁，闲得慌，就数着玩儿。数了一遍又一遍。你问她数了多少遍。她说数不清了，但每一遍的数字都一样。一千零四十二块。你问她每一块都记得。她说：记得。你说这有什么意思。她没有回答你，只是把手指按在一块砖上，停了一会儿，然后移到下一块。\\n\\n你走到院子里，在她身边蹲下来。手指触到青砖的那一刻你才发现——这些砖不是普通的砖。有的砖面光滑，有的粗糙，有的边角已经磨损得几乎认不出形状。她的手指停在第三十七块砖上，那块砖比其他砖颜色深一点，像是被什么东西浸过。你问她那块砖怎么了。她说那天下了大雨，雨水顺着屋檐流下来，把那块砖染成了深色。那天的事你记得很清楚。你问她为什么记得。她说因为每一块砖她都记得。\\n\\n你们一起数。你数到一百二十的时候，忽然发现一个规律——她数砖的节奏不是均匀的。有的砖她手指停留的时间长，有的很快。长的停留像是在回忆，短的像是在跳过。你问她：你数的不是砖吧。她的手停了一下。她没有看你，继续往下数，说：数什么不重要。\\n\\n你陪她数了一个下午。从一百二十数到八百多。数到后来你觉得头晕，青砖看起来都一样了，她却一块一块分得清清楚楚。太阳斜了，影子被拉得很长，铺在那些青砖上，像另一套重叠的网格。她站起来拍了拍膝盖上的灰，说数完了。你问她明天还数吗。她说：明天再说。\\n\\n你后来去过很多次咸福宫。每次去，她不是在看书就是在浇花，或者坐在窗边发呆。她很少说话，但你说什么她都会听。有一次你跟她抱怨宫里的烦心事，说了很多。她听完以后给你倒了杯茶，说：你知道为什么我数砖吗。你摇头。她说：宫里的事太多，记不住。砖只有一千零四十二块，不多不少，好记。\\n\\n有一回你注意到她书房里放着一本账册，翻开一看，记的不是账，是人名和日期。你仔细看了看，发现每一个名字后面都跟着几件小事——某年某月某日，谁哭了；某年某月某日，谁笑了；某年某月某日，谁走了。你翻着翻着，发现这本账册比你想象的厚得多，纸张泛黄，边角卷曲，显然已经记了很多年。她站在门口看你翻账册，没有阻止。你问她这是什么。她说：闲来无事，随便记的。你翻到最后一页，最新的记录是你的名字。你看着她，她别开了目光。\\n\\n你忽然觉得这本账册比后宫里的任何密档都可怕。密档里记的是阴谋和算计，这本账册里记的是人。每一个人哭过的样子，笑过的样子，走的时候的背影。她没有评判，没有分析，只是记下来了。记了三十年。\\n\\n还有一回，她忽然说了一件事，让你记了很久。那天你们坐在咸福宫的厢房里，外头下着雨，雨水顺着屋檐滴在青石板上，节奏刚好和她数砖的速度差不多。她端着一盏茶，看着窗外的雨线，说了一句话：宫里每一个人的秘密，我都知道。你愣了一下。她继续说：不是打听来的，是看出来的。谁在谁面前撒了谎，谁对谁动了真格，谁笑的时候眼睛没动，谁哭的时候其实不伤心。我都看在眼里。你问她为什么不告诉别人。她低头吹了吹茶面上的浮叶，说：不是不能说。说了也没用。\\n\\n你没有追问她到底知道什么。你不敢问。你忽然觉得这个女人比你以为的要厉害得多——她不是不争不抢，她是争过了，发现没用，于是选择了一种比争更可怕的方式：记住一切，但什么都不说。三十年。她在这个谁都记不住她的地方，用数砖的方式把自己钉在了时间里。\\n\\n你走的时候她没有送你。你回头看了一眼，她还在窗前坐着，手指轻轻敲着窗棂，嘴里念着什么——也许在数砖的数字，也许在数别的什么。你走出咸福宫的院子，回头看了一眼那扇门，门是关着的。你不知道她在里面做什么，但她一定在。她总是在那里，安静地，不动声色地，把一切都看在眼里。"},duanfei:{n:"端妃（耿月宾）",h:"端妃",hc:"house-h",g:"female",s:{"loyalty": 1, "depth": 3, "bravery": 1, "rebel": 0, "humor": 0, "adventure": 0, "morals": 1, "wisdom": 3},t:["沉稳老练", "隐忍多年", "看透一切", "幕后操盘手"],r:"你和她一样，不急于一时的胜负。你相信时间和耐心比冲动更有力量。你的沉默不是软弱——是在等待。",tt:"《一盘棋》",tb:"端妃病了十二年，但她说过的话，每一句都准。\\n\\n你第一次留意到这个，是因为华妃。有一次在御花园，华妃因为一个小宫女摔了她的茶盏，当场要人掌嘴。端妃从假山后面走过，远远地说了一句：罢了。声音不大，像风吹过一片枯叶。但华妃听见了。她停下来，脸色变了一下，嘴唇动了动，最终摆摆手说算了，让她下去吧。你站在旁边，看着华妃转身离开，心里莫名觉得那声\\\"罢了\\\"像一枚钉子，钉在了什么关键的地方。\\n\\n后来你去看端妃。她的寝殿很暗，窗户关了一半，屋里有淡淡的药味。她靠在榻上，脸色苍白，嘴唇几乎没有血色。但你注意到她的眼睛是亮的——不是生病的人那种虚浮的亮，是清醒的、锐利的亮，像一把藏在布里的刀，你没看见刀刃，但你知道它在。\\n\\n她的窗边放着一盘棋。黑子白子散落在棋盘上，有的地方密密麻麻，有的地方空了一大片。你凑近一看，棋局没完。你问她这盘棋下了多久。她说很久了。你问她为什么不找人下完。她说：一个人下。你更奇怪了，一个人怎么下。她不回答，拿起一枚黑子，落在棋盘的一个空位上，然后端起茶杯喝了一口。\\n\\n你站在棋盘前看了很久。那些棋子看似杂乱，但你仔细看，能看出两股力量在互相绞杀——黑子往东，白子往西，中间夹着几颗孤立的子，像被困在敌营里的哨兵。你忽然觉得这盘棋像后宫。不是像棋局，像后宫里那些人——有的站了队，有的没站队，有的以为自己在下棋，其实只是棋盘上的子。你问她：你看的不是棋吧。她把茶杯放下，看了你一眼。那一眼很短，但你感觉到了——她不是在敷衍你，她是在打量你，看你够不够聪明，能不能看懂她给你看的东西。她说：你猜。你说是人。她没说是，也没说不是，只把茶杯端起来又喝了一口。\\n\\n你后来常去看她下棋。每一次去，棋盘上都会多一两颗子，但整盘棋的格局几乎没有变化。你问她这盘棋什么时候能下完。她说不急。你问她在等谁。她说：等该落子的人自己走过来。你不懂她在说什么，但你每次走的时候，都会回头看看那盘棋。那些黑白棋子安安静静地待在原地，好像它们一直就在那里，从很久以前就在那里，还会在那里很久很久。\\n\\n你试着跟她聊过朝堂上的事、后宫里的风波、妃嫔们最近又闹了什么矛盾。她听得认真，但很少发表意见。你问得急了，她只说一句话：再等等。你没等住，冲动之下做了一些后来让你后悔的事。再去找她的时候，她什么也没说，只是递给你一杯茶。你端着茶坐了很久，忽然明白了——她不是不关心，她是不想在火候不到的时候开口。她等的是那个\\\"刚刚好\\\"的时机，早了没人听，晚了来不及。\\n\\n后来后宫出了大事。有人告发一个妃子用巫蛊之术诅咒皇后，皇上震怒，连夜审问。所有人都慌了——被告发的妃子背后有势力，牵一发而动全身。有人急着撇清关系，有人忙着通风报信，有人连夜烧掉了往来的书信。整个后宫像被风吹乱的棋盘，子落得到处都是。你跑去问过几个娘娘的意见，每个人的说法都不一样，你站在走廊里，不知道该信谁。\\n\\n你去找端妃的时候，她坐在窗前喝茶。茶很淡，茶叶在杯底打着转。你问她怎么办。她把茶杯放下，看着窗外，说了一句话。你没听懂，但你记下了。三天之后，事情的发展跟她说的一个字都不差。\\n\\n你又去看她，还是那盘棋，还是那个位置，黑子白子都没有动过。你问她是怎么知道的。她靠在榻上，闭上眼睛，声音很轻：我只是看了太久。看累了。\\n\\n你站在窗前看她。窗外的光落在棋盘上，把那些黑白棋子照得清清楚楚。你忽然觉得这盘棋她不是在下，是在等——等那些自以为在下棋的人，把该走的都走完，然后她只需落最后一子。她把所有的力气都省下来，只用在最重要的一句话上。她现在就是这样。\\n\\n你走的时候，棋盘上多了一颗白子。你不知道她什么时候落的。你也没有问。"},wenchuchu:{n:"温实初",h:"太医",hc:"house-h",g:"male",s:{"loyalty": 3, "depth": 2, "bravery": 1, "rebel": 0, "humor": 0, "adventure": 0, "morals": 3, "wisdom": 2},t:["默默守护", "深情不求回报", "善良但软弱", "一生只爱一个人"],r:"你和他一样，是那种会默默做很多事但不说的人。你的爱不是轰轰烈烈——是细水长流。",tt:"《三步之外》",tb:"他的手搭在你腕上的时候，是温热的。\\n\\n你注意到了。不是因为你在意，而是因为那天很冷——窗外的雪压断了梅枝，屋里的炭盆也快熄了。一个刚从太医院走过来的人，手指应该是冰的。\\n\\n但他的不是。\\n\\n你看着他低头号脉的样子，睫毛上还有一点没化完的雪水。他的呼吸很轻，轻到你几乎听不见。你忽然想问他——你是用什么焐的手？袖口？胸口？还是揣在怀里走了很长一段路？\\n\\n你没问。他也没说。\\n\\n他只是号完脉，开了方子，站起来，退了三步，转身走了。\\n\\n你低头看了看自己的手腕——他碰过的地方还留着一丝暖意，像冬天里最后一口热茶。\\n\\n你叫住他，问他要不要喝杯热茶再走。他说不用了，然后站在门口犹豫了一下，又折返回来，把炭盆里的炭拨了拨，又添了两块。\\n\\n「炭快没了，」他说，「我让太医院的人送一些过来。」\\n\\n你看着他弯着腰拨炭的背影，忽然觉得这个人好像永远都在做一些没人要求他做的事。\\n\\n——\\n\\n后来你嫁了人，搬到了另一座院子。他再也没有来过。\\n\\n不是你叫他别来，是他自己不再来了。\\n\\n但你偶尔会经过太医院。透过半开的窗子，你能看见他的背影——还是那个瘦瘦的身形，还是那杆小铜秤，还是称药的时候反复核对分量，像每一钱都关乎人命。\\n\\n你有一次站在窗外看了很久。他抓完药，用纸包好，系上红绳，递给候在外面的人。那个人说了一声谢谢，他摇了摇头，没说话。\\n\\n你走进太医院，假装是来抓药的。你站在药柜前面，一个一个地看那些抽屉上的标签。他站在柜台后面，没有主动跟你说话。\\n\\n「你最近身体怎么样？」你问。\\n\\n「挺好的。」他说。\\n\\n「那就好。」你说。\\n\\n然后你走了。\\n\\n你走出太医院的时候，回头看了一眼。他还站在柜台后面，手里捏着那杆小铜秤，看着你离开的方向。\\n\\n你忽然觉得这个人一辈子都在看别人走远。\\n\\n——\\n\\n有一年秋天，你让丫鬟给他送了一包点心。不是什么贵重的东西，就是你自己做的小酥饼，芝麻馅的。\\n\\n丫鬟回来说，他接过去看了很久，久到丫鬟以为他不要了。然后他说：替我谢过夫人。\\n\\n丫鬟又说，她自作主张补了一句——娘娘说，您以前说过的那句话她一直记得。\\n\\n他问什么话。\\n\\n丫鬟说：三步之外，也是照顾。\\n\\n丫鬟说他听了以后低下头，嘴角动了一下。像是在笑，又像是忍着没笑。然后他转过身去拿药秤，没有再说话。\\n\\n你没再让丫鬟送过东西。不是因为不想，是因为你发现——有些心意送一次就够了。送多了，对方连收都不知道该怎么收。\\n\\n有一年春天，你在路上碰见他的学徒，学徒说温大人最近身体不太好，咳嗽了好些天。你让学徒转告他注意身体，别硬撑。\\n\\n学徒说：温大人说，有劳夫人挂心，无碍的。\\n\\n你问：他真的说了「有劳夫人挂心」？\\n\\n学徒说：是，一字不差，我还觉得奇怪，平时温大人不说这种话。\\n\\n你没有再说话。你在原地站了一会儿，然后继续走。\\n\\n你走了很远，又折回来，让学徒带了一包止咳的药回去，说是太医院发的，让他按时吃。你知道他会拆穿的。你也知道他拆穿了还是会吃的。\\n\\n——\\n\\n有一回你生了场大病，高烧不退。太医院的人来了又走，药吃了一副又一副，就是不见好。\\n\\n第三天夜里，你迷迷糊糊地睁开眼，看到他站在床边。\\n\\n他的眼睛是红的，像是很久没睡了。他伸手搭在你的腕上，手指的温度比你的额头还热。\\n\\n你抓住他的袖子，说：别走。\\n\\n他没有挣脱。他就那样站着，守了你一夜。\\n\\n第二天早上你退了烧。睁开眼的时候，他趴在床边的桌子上睡着了，手里还攥着你的方子。\\n\\n你没有叫醒他。你看了他很久，然后把自己的披风轻轻搭在了他的肩上。\\n\\n——\\n\\n有一年冬天，你在太医院外面的走廊上避雪。\\n\\n走廊很长，青砖地面上积了一层薄雪，脚印从这头延伸到那头。你靠在柱子上，目光落在旁边挂着的一只旧灯笼上。\\n\\n灯笼纸面已经发黄，竹骨架也歪了，底部坠着一根磨秃了的穗子。灯笼上写着四个字：医者仁心。\\n\\n你看了一会儿，伸手摸了摸灯笼底下的穗子。那种编织的纹路你认得——是他年轻时用过的。\\n\\n你问路过的老太医：「这只灯笼挂了多少年了？」\\n\\n老太医说：「打温大人进太医院就在了，少说也有十几年了。」\\n\\n你看着那只灯笼，忽然觉得它像一个人——旧了，歪了，没人记得了，但还挂着。\\n\\n你从袖子里掏出一根新的穗子，悄悄系在灯笼底下。颜色跟旧的一样，是那种洗了很多次以后褪成灰白的蓝。\\n\\n雪越下越大。你转身走进雪里的时候，回头看了一眼。\\n\\n灯笼在风里晃了一下，又稳住了。\\n\\n你知道他的仁心不在这四个字里。\\n\\n在他搭在你腕上那三根手指的温度里。\\n\\n在你搬走以后他再也没有迈过的那道门槛里。\\n\\n在一只挂在走廊上、没人记得、也没人摘掉的旧灯笼里。"},meiren:{n:"叶澜依（宁贵人）",h:"宁贵人",hc:"house-h",g:"female",s:{"loyalty": 1, "depth": 2, "bravery": 3, "rebel": 3, "humor": 0, "adventure": 2, "morals": 1, "wisdom": 1},t:["野性不羁", "冷面热心", "宁为玉碎不为瓦全", "一生只忠于自己"],r:"你和她一样，不屑于讨好任何人。你宁愿孤独也不要虚伪——这种野性，是你最珍贵的东西。",tt:"《豹子和铃铛》",tb:"你第一次见叶澜依，她正在驯一头豹子。豹子扑过来的时候她没有退，反而迎着它走了两步，伸手按在豹子的额头。豹子停住了，喉咙里发出一声低沉的呼噜。她笑了——那是一种你在后宫任何一个女人脸上都没见过的笑。不甜，不媚，不讨好，没有任何修饰，像一把刀从刀鞘里拔出来，亮得晃眼。\\n\\n你站在围栏外面看了一会儿。驯兽场的管事太监见是你，赶紧跑过来解释，说宁贵人野惯了，别见怪。你说：让她待着。你靠在围栏上，看她跟那头豹子说话。她的声音很轻，像在哄一个孩子，但你的直觉告诉你——那头豹子不是被她哄服的，是被她驯服的。区别在于，哄是商量，驯是命令。她不需要跟豹子商量。\\n\\n后来你发现她对什么都不在乎。皇上召她，她迟到。皇后赏她东西，她随手放在一旁不拆。妃嫔们聚会请她，她要么不去，去了也一个人坐在角落，别人说话她不听，别人敬酒她不喝。宫里的规矩在她眼里像不存在一样。你有一次问她：你就不怕得罪人吗。她说不怕。你说不怕皇上。她说不怕。你说不怕死。她说：死有什么可怕的，活着才可怕。\\n\\n你注意到她身上有一样东西。一枚很小的铜铃铛，挂在腰间，走路的时候会发出极轻的声响。不是宫里会赏的那种精致的铃铛，是那种民间小孩戴的，铜面上有划痕，铃舌已经磨得有点钝了。她走到哪儿都带着。洗澡的时候摘下来放在枕边，换衣裳的时候第一个找的就是它。你有一次故意在她面前碰了碰那个铃铛，她的手立刻按了上来，按得很紧，指节泛白。你看着她的手，她的手背上有一道浅浅的疤，像是很久以前被什么划的。你没再碰。\\n\\n你后来试过几次，想弄清楚那个铃铛的来历。你问过驯兽场的老太监，说不知道，说宁贵人刚来的时候就带着。你问过内务府的嬷嬷，说没有这物件的记档。你甚至有一次趁她不在的时候，偷偷看了一眼她放在枕边的铃铛——铜铃底下刻了一个极小的字，你已经看不清了，磨损得太厉害。但那不是宫里的刻法，是民间手艺人常用的那种歪歪扭扭的刀法。\\n\\n你问过一次那是什么。你们坐在驯兽场的台阶上，豹子在围栏里打盹，尾巴偶尔甩一下。你指着那个铃铛说：这个不值钱吧。她低头看了一眼，说：不值。你问那为什么一直带着。她沉默了一会儿，说：比整个后宫都贵重。你等她解释，她却反问你：你见过驯豹子的人吗。你说见过，今天见了。她说：驯豹子之前，要先让它闻你的味道。让它知道你不是食物，不是敌人。然后它才会听你的。你问她那个铃铛呢。她把铃铛拿起来，在指尖转了一圈。铃铛的声音很轻，像风穿过一条很窄的缝。她说：以前有个人送我的。那个人说，你走到哪儿，这个声音就跟到哪儿。不管多远，只要听见这个声音，就知道你在。你问她那个人呢。她没回答，把铃铛重新挂回腰间。\\n\\n你走了以后，很久没有去看她。不是不想去，是你不知道该跟她说什么。她不是那种能闲聊的人，她也不会配合你的寒暄。她只说她想说的话，只说她觉得有必要说的话。沉默是她的常态。\\n\\n你后来渐渐明白了，叶澜依不是不在乎任何东西，她只是不在乎这宫里的东西。皇上的恩宠不在乎，妃嫔的地位不在乎，宫里的规矩不在乎。但她在乎那个铃铛，在乎送铃铛的那个人，在乎一个你进不去的世界。她是这宫里唯一一个敢不做任何人的女人——不做皇上的女人，不做妃嫔，不做任何人期待她成为的样子。她只做叶澜依。\\n\\n有一天你路过驯兽场，远远地看见她站在那头豹子的围栏前面。她没有在驯豹子，豹子也没有扑过来。她就那么站着，背对着你，手搭在围栏上，一动不动。风从驯兽场的大门吹进来，吹起她的衣角。铃铛挂在她的腰间，发出极轻极轻的声响，像是在喊一个听不见的人。\\n\\n你站在远处没有出声。你知道她在想什么——不是豹子，不是皇上，不是后宫的任何事。她在想一个她回不去的地方。一个比整个后宫都贵重的地方。"},jinyu:{n:"槿汐",h:"甄嬛侍女",hc:"house-h",g:"female",s:{"loyalty": 3, "depth": 1, "bravery": 2, "rebel": 0, "humor": 0, "adventure": 1, "morals": 2, "wisdom": 3},t:["忠心耿耿", "智勇双全", "在低位但有高智慧", "一生只忠于一个人"],r:"你和她一样，是那种站在别人身后但不可或缺的人。你不需要站在聚光灯下——你知道自己的价值。",tt:"《她把所有的好都做在你看不到的地方》",tb:"你提前回了宫。\\n\\n不是因为你忘了带东西，是因为你突然觉得——这宫里你待了这么久，怎么从来没有在槿汐忙完的时候见过她？每次你睁眼，炭火已经烧好了。每次你坐下，茶水已经温了。每次你觉得冷了，披风就已经搭在了椅背上。她像一个永远在你前面半步的人，你永远只能看见她的背影，看不见她做事的样子。\\n\\n你推开后院的门，看见她了。\\n\\n她蹲在墙角，手里攥着一件你的旧衣裳，低着头，肩膀在发抖。没有声音。但你走近了，看到她手背上有一道被针扎破的口子，血珠子凝在那里，她没有擦。你站在门口看了很久。她不知道你回来了。\\n\\n你以为她在哭。其实不是。她是在补你那件冬衣——领口磨破了，她拆了原来的线，重新绣了一模一样的暗纹。天快黑了，她看不清针眼，凑得很近很近，近到你能看见她眼角的细纹，和鬓边那几根你不曾注意到的白发。她手边放着一个针线筐，里面全是你穿过的旧衣裳——每一件都被她补过，补得你根本看不出来哪里坏过。\\n\\n你忽然觉得嗓子发紧。\\n\\n你转身走了，没有叫她。你怕一开口，声音会发抖。\\n\\n——\\n\\n从那以后你开始留意。\\n\\n你发现每天早上的炭火总是最先烧起来的——你以为太监们勤快，后来才知道槿汐寅时就起了，蹲在炭盆前吹了半个时辰。手冻得通红，指节都裂了口子，缠着布条继续吹。你进来的时候火已经旺了，她只说了一句「天冷，夫人多穿些」，手藏在袖子里，你看不见。\\n\\n你发现你喝的茶永远温度刚好——不是运气好，是她每盏茶都先自己试一口。烫了就放着等，凉了就换新的。你端起杯子的时候，正是最舒服的时候。你有一天故意起得很早，想抓她一次。结果你走到厨房的时候，她已经在那里了——灶火刚生起来，她蹲在地上扇扇子，头发散着，穿一件洗得发白的旧袄。她看见你，慌慌张张地站起来，差点绊倒。你问她怎么起这么早，她说「睡不着」。你看着她通红的眼睛，知道她不是睡不着，是根本没睡。\\n\\n你发现你枕头上绣的茉莉花换了方向——原来你睡觉总是压着右边，她拆了重绣，把花移到了左边。你躺上去的时候，花正好朝上。你翻了个身，花还是朝上。她算好了你翻身的位置。你拿起枕头，翻过来看背面——针脚密密麻麻的，拆了绣、绣了拆，不知道反复了多少次才找到最合适的位置。\\n\\n你发现你出门时穿的那双鞋，鞋底比新的还软——她在你不穿的时候，用木楦撑了一整夜，又用手揉、用锤子轻轻敲，把硬底敲软了。你穿在脚上觉得舒服，她却从来没说过这双鞋是她处理过的。\\n\\n你发现你每次出门前，她都会站在门口看你一眼。不是那种「夫人请慢走」的看，是一种更复杂的看——像在确认你穿得够不够暖，像在把你的样子记下来，好等你回来的时候确认你还是那个样子。你每次回头，她都会立刻低下头，假装在整理门帘。\\n\\n你从来没有对她说过谢谢。不是因为你忘了。是因为你觉得谢谢两个字太轻了，轻到说出口反而像在敷衍。\\n\\n——\\n\\n你终于忍不住，有一天晚上去找她。\\n\\n她在偏房里叠衣裳。一盏小灯，一盆炭火，她坐在矮凳上，动作很慢——不是累，是她年纪大了，眼睛花了，但手还在做年轻时的事。你站在门口，没有敲门。她听见脚步声，回过头，看见是你，站了起来。\\n\\n「夫人，」她说，「外头冷，您怎么来了。」\\n\\n「槿汐，」你说，「你为什么从来不休息？」\\n\\n她的手顿了一下，继续叠。一件，两件，三件。叠得很整齐，边角对齐，折痕压平。\\n\\n「你不需要我休息，」她说，声音很平，像在说今天天气不错，「你需要我在。」\\n\\n你没有再说话。你想说「我也需要你休息」，但话到了嘴边咽了下去。因为你知道，她不会听的。对她来说，你的需要比她的身体重要一万倍。她把自己变成了一件工具——好用的工具不会休息，好用的工具只在用的时候才有意义。\\n\\n她叠完最后一件，站起来，吹了灯，走出偏房。你跟着她走到院子里。她停住了，回过头看了你一眼。院子里那棵梅树还开着。很多年前你进宫那天，它也开着。她站在树下看着你，和那时候一样。但你发现她的鬓角白了几根，背也弯了一点。\\n\\n你突然想，从你进宫到今天，她站在树下看了你多少次？你记不清了。她一定记得。她记得你的每一个习惯，每一件衣裳的尺寸，每一杯茶的温度。她把关于你的一切都记在了手上，刻在了针脚里，熬进了炭火里。\\n\\n你转身回了屋。\\n\\n第二天早上起来，炭火烧得正旺，茶放在桌上，温度刚好。你端起杯子，喝了一口。还是那个味道。你忽然觉得，这杯茶你喝了一辈子，也喝不够。\\n\\n你低头看了看自己的手——干干净净的，没有茧子，没有针眼，没有冻疮。你忽然想，这双手之所以能一直这么干净，是因为有另一双手，替你把所有脏的、累的、痛的活儿都干了。"},wanbi:{n:"浣碧（钮祜禄·玉隐）",h:"甄嬛侍女/侧福晋",hc:"house-h",g:"female",s:{"loyalty": 2, "depth": 1, "bravery": 2, "rebel": 2, "humor": 0, "adventure": 2, "morals": 1, "wisdom": 1},t:["不甘平凡", "有野心但忠诚", "身份焦虑", "为爱冒险"],r:"你和她一样，不甘心被命运安排。你想要更多——这不是贪婪，是你知道自己值得更好的。",tt:"《那支簪子是她自己的》",tb:"你发现了浣碧的一个秘密。\\n\\n她在学你。不是那种讨好的学——是偷偷摸摸地、见不得人地学。你写字的时候手腕微微向内倾，第二天你看到她握笔的姿势跟你一模一样。你说话前习惯先顿一下，她跟你说话的时候也开始先顿一下。连你泡茶时先温杯再投茶，她都学会了。但你发现她学得很笨——她的手天生不适合那样握笔，顿一下再说话让她显得结巴，温杯的时候烫到了指尖。\\n\\n你躲在门后面看了她很久。她以为没有人看见。她对着镜子练你的表情——笑的时候嘴角微微上扬，生气的时候眉头轻轻皱一下，连你叹气的声音她都模仿。她练了一遍又一遍，练到脸上的肌肉都僵了，还是觉得不像。\\n\\n你盯着她看了一会儿。她被你看得慌了神，手一抖，茶洒了一桌子。\\n\\n「姐姐，我——」\\n\\n你摆摆手让她下去，什么都没说。但你心里有个疙瘩。\\n\\n你不喜欢她学你。不是因为你觉得她在模仿你——是因为你心疼她。一个人要自卑到什么程度，才会连自己的行为方式都不敢有？\\n\\n——\\n\\n你决定问她。\\n\\n不是审问，是聊天。你叫她来陪你喝茶，挑了一个阳光好的下午，窗开着，风不大。你给她倒了一杯茶，她没有马上喝——她先温了杯，再投茶，动作跟你一模一样。你看着她，直到她觉得不自在。\\n\\n「你为什么总学我的样子？」\\n\\n她愣了一下，然后笑了一下，说没有。你看着她，她不笑了。她低头看着茶杯，手指攥着杯沿，攥得很紧，指节都泛白了。\\n\\n「因为我不知道，」她说，声音很小，像是怕被谁听见，「如果我不学姐姐，我该是什么样。」\\n\\n你没想到是这个答案。\\n\\n你问她：你喜欢什么颜色？她答不上来。你问她：你喜欢吃什么？她想了半天，说的全是你爱吃的。你问她：你有什么想要的？她摇头。\\n\\n不是因为她崇拜你。不是因为她想讨好你。是因为她活在甄嬛的影子里太久了——久到忘了自己长什么样。她从小就跟在你身边，穿你穿剩的衣裳，用你用过的东西，连别人夸她都会说「姐姐更好看」。她习惯了做你的影子，久而久之，她以为影子就是自己的样子。\\n\\n你看着她，第一次没有把她当成「甄嬛的妹妹」，而是当成一个人。一个不知道自己是谁的人。你忽然想到，她连名字都不是自己的——浣碧，这个名字是你给她的。她原来的名字，她从来没有告诉过你。\\n\\n你问她：你小时候叫什么？她张了张嘴，半天没说出声。然后她说：「太久了，忘了。」你没再追问。你知道她不是忘了，是那个名字被她藏在太深的地方，连她自己都不敢碰了。\\n\\n你给她倒了一杯新的茶，这次没有等她温杯。你说：「这杯是给你的，不用学我，怎么舒服怎么喝。」她接过去，手有点抖，喝了一口，烫到了，但没有缩回去。\\n\\n——\\n\\n有一天你去找她，她正坐在镜子前。\\n\\n你站在门口没有进去。她不知道你在看。\\n\\n她把手里那支金步摇取下来，放到桌上。那支簪子跟你戴的一模一样——不，是一样得过了头。你仔细看，会发现她买的那支比你的更精致，更用力，更像是在证明什么。金镶得更多，珠串得更密，花雕得更细——她觉得越像你，就越好。然后她从抽屉里拿出一支很普通的木簪，插到头上。\\n\\n那支木簪很丑。木头不平整，颜色不均匀，上面还有一道划痕。但她插上去的时候，手没有抖。\\n\\n她对着镜子看了一会儿，笑了一下。\\n\\n那个笑不像你的笑。你的笑是练过的，得体、温润、让人挑不出毛病。她的笑很笨拙，嘴角歪了一点，眼睛眯了一下，牙齿露出来一颗——难看，但是真的。\\n\\n「这支是我自己的。」她对着镜子里的自己说。\\n\\n你没有进去。\\n\\n你转身走了，心里像被什么东西撞了一下。很轻，但很深。\\n\\n——\\n\\n后来她出嫁那天，你没有去看热闹。\\n\\n你站在院子里，听见远处的锣鼓声。丫鬟们说新娘子哭得很厉害，妆都花了，眼睛肿得跟桃一样。没有人学甄嬛——甄嬛哭的时候不会那样，甄嬛的眼泪是一滴一滴掉的，她是一整张脸都皱起来，哭得很难看。她的头发散了，簪子歪了，喜服也被眼泪浸湿了一大片。所有人都笑她没规矩，连喜婆都说「新娘子哪有哭成这样的」。\\n\\n但那是她自己的哭。\\n\\n你低头看了看桌上那支金步摇——是她之前学你的时候买的，一模一样的两支，一支送了你，一支留给了自己。你今天第一次注意到，两支其实不太一样。你的那支完美无瑕。她的那支上面有一道很细的裂纹——不是做工不好，是她自己磕的。她磕了一道裂纹，让自己那支变得不完美，变得跟你的不一样。\\n\\n你拿起那支有裂纹的簪子，在手里转了一圈。阳光照在上面，裂纹变成了一条金色的线。你忽然觉得，那道裂纹比任何雕琢都好看。因为那是她自己留下的印记——不完美，但是真的。\\n\\n你走到窗边，听见锣鼓声越来越远了。你想起她对着镜子说的那句话——「这支是我自己的。」你忽然觉得，她终于找到了那支簪子。"},chun贵人:{n:"淳贵人",h:"淳常在",hc:"house-h",g:"female",s:{"loyalty": 1, "depth": 0, "bravery": 1, "rebel": 0, "humor": 3, "adventure": 1, "morals": 2, "wisdom": 0},t:["天真烂漫", "不谙世事", "纯真到让人心疼", "短暂但耀眼"],r:"你和她一样，有着一份难得的纯真。不是傻——是你选择用善意看待这个世界。",tt:"《她是这后宫里唯一一张真脸》",tb:"你在半夜被一阵笑声吵醒。\\n\\n不是那种妃嫔们互相试探的笑，不是那种太监们讨好主子的笑，是那种憋不住的、从喉咙里直接冲出来的笑。你披了衣服走出去，走廊上没有人，只有一盏灯笼在风里晃，影子拉得很长。然后你看见她了。\\n\\n淳贵人蹲在走廊拐角，手里捧着一只西瓜，瓜瓤已经被她掏了一半，汁水流了满手。看见你来了，她笑得更大声了，像个做了坏事被发现的小孩，但完全没有要停的意思。\\n\\n「夫人！」她说，嘴里还含着西瓜，「我偷的！」\\n\\n你没有问她为什么偷。你问她：为什么笑？\\n\\n「因为甜啊。」她掰了一块递给你。你接过来咬了一口，确实甜。西瓜汁顺着你的手腕往下流，她没有笑你，因为她自己也在流。她用手背擦了擦脸，结果把西瓜汁抹了一脸，更脏了。然后她又笑了。\\n\\n你就这样蹲在她旁边，吃完了一只偷来的西瓜。月亮挂在天上，走廊里只有你们两个人。她没有说宫里的事，没有说谁又得宠了，没有说谁又失势了。她说的是御花园里新开了一丛月季，她说厨房的桂花糕比上个月好吃了，她说她小时候家门口有一棵很大的枣树，她爬到树上去摘枣子，摔下来三次，第四次终于摘到了。\\n\\n你听着，觉得很久没有听过这样的话了。\\n\\n——\\n\\n从那以后你开始留意她。\\n\\n你发现她在这个宫里活得像个异类。所有人都戴着面具——妃嫔们见面先笑再说话，笑容的弧度都算好了，嘴角上扬三分、露出六颗牙齿，多一分太谄、少一分太冷。太监们低着头但眼睛到处看，像蛇一样。宫女们走路像踩在棉花上，轻得没有声音。只有淳贵人，她高兴就笑，不高兴就噘嘴，想吃桂花糕就让厨房做，想出去玩就往外跑，跑得太急了还会摔倒。摔倒了也不哭，爬起来拍拍膝盖继续跑。\\n\\n所有人都说她傻。\\n\\n你不这么觉得。你反而觉得，她是这后宫里唯一一个用真心活着的人。她不是不知道这宫里的规矩——她只是不在乎。她不是看不懂别人的眼色——她只是不想看。她像一个不知道冬天会来的孩子，在秋天里拼命地玩，拼命地笑，拼命地吃桂花糕。她不知道有些东西是会消失的。\\n\\n所以你开始担心她。\\n\\n你跟她说过很多次：你这样不行，你得学着收敛一点。她每次都点头，每次都笑，下次还是老样子。你看着她，心里像悬着一块石头。你知道这宫里容不下真心，但你不知道该怎么办。你教她怎么说话、怎么走路、怎么笑，她学不会。不是她笨，是她学不会装。有一次你教她见皇上该说什么，她背了三遍，第四遍的时候忽然说：「夫人，为什么见皇上不能说真话？」你答不上来。\\n\\n有一天你看见她在御花园里追蝴蝶。她追了半天没追到，摔了一跤，膝盖破了。她没有哭，坐在那里看了一会儿蝴蝶飞走的方向，然后笑了。她说：「它飞得好高啊。」你走过去，蹲在她旁边，问她疼不疼。她说疼，但蝴蝶好看。你问她要不要回去擦药，她说等一会儿，等膝盖不疼了再回去。你真的就陪她坐了一会儿，看蝴蝶飞远。\\n\\n你站在远处看着她，觉得她像一朵开在冬天的花——很美，但是活不久。\\n\\n——\\n\\n有一天你问她：你不觉得宫里闷吗？\\n\\n「闷啊。」她说，蹲在台阶上，手里拿着一块桂花糕，腮帮子鼓鼓的，「可是有桂花糕就不闷了。」\\n\\n她转过头看着你，很认真地说：「夫人，你是不是很久没有笑过了？」\\n\\n你没有回答。\\n\\n她也没有再问。她把最后一口桂花糕塞进嘴里，拍拍手上的碎屑，跑了。跑的时候摔了一跤，爬起来继续跑，头也不回。\\n\\n你站在原地，觉得心里像被什么东西扎了一下。不疼，但是空了一块。你突然想不起来上一次真心笑是什么时候了。你想了很久，想不起来。你试着笑了一下，嘴角动了动，但那个笑没有到眼睛里。\\n\\n——\\n\\n后来她不在了。\\n\\n不是病死的，不是被打入冷宫——就是不见了。有一天你还在想，她今天会不会又来偷西瓜，然后就没有然后了。没有人告诉你她去了哪里，也没有人告诉你她为什么不在了。这宫里消失一个人，就像风吹走一片叶子，连声音都没有。你去问别人，别人都说不知道。你问多了，别人就不说话了。\\n\\n你去了她最喜欢待的那个角落。走廊拐角，那块她蹲着偷吃西瓜的石头上，落了一层桂花。秋天已经过了，桂花是去年落在那里的，已经干了，风一吹就散。你坐了上去。\\n\\n石头很凉。比她走之前凉了很多。你手里不知道什么时候攥着一块桂花糕——是你让厨房做的，但做出来之后你没有吃。你就那么攥着，坐了很久。桂花糕凉了，干了，碎成了渣，从指缝里掉出来，落在石头上，跟去年的桂花混在一起。\\n\\n你没有吃掉它。你坐在那里，看着那些碎渣和桂花，觉得石头比她走之前凉了很多。风从走廊那头吹过来，你听见远处有人在笑——不是她，但很像。你回过头去看，什么都没有。"},zhaogege:{n:"赵格格（祺贵人）",h:"祺贵人",hc:"house-h",g:"female",s:{"loyalty": 1, "depth": 0, "bravery": 2, "rebel": 2, "humor": 1, "adventure": 1, "morals": 1, "wisdom": 0},t:["骄纵任性", "直来直去", "被宠坏的真诚", "不坏但蠢"],r:"你和她一样，不会拐弯抹角。你喜欢什么讨厌什么都在脸上——这种直率，在这个世界其实很珍贵。",tt:"《她连讨厌都坦坦荡荡》",tb:"你最喜欢的那支簪子不见了。\\n\\n你找了一整天。翻遍了妆匣、抽屉、衣柜，连床底下都看了。最后有个小宫女怯怯地告诉你：被祺贵人借走了，没跟你说。\\n\\n你去她那儿要。她正对镜插花，穿着一身大红，头上插满了金钗，头也不回。\\n\\n「一根簪子而已，你至于吗？」\\n\\n至于。那支簪子是你娘留给你的。你进宫的时候，你娘把簪子塞到你手里，说「想家的时候就看看它」。你看了她一眼，没有争。不是因为你大度，是因为你觉得跟这种人说不通——她连借别人的东西都不打招呼，你还能指望她懂什么叫「念想」？\\n\\n你转身走了。\\n\\n第二天早上，那支簪子出现在你桌上。旁边还多了一支一模一样的。\\n\\n丫鬟说：祺贵人天没亮就跑来了，放下就走了，什么话都没留。\\n\\n你拿起那支新的。做工一模一样，连上面那道你小时候不小心磕出来的划痕都仿出来了——她不是去买的，是拿着你原来的那支，跑了一整夜去找人连夜做的。你摸了摸那支新的，边角还是热的。你问她怎么找到的人，丫鬟说：「祺贵人跑遍了全京城的银匠铺子，最后才找到一个能仿的。人家说做不了，她就蹲在人家门口等，等到人家答应。」\\n\\n你愣了很久。\\n\\n——\\n\\n从那以后你开始重新看这个人。\\n\\n你发现她虽然烦，但烦得坦荡。她不喜欢你就当面说不喜欢，不背着你跟别人说坏话。她抢了你的风头会告诉你「我就是比你好看」，但不会在你背后捅刀子。她想要什么就直说，不装大方，不扮可怜。后宫里对你笑的人很多——她们笑的时候嘴角上扬的弧度都一样，眼睛却冷得像冰。她们当面叫你姐姐，转头就叫你的名字。她们给你送东西，转头就跟人说你坏话。\\n\\n祺贵人从来不笑。但她说的话，你反而敢信。\\n\\n有一次你跟别的妃嫔说话，她在旁边插了一句：「你少听她的，她嘴甜心苦。」那个人脸都绿了。你心里却觉得——她说得对。你知道那个人确实嘴甜心苦，但你不能说。你说了就得罪人。祺贵人不在乎得罪人，所以她说了。\\n\\n你开始觉得，这宫里最安全的人不是最聪明的，是祺贵人这种。因为你知道她会怎么对你——她会当面怼你，但不会背后害你。你知道她烦，但她烦得干净。你甚至开始有点依赖她——不是依赖她这个人，是依赖她的真。在这个宫里，真话比金子还贵，而她是唯一一个免费给你真话的人。\\n\\n有一次你问她：你为什么总是这么说话？不怕得罪人吗？她说：「得罪就罪呗，我嘴长在脸上，又不是长在别人嘴里。」你说：那万一有一天得罪了得罪不起的人呢？她愣了一下，然后说：「那就得罪呗，我又不是来讨好所有人的。」\n\n你想起有一次宫宴，所有人都穿得花枝招展，只有她穿了一身素色。有人问她怎么不打扮，她说：「我长得好看，穿什么都好看。」所有人都笑了，但不是嘲笑——她说的是实话。你也笑了，那是你在那场宫宴上唯一一次真心笑。\n\n——\n\n有一次她闯了祸，被罚跪在殿外。所有人都躲着她——怕沾上麻烦，怕被连累。连她自己的宫女都低着头绕着走。你站在门口看了很久，看见她跪在太阳底下，背挺得笔直，头昂着，像在跟谁较劲。她的嘴唇干裂了，但没有低头求过一句。你看见她的手攥成拳头，指甲嵌进了掌心，但她的背没有弯。\\n\\n你去了。\\n\\n她看见你，嘴硬说：「谁让你来的？」\\n\\n你没有理她，走过去坐下，陪她一起跪。膝盖磕在石板上，疼。你不说话，她也不说话。过了好一会儿，她小声嘟囔了一句：「你不用来，我又没求你来。」\\n\\n你没有理她。\\n\\n又过了一会儿，你看到她的眼圈红了。她拼命眨眼睛，想把眼泪憋回去，但没成功。她偏过头去，不让你看。\\n\\n「你是第一个，」她说，声音有点哑，「不是因为怕我才来的人。」\\n\\n你没有安慰她。你也不需要安慰她。你们两个就那么跪着，直到太阳落山。影子被拉得很长，你们的影子叠在一起，分不清谁是谁的。\\n\\n——\\n\\n后来她失宠了。\\n\\n你去偏殿看她。她一个人在整理屋子，头上没有花了，衣服也是素的。那间偏殿很空，墙上的画都被人拿走了，只有一幅还挂着——画得歪歪扭扭的，是她自己画的。屋里的家具少了一半，剩下的也是旧的、破的。但她整理得很认真，一件一件地摆，摆歪了就重新摆。\\n\\n她看见你进来，说：「你看，我连幅像样的画都没有。」\\n\\n你没有说话。你走过去看了看那幅画——画的是一只簪子。和你娘留给你那支，一模一样。画得不像，但你认得出来。她画的每一根线条都在努力回忆那支簪子的样子。笔触很重，像是要把簪子刻进纸里。\\n\\n她转过身继续收拾东西，动作很快，像是怕你看到她脸上的表情。\\n\\n你还是看出来了——她笑了。很难看，但是真的。"},sūpéisheng:{n:"苏培盛",h:"大太监",hc:"house-h",g:"male",s:{"loyalty": 2, "depth": 2, "bravery": 1, "rebel": 0, "humor": 1, "adventure": 0, "morals": 1, "wisdom": 3},t:["精明世故", "忠诚但不盲从", "低位但有影响力", "看透一切但不说"],r:"你和他一样，是那种在别人看不到的地方掌控局面的人。你不显眼——但没有你，什么都转不动。",tt:"《灯笼》",tb:"乾清宫的走廊，苏培盛每晚子时都要走一遍。不赶时间，不偷懒，不多一步，不少一步。\n\n你发现这件事纯属偶然。那天夜里你睡不着，披了件外袍出来透气，远远看见一盏灯笼在乾清宫的廊道里慢慢移动。灯笼的光很暗，像一颗快要熄灭的火星。你以为是哪个守夜的太监偷懒打盹，走近了才看清，提着灯笼的人是苏培盛。\n\n你没有出声。你跟在后面，隔了十几步远。\n\n乾清宫的走廊很长，朱漆的柱子在月光下泛着暗红的光。苏培盛走得很慢，灯笼的光把他的影子投在廊柱上，那影子比他人还瘦。他在第一个转角处停了下来，站了一会儿，大约三息的时间。然后继续走。第二个转角，又停。第三个，也停。\n\n你数了数，从乾清宫正门到尽头，一共七个转角。他每一个都停。\n\n你终于忍不住，在第四个转角处快步走上前，堵在他面前。他停下来，没有惊讶，像是早就知道你跟在后面。\n\n你问他：你在看什么。\n\n他说，什么都没看。\n\n你说，那你为什么在每个转角都要停一下。\n\n他沉默了一会儿，说，每个转角都死过一个人。\n\n你说，我知道。\n\n他说，你不知道。你知道的是谁死了，不知道的是他们死的时候在想什么。他说这句话的时候，语气很平，像在说今天天气不错。可他的手攥着灯笼的竹柄，指节泛白。\n\n你走到他身边，第一次仔细看他的脸。你忽然发现他比你以为的要老很多。不是皱纹那种老，是一种从骨头里渗出来的疲倦。他的眼睛很亮，但那种亮不是精神好，是熬了太多夜之后眼睛失去休息能力的那种亮。\n\n他忽然说，你想听一个故事吗。\n\n你没有回答。他就当你是答应了。\n\n他说，我年轻的时候，也想做一个抬头挺胸的人。他说这句话的时候笑了一下，笑容很淡，像水面上一闪而过的光。后来我发现，低头活着比昂首站着需要更大的勇气。昂首站着只需要胆量，低头活着需要忍。忍一辈子，比忍一天难一万倍。\n\n你没有追问那个故事是什么。有些话一旦说破，就不值钱了。你只是站在那儿，把他说的那句话在心里默默重复了一遍——低头活着比昂首站着需要更大的勇气。你想，这宫里有太多人以为苏培盛只是一个会察言观色、会传话递信的奴才。没有人想过，一个低头低了四十年的人，需要消耗掉多大的力气。\n\n你们就这样并肩站在乾清宫的走廊里，灯笼的光把你们两个人的影子叠在一起。他指着第三个转角说，这里死过一个宫女，因为说错了一句话。他又指着第五个转角说，这里死过一个答应，因为生错了病。每一个转角，一个故事。他记得每一个。\n\n他说，我在这宫里四十年，听过的话比吃过的饭还多，可我记得的，没有几句。我记住的，都是没人愿意记住的。\n\n他顿了顿，又补充了一句：那些名字，我都在心里记着。不是记在纸上，是记在这儿。他用手拍了拍胸口，声音很轻，像怕惊醒了什么。\n\n你把灯笼举高了一些，凑近看了看。灯笼是竹篾扎的骨架，纸面糊得不太平整，边角处已经起了毛。那只兔子画得歪歪扭扭，耳朵一长一短，眼睛一大一小，嘴巴歪向左边。整只兔子看起来像是喝醉了。\n\n你说，这是你画的。\n\n他说，嗯。进宫前，家里有个妹妹属兔。她走的那年，我画了这只兔子，后来就一直带着。\n\n你没有再说话。你低头看那只兔子，看了很久。那是你在这个宫里见过的最丑的一幅画。也是你见过的最好看的一幅画。\n\n灯笼的纸已经发黄了，边角起了毛，竹柄被磨得光滑如玉。你能感觉到上面有三十年的体温，一层一层地叠在一起，透过薄薄的纸面传到你的掌心。\n\n苏培盛把灯笼递给你。\n\n你说，给我做什么。\n\n他说，拿着吧。我提不动了。\n\n苏培盛已经走了。他走的时候没有回头，脚步还是那么慢，不快不慢，像在丈量这条走廊还剩多少步。\n\n你提着那盏灯笼站在原地。灯笼的光映在你脸上，暖的。你把灯笼举高了一些，光线照到了走廊尽头的墙壁，上面有一道浅浅的刻痕。你走过去摸了一下，刻的是两个字，笔迹很幼稚，但一笔一划写得很认真。\n\n你看不太清那两个字是什么。但你没有再凑近去看。有些东西，不知道比知道好。\n\n你提着灯笼往回走。走廊很长，你走得很慢。你学着他的样子，在每个转角处停了一下。第一个转角，你想起他说的那个宫女。第二个转角，你想起他说的那个答应。第三个转角，你什么都没有想，只是站了一会儿。\n\n回到屋里，你把灯笼放在窗台上。窗外的月亮很圆，灯笼的光在月光下显得很弱。但你知道，等到了夜里，等到月亮下去，这盏灯笼会亮着。就像那个提着灯笼的人，在所有人都睡着的时候，还在走那条走了四十年的路。"},caoguiren:{n:"曹贵人（曹琴默）",h:"曹贵人",hc:"house-h",g:"female",s:{"loyalty": 0, "depth": 2, "bravery": 1, "rebel": 0, "humor": 0, "adventure": 0, "morals": 0, "wisdom": 3},t:["心机深沉", "为女谋算一切", "表面温和内心狠毒", "母爱扭曲"],r:"",tt:"《最后一页》",tb:"曹贵人的账册上记的不是银两，是人心。\n\n你翻到第三十七页，上面写着你妹妹的名字。旁边注了一行小字：性躁，易怒，受不得委屈。你合上账册，手指在封面上停了一会儿。这账册你本来是替皇后查账才借来的，里面记满了后宫每一个人的弱点、把柄、可以用来要挟的东西。你一页一页翻过去，像走进了一间摆满了刀的房间。\n\n然后你翻到最后一页。\n\n最后一页没有记录任何人的秘密。只有一行字：温宜。\n\n你盯着那两个字看了很久。那是整个账册里唯一没有附注弱点、没有附注把柄、没有附注利用价值的名字。只有两个字，干干净净的，像一滴水落在宣纸上，不洇不散。\n\n你去找她，不是为了对质，是为了搞清楚一件事——一个把后宫所有人的弱点都记在册子上的人，到底会不会有软肋。\n\n你到的时候，温宜正发烧。小丫头裹在被子里，脸烧得通红，嘴里含含糊糊地喊着什么。曹贵人坐在床边，手里攥着一条湿毛巾。她的手很快地在水里浸一下，拧干，敷在温宜的额头上。再浸，再拧，再敷。她的手在抖。那条毛巾在她手里变得不听使唤，水滴滴答答地落在床沿上。\n\n你站在门口看了她好一会儿。那个永远冷静、永远在算计的女人，此刻慌了神。她的头发散了一缕在额前，她没空去理。她的嘴唇抿成一条线，那是她极力克制自己的时候才会有的表情。\n\n你说，要不要叫太医。\n\n她说，已经叫了。\n\n你说，那你手抖什么。\n\n她低下头，看着自己发抖的手，像是第一次发现这双手也会不听使唤。她说，我不知道。\n\n你走过去，从她手里接过毛巾，在水里浸了浸，拧干，敷在温宜的额头上。你做的动作和她一模一样，只是你的手不抖。\n\n你坐在她旁边，轻声问：你做了这么多，不怕以后温宜恨你吗。\n\n她没有立刻回答。她看着温宜烧得通红的脸，看了很久。然后她说，怕。\n\n停了停，又说：但我更怕她活不到恨我的那一天。\n\n你没有再说话。屋里只有炭火噼啪的声音，和温宜急促的呼吸声。\n\n你注意到床边的小几上放着一件小小的衣裳，是温宜的。曹贵人白天还在给它绣花——一朵小小的玉兰，针脚细密，一丝不苟。那双手白天捏针的时候稳得像铁，晚上拧毛巾的时候却抖得不成样子。\n\n你拿起那件衣裳看了看。玉兰花瓣的边角处有一小块暗红色的痕迹，像是绣的时候被针刺到了手指，血滴在了上面。她没有拆掉重绣，而是用针线把那滴血迹缝进了花蕊里，变成了花心。\n\n你问她：这朵花绣得真好，温宜一定喜欢。\n\n她没有抬头，手里的针线停了停，说：她喜欢什么颜色，喜欢吃什么，怕什么，不怕什么，我都记着。这宫里的人记的都是别人的短处，我记的只有她的喜好。\n\n你说，你记了多少。\n\n她这才抬起头，看了你一眼。那是你第一次在她眼睛里看见真实的东西——不是算计，不是防备，只是一种极深的、你叫不出名字的疼。她说，你知道她第一次喊我额娘是什么时候吗。你摇头。她说，是她刚会说话，叫了每个人一遍，叫到我的时候，叫的是额娘。我以为她不懂，只是随口叫的。可那天晚上我一个人坐着，把那两个字在心里翻来覆去，翻了很久。\n\n太医来了，开了方子，抓了药，走了。你留下来，陪她熬了一整夜。\n\n温宜睡着后，曹贵人走到窗边，背对着你。她的声音很轻，像是自言自语：我进宫那年，也是这个年纪。那时候我以为，只要够聪明，就能活得体面。后来才明白，这宫里没有体面，只有活着。\n\n她没有回头。但你看到她的肩膀微微起伏了一下，又很快恢复了平静。\n\n天快亮的时候，温宜的烧退了。她睁开眼，看见曹贵人，嘴角微微动了一下，喊了一声：额娘。\n\n曹贵人手里捏着一根针，正在补温宜的小衣裳。那声额娘喊出来的时候，针从她指间滑了下去，落在地上，发出极轻的一声响。她弯腰去捡，你没有看到她的脸。但你看见她的肩膀在抖。\n\n你站起身，走到窗边。窗外天已经蒙蒙亮了，院子里的玉兰树开了一朵白花。你忽然想，曹贵人绣进衣裳里的那朵玉兰，是不是就是照着院子里这棵树绣的。她记得这么多事情，却从来不说，就像这棵玉兰树，每年都开，从不解释自己为什么开。\n\n你回头看了一眼那本摊在案上的账册，最后一页朝上，那两个字还在那里。\n\n温宜。\n\n你走过去，伸手替曹贵人把那本账册合上了。\n\n你走到门口的时候，听到身后传来一声极轻的叹息。你没有回头。你知道，那是她第一次在别人面前卸下防备。而那本合上的账册，也许是她这辈子唯一一次主动收起的刀。你站在门口停了一下，想说点什么，但什么也没说。有些事，说了反而轻了。你只是轻轻把门带上，让她在里面多待一会儿。"},liuzhu:{n:"流朱",h:"甄嬛侍女",hc:"house-h",g:"female",s:{"loyalty": 3, "depth": 0, "bravery": 3, "rebel": 0, "humor": 1, "adventure": 1, "morals": 3, "wisdom": 0},t:["忠心到死", "热血冲动", "替主赴死", "最纯粹的忠诚"],r:"",tt:"《卷刃》",tb:"碎玉轩闹刺客那天，流朱冲在最前面。她手里拿的是一把剪灯芯的剪刀——连刀刃都不锋利。\n\n你把这件事反复想了很多遍。一个连鸡都没杀过的小丫头，拿着一把钝剪刀，正面迎向一个腰佩钢刀的刺客。她把刺客吓住了。就那一下，侍卫赶到了。刺客被制服了。碎玉轩保住了。\n\n你把她叫到跟前，拿起那把剪刀看。刃口卷了，木柄裂了一道缝，合页处松松垮垮的。你说：这剪刀还能用吗。\n\n她说：能，剪灯芯够了。\n\n你问她：你不怕吗。\n\n她说：怕。\n\n你问她：怕为什么还要冲在前面。\n\n她说：因为我怕你受伤，比怕自己受伤更多。\n\n她说这句话的时候语气太平了，像在说一件日常小事。但你看到她的手——攥着那把剪刀，指节绷得发白，虎口裂了一个口子，血已经凝成了暗褐色。她自己大概都没注意到。\n\n你拉过她的手，替她清洗伤口。水碰到裂口的时候她缩了一下，但马上又把手伸回来，任你洗。你说疼就喊一声。她说，不疼。\n\n你知道她在撒谎。但她不愿意喊疼，你也没有拆穿她。\n\n你把她的手包好，让她去休息。她不坐。她说她得去把院门修一修，刺客撞坏的木门还歪在那里。你让她等明天叫工匠来。她说不用，她能行。你看着她搬来梯子，拿着锤子和钉子，一下一下地敲。她的动作很笨拙，锤子砸到了手指也没吭声，只是甩了甩手，继续敲。\n\n你走过去夺下她手里的锤子。她说娘娘我来就行。你没理她，自己爬上去钉好了那扇门。你从梯子上下来时，看到她站在下面，眼睛红红的。你说，哭什么。她说没哭，风大。\n\n你把锤子塞回她手里，说，你连锤子都拿不稳，还说能行。她低下头，没说话。你看着她手指上渗出的血，心里一阵酸。你忽然意识到，这个丫头不是不怕疼，她是怕你担心。你替她把伤口又包了一层，问她疼不疼。她说不疼。你说，流朱，你不用什么都跟我说不疼。她愣了一下，然后很轻声地说：我知道。但说了也没用，娘娘还是会担心。你一时语塞。你不知道该怎么告诉她，她让你担心，比她受伤本身更让你难受。\n\n冬天的时候，碎玉轩的炭不够用了。你去库房找管事的人，他说炭要等上面批下来才发，让你回去等。你问他要等多久，他说不知道，看上面的意思。你回到院子里，看见流朱蹲在廊下，把她自己的那床薄被拆了，里面的棉絮抽出来，塞进了你屋里的炭盆。棉絮烧起来烟很大，呛得人直咳嗽，但至少有一点暖意。\n\n你找到她的时候，她正站在雪地里跺脚，说等管事的心情好了再进去求。你远远看见她，棉鞋已经被雪浸透了，鞋尖结了一层薄冰。她的脚在雪地里冻得发紫，但她看见你的时候，笑是暖的。\n\n你说：娘娘你怎么来了，奴婢马上就好。\n\n你没有让她马上就好。你走过去，把身上的狐裘脱下来裹在她身上。她愣了一下，说：娘娘你自己不冷吗。你说：冷。所以你也别冻着。\n\n她笑起来，眼睛弯成两道月牙。那个笑容里有一种你在这个宫里很久没有见过的东西——不是讨好，不是讨好。是纯粹的、没有杂质的东西。\n\n后来碎玉轩的日子好了起来。炭够了，衣暖了，饭也丰盛了。但流朱还是第一个起床最后一个睡。你问她什么时候歇歇。她说等你不需要我的时候。你说那一天可能永远不会来。她说：那最好。\n\n你没有再劝她。你知道劝不动。有些人就是这样的，她们生来就是为了站在你前面，替你挡风，替你挨刀，替你把所有的危险都挡在身后。\n\n有一天夜里你起来喝水，经过廊下时看见流朱坐在台阶上，手里拿着那把剪刀，在磨。磨刀石很旧了，剪刀在上面来回滑动，发出沙沙的声响。月光照在她的背上，她的肩膀很瘦，但坐得很直。你站在廊柱后面看了她一会儿，没有出声。\n\n她磨完了，把剪刀举起来，对着月光看了看刃口。然后合上剪刀，收进袖子里，站起来伸了个懒腰，转身回屋。她从头到尾都没有发现你在看她。\n\n你走回屋里，把窗子关上。窗外的雪还在下，院子里的梅花开了一枝。你忽然想起她冻得发紫的脚和那个暖烘烘的笑，觉得这个冬天其实也没有那么冷。\n\n你把她的那把卷刃剪刀收在了梳妆台的抽屉最深处。它不能再剪灯芯了。但你舍不得扔。每次拉开抽屉看到它，你都会想起那个站在刺客面前、手抖着却不肯退后半步的身影。她不是勇敢，她只是觉得，你比她重要。\n\n你不知道该拿这个认知怎么办。你只知道，从那天起，每次你出门，你都会先看一眼她有没有跟上来。不是为了让她保护你，只是觉得，只要她在你旁边，这个地方就能安全一点点。哪怕她手里只有一把卷了刃的剪刀。你想，也许这就是她一直想告诉你的——我不是武功高强的人，我也不是什么都不怕的人。我只是不愿意让你受伤。就这一件事，我愿意豁出去。"},huangtaihou:{n:"太后（乌雅氏）",h:"太后",hc:"house-h",g:"female",s:{"loyalty": 1, "depth": 3, "bravery": 1, "rebel": 0, "humor": 0, "adventure": 0, "morals": 0, "wisdom": 3},t:["老谋深算", "后宫真正掌权者", "为大局牺牲一切", "冷面但清醒"],r:"",tt:"《念珠》",tb:"太后在寿康宫念了四十多年的金刚经。有一天她念着念着，忽然停了。\n\n你问她怎么了。\n\n她说念腻了。\n\n你以为她在说笑。但她没有。她把念珠放在膝上，双手搭在念珠上面，眼睛望着佛堂正中央的那尊金身佛像，说了一句让你意外的话。\n\n她说，这四十年里，哀家念的每一遍金刚经，都不是为自己念的。\n\n你没有接话。你知道这句话不是随便说的。太后很少说心里话，她说出来的每一个字，都是斟酌过无数遍的。像一颗石子投入深井，你要等很久才能听到回音。\n\n你没有退下。你走进去，在佛堂角落的蒲团上坐下。你不说话，也不念经，就这么坐着。太后没有叫你出去，你也就没有走。\n\n过了一会儿，她拿起念珠，一颗一颗地拨，嘴里重新开始念经。声音很平，没有起伏，和过去四十年的每一天都一样。但你注意到她的手在念到某一颗珠子的时候，停顿了半息。那半息很短，短到你以为是自己错觉。但你知道不是。\n\n那颗珠子上有一道极细的裂痕。你不明白为什么一颗有裂痕的珠子还能被用了四十多年。后来你才想明白，也许太后每次念到这颗珠子时的停顿，不是因为忘记念到了哪里，而是因为她舍不得把它换掉。\n\n你帮她添了香，理了经卷，把歪了的蒲团扶正。你做这些的时候，她一直在念经，没有看你，也没有叫你停。但你知道她不讨厌你在这里。\n\n你看着她拨念珠的手指。指节粗大，皮肤松弛，指甲修剪得很短。那双手签过处决的旨意，下过封宫的命令，也在这尊佛像前捻过四十多年的佛珠。同一双手，杀过人，也念过经。\n\n你想起你第一次见她的情形。那时你刚进宫，战战兢兢地跪在寿康宫的地上。她坐在高高的座位上，看了你一眼，什么也没说。你当时以为她冷漠。后来你才知道，她不是冷漠，她只是不知道该怎么对一个新人说：这宫里没有好人，也没有坏人，只有活下来的人和没活下来的人。\n\n你有一次趁她不在，偷偷翻过她的经桌。抽屉里整整齐齐地码着几百张抄好的经文，每一张的末尾都写着一个名字。有些名字你用手指描了一遍，发现都是宫里曾经出现过、后来又消失的人。她把每一个离开的人都抄进经文里，一个都不漏。\n\n你想，她不是冷漠，她只是把悲伤都收进了这些经文里。别人用泪水祭奠，她用笔墨。四十年下来，那些经文垒起来大概有半个人高。她从来没有告诉过任何人这件事。你也从来没有告诉过她，你看见了。\n\n皇上有一次在寿康宫跟太后起了争执。你隔着门，听到太后说：哀家不是觉得你做不好，是知道你会做错。\n\n你站在门外，这句话在你耳朵里回响了很久。你知道这句话对太后意味着什么。这是她说了一辈子的话——不是对皇上，是对所有她爱过的人。她把所有的关心都包在否定里，把所有的柔软都藏在冷面后。她不说我担心你，她说你会做错。她不说我心疼你，她说你不该这样做。\n\n你推开门进去的时候，皇上已经走了。太后坐在佛堂里，念珠在她手里慢慢转动。她的背挺得很直，像一根不会弯曲的竹子。她的头发全白了，但梳得一丝不苟，一根乱发都没有。她的脸上没有表情，没有愤怒，没有悲伤，甚至没有疲惫。只有一种你说不出的空旷。\n\n你走过去，在她旁边的蒲团上坐下。你没有说话，她也没有。过了很久，她忽然说，你知道哀家最累的是什么吗。你说，不知道。她说，是每次说出那句话之后，还要装作自己说的是对的。你没有问她那句话是哪句话。你知道。是那句：哀家不是觉得你做不好，是知道你会做错。\n\n你说，太后。\n\n她没有回头，说，你出去吧。\n\n你走到门口，回头看了她一眼。她还在念经，嘴唇微微动着，念珠在指间一颗一颗地滑过。阳光从窗棂照进来，落在她的肩上，把她的白发照成了一片银光。她的影子投在佛堂的墙壁上，很大，很静，像一座山。\n\n你出去的时候，门在你身后合上了。那一声轻响，像什么东西落入了水中。\n\n太后走的那天，你被允许进寿康宫。佛堂里的香还没有散尽，念珠放在她的枕边，金身佛像前的长明灯还亮着。她的遗诏摊在案上，你走过去看。\n\n只有一行字：后宫安宁，便是哀家最大的心愿。\n\n没有封号，没有追封，没有厚葬。只有这一句话。像她这个人一样，一辈子都在做对别人对的事，没有做过一件只为了自己的事。\n\n你拿起那串念珠。珠子是紫檀的，被摩挲了四十多年，表面光滑得像玉。你一颗一颗地数，数到最后一颗的时候，你发现它的角度还停在拨动的位置——不是自然垂落的位置，是手指刚刚拨过它、还没来得及松开的位置。\n\n像是时间忽然凝固了。\n\n你想，她最后一刻念的是什么。"},xianpin:{n:"欣贵人（吕盈风）",h:"欣贵人",hc:"house-h",g:"female",s:{"loyalty": 1, "depth": 1, "bravery": 2, "rebel": 2, "humor": 2, "adventure": 1, "morals": 2, "wisdom": 1},t:["直爽泼辣", "敢说敢做", "后宫里的明白人", "不站队但有立场"],r:"",tt:"《她敢说》",tb:"你第一次见识欣贵人的厉害，是在请安的时候。\n\n华妃坐在上首，脸色不太好——昨天皇上又早早走了。底下的人低着头大气不敢出，连呼吸都刻意放轻了。\n\n这时候欣贵人忽然开口：「娘娘今天的胭脂真好看，就是抹得急了些，左边比右边重了一点点。」\n\n华妃的脸色从不好变成了极不好。\n\n底下的人恨不得把头埋进膝盖里。欣贵人却端端正正地坐着，手里端着茶，表情认真得像在讨论天气。华妃瞪了她一眼，她回了一个笑——不是讨好的笑，是她真的觉得胭脂涂歪了。\n\n事后你问她：「你不怕吗？」\n\n她说：「不怕。」\n\n你说不怕华妃。她说不怕，她又不吃人。你愣了一下，然后笑了。她也笑了，笑得很大声，整个走廊都听得见。\n\n——\n\n欣贵人就是这样。宫里的人说话要过三遍脑子，她说话直接从嘴里蹦出来。\n\n她说这道菜咸了就咸了，那件衣裳丑就是丑了，那个人的心眼多就是多了。她不站队，不拉帮，不巴结，不踩人。她活得像后宫里一个不合时宜的标点符号——别人都用省略号，她用感叹号。\n\n你跟她熟了以后发现，她不是傻，她是明白。\n\n有一次你和她喝茶，她说：「你知道为什么我不站队吗？」\n\n你摇头。\n\n「站队的人以为自己选了一条路，其实只是给别人当了一双腿。」她端起茶杯喝了一口，「我不给人当腿，我自己走。」\n\n——\n\n但她不是没有吃过亏。有一年她得罪了一个得宠的妃嫔，被皇上下旨禁足三个月。\n\n禁足一解除，她第一件事就是跑到御花园里摘了一朵最大最艳的牡丹别在头上，然后大摇大摆地去给那个妃嫔请安。妃嫔看着她头上的花，脸都绿了。\n\n欣贵人端端正正地行了礼，站起来，笑眯眯地说：「娘娘今天的妆真好看，就是眼线画歪了。」\n\n妃嫔气得差点把茶杯扔了。\n\n你事后问她：「你禁足三个月就没学乖一点？」\n\n她说不乖。你说不怕再被禁足？她说不怕。\n\n你问她到底怕什么。她想了想，说：「怕老了以后回忆起来，发现自己这辈子没有说过几句痛快话。」\n\n——\n\n后来你问她后悔过吗。\n\n她正在浇花，把水壶放下，歪着头想了想。\n\n「后悔过一件事。」\n\n「什么事？」\n\n「后悔有一次话说得不够狠。」\n\n你愣了，然后哈哈大笑。她也笑了，笑得整个院子里的花都跟着晃。\n\n「真的，」她说，「那次我要是再说狠一点，说不定她就收敛了。」"},shenzizhong:{n:"沈自山（沈眉庄父亲）",h:"济州协领",hc:"house-h",g:"male",s:{"loyalty": 2, "depth": 1, "bravery": 1, "rebel": 0, "humor": 0, "adventure": 0, "morals": 3, "wisdom": 1},t:["正直古板", "家国情怀", "清官难做", "为女儿骄傲但严厉"],r:"",tt:"《他一辈子只写过一封不像家书的家书》",tb:"你收到父亲的第一封信，是在入宫三个月后。\n\n信很短，用的是最工整的楷书，一笔一划像他的为人——方方正正，不容半点含糊。\n\n「问你是否安好。按时用膳。入秋添衣。」\n\n没有一句多余的话，没有一个多余的字。连落款都只有一个「父」字。\n\n你把信读了三遍。因为你知道他写信的时候在想什么——信的末尾，有一滴墨洇开了。\n\n不是手抖，是水滴。\n\n一个从不当着任何人掉眼泪的男人，一个在城门口送你时腰板笔直的男人，在写这封信的时候，掉了眼泪。\n\n——\n\n你一直以为父亲不疼你。\n\n他对你严厉——背诗背错一个字打手心，走路姿势不对拿尺子敲膝盖。你觉得他对你没有对弟弟们好——弟弟们犯错了他最多骂两句，你犯错了他会罚。\n\n你进宫那天，他站在城门口送你。腰板笔直，表情严肃。\n\n你上了轿子，从帘子缝里看他。他没有动，就那么站着，一直站到轿子转弯看不见了为止。\n\n后来你才知道——你走了以后，他在那站了一个时辰。\n\n——\n\n后来你回了趟济州。父亲还是那样，腰板笔直，不苟言笑。\n\n但你有一天经过他的书房，从门缝里看进去，看到他在写字。\n\n你凑近了看——他写的是你的乳名。那张纸他写了一遍又一遍，写了满满一页。写完以后，他把那张纸折好，放进了抽屉的最深处。\n\n你站在门外没有进去。\n\n你知道一个男人的爱有时候不是拥抱不是夸奖不是温柔的话语——是他把你名字写了整整一页纸，然后锁在抽屉里，一辈子不让人看见。\n\n——\n\n你走的时候，他送你到城门口。还是腰板笔直，还是不苟言笑。\n\n但这次你没有从轿子缝里看他。你掀开帘子，冲他挥了挥手。\n\n他愣了一下。然后——就那一下，短得你差点没看见——他冲你点了一下头。\n\n那个点头里没有话。但你知道他说的是什么。\n\n他说的是：好。"},nian_gengyao:{n:"年羹尧",h:"抚远大将军",hc:"house-h",g:"male",s:{"loyalty": 1, "depth": 0, "bravery": 3, "rebel": 2, "humor": 0, "adventure": 2, "morals": 0, "wisdom": 0},t:["功高震主", "跋扈嚣张", "战功赫赫但不懂收敛", "悲剧的功臣"],r:"",tt:"《铠甲》",tb:"所有人怕年羹尧的时候，你看到了他中衣领口的那道裂口。\\n\\n那是你第一次见他。他刚打完仗回来，铠甲上沾着血和沙，走进帅帐的时候连看都没看你一眼，径直走到帅案前，把头盔摔在案上，震得茶杯跳了起来。\\n\\n你端着茶走过去，放下。\\n\\n就在那一瞬间，他低头解铠甲的系带，中衣的领口滑开了一寸。你看到了一道刀口——从锁骨一直划到胸口，皮肉翻卷过的痕迹已经发硬，变成了一条暗紫色的疤。\\n\\n他迅速把领口拉好，动作快得像是在掩埋什么东西。\\n\\n你没有说话。他也没有。\\n\\n但你记住了那道疤的位置。\\n\\n——\\n\\n后来你开始注意到更多。\\n\\n他抬右臂的时候，袖管会露出一截小臂——上面有一道很深的箭痕，皮肉向内凹陷，像是被什么东西硬生生贯穿过。他穿单衣的时候，后背靠近肩胛的位置有一块烧伤，颜色比周围的皮肤深，形状不规则，像是被火器燎过。\\n\\n你有一次趁他不在，偷偷翻了他的药箱——金创药用了大半瓶，还有几卷已经发黑的绷带。药箱最底下压着一张纸，上面写满了字，你认出了他的笔迹：「左肩旧伤每逢阴雨则痛」「右臂箭伤三月不愈」「后背心口发闷」。\\n\\n你拿着那张纸站了一会儿，然后把它放回原处。\\n\\n他从来不提。不是那种「我不怕疼」的硬撑，而是好像这些伤根本不存在。他照旧发脾气，照旧拍桌子，照旧把头盔摔得震天响。所有人都说他跋扈、嚣张、不可一世。\\n\\n但你知道不是。\\n\\n你有一次在深夜听见帅帐里有动静，走过去，门缝里透出一点烛火。你透过门缝往里看——他坐在案前，手边放着一杯酒，没喝，只是转来转去。他的眼睛空着，像是在看什么远处的东西，那东西不在帐子里，甚至不在这片大漠里。\\n\\n你在外面站了很久，最后没有推门进去。\\n\\n你不知道推进去该说什么。那种空，不是一两句话能填的。\\n\\n第二天你在帐外放了一坛酒。不是什么好酒，是普通的浑浊的西北米酒，你让人从军士那里换来的。他出来看到，捡起来拍了拍坛口的泥封，没问是谁放的。就那么抱进帐去了。\\n\\n傍晚你路过帅帐，隐约听见里头有动静——是他在哼什么，调子很低，像是一首没有歌词的曲子。你没有停下，你继续走了。有些东西让他一个人留着就好。\\n\\n你走出去很远，还能听见那个调子。风把它吹得断断续续的，像是从很远的地方传来的，不知道从哪里来，也不知道要到哪里去。\\n\\n——\\n\\n有一天你在营帐里撞见他换药。\\n\\n他以为没人，自己给自己缠绷带。左手扯着布条绕过右肩，缠到第三圈的时候手指抖了一下，布条滑落了。他捡起来，继续缠。表情没有任何变化，像是在做一件再平常不过的事。\\n\\n你站在门口看了很久。\\n\\n然后你走进去，拿起散落的布条，绕过他的肩膀。\\n\\n他的手僵住了。\\n\\n你绕到他背后，把布条从右肩拉到左腰，打了一个结。你的手指碰到他的后背，那块烧伤的皮肤比周围的硬很多，像一块长进肉里的铁。\\n\\n「将军疼吗？」你问。\\n\\n他愣了一下。\\n\\n「疼。」\\n\\n「那为什么不说说？」\\n\\n他沉默了一会儿，目光落在帅案上那道被头盔砸出来的裂纹上。\\n\\n「说了也没用。」\\n\\n然后他补了一句，声音很平，像在说天气。\\n\\n「有些伤不是为了让人看的。」\\n\\n你没有再问。你帮他系好外袍的系带，转身走了。\\n\\n——\\n\\n你开始做一些别人不会做的事。\\n\\n你让厨房每天多熬一碗药汤，说是你自己要喝的，然后让丫鬟送到他帐里。你在他打完仗回来的晚上，提前把他的炭盆生好。你在他发脾气的时候不躲不闪，站在他面前，等他发完。\\n\\n有一次他发完脾气，帐里只剩下你们两个人。他看了你一眼，说：你不怕我？\\n\\n你说：怕。\\n\\n他又看了你一眼，没说话。\\n\\n你接着说：怕归怕，该做的事还是要做。\\n\\n他低下头，嘴角微微动了一下。不知道是想笑还是想叹气。\\n\\n还有一次，你在他桌上看到一封家书。信纸已经折了很多次，边角都磨毛了。他没有拆开，就这么压在镇纸下面。\\n\\n你问他为什么不拆。\\n\\n他说：拆开就要回。回了就放不下。\\n\\n你看着他，忽然觉得这个人不是不想家，是不敢想。\\n\\n你跟他说：写封信吧，我帮你寄。\\n\\n他说：不用了。\\n\\n你没有再劝。但你第二天在他的桌上放了一张白纸和一支笔。纸是空白的，笔是新磨的。\\n\\n傍晚你再去的时候，纸上多了三个字：一切安。\\n\\n——\\n\\n他走的那天，西北风很大。\\n\\n营帐外的旗子被风吹得笔直，像一面不肯倒下的墙。你站在空荡荡的帅帐前面，风卷起地上的沙尘，打在你的脸上。\\n\\n你弯腰捡起地上的一片铠甲碎片，上面还沾着干涸的血。你把它攥在手心里，攥了很久。\\n\\n你想起他解铠甲的那个晚上。想起他拉上领口时那个急促的动作。想起他说「有些伤不是为了让人看的」时候那个平静的声音。想起他写「一切安」的时候，笔尖在纸上停了一会儿。\\n\\n风沙刮在脸上像刀子。\\n\\n但你没有觉得疼。"},hongli:{n:"弘历（四阿哥/乾隆）",h:"四阿哥",hc:"house-h",g:"male",s:{"loyalty": 1, "depth": 2, "bravery": 1, "rebel": 1, "humor": 0, "adventure": 1, "morals": 1, "wisdom": 3},t:["隐忍蛰伏", "少年老成", "野心藏得很深", "善于利用别人的同情"],r:"",tt:"《补丁》",tb:"你第一次见弘历，他十二岁，跪在院子里。\\n\\n冬天的青石板冷得能冻透骨头。他的膝盖硌在上面，一动不动。太监捧着书站在一旁，等他行完礼才递过去。你走近了才看到——他的裤子膝盖处有两个补丁，针脚很密，密密麻麻地缝了一层又一层。\\n\\n是他自己补的。\\n\\n他伸手接书之前，先用袖子把书面擦了一遍。动作很慢，很认真，像是怕手上的灰弄脏了纸。擦完之后，他才双手接过，低着头说了一句「谢嬷嬷」。\\n\\n你站在回廊下面看了一会儿。风从院子里穿过，吹得他单薄的背影微微晃动。但他跪得很直，背挺得像一根不肯弯曲的竹子。\\n\\n你忽然觉得这个十二岁的孩子比你见过的很多大人都活得用力。\\n\\n你走回屋，翻出自己年轻时候用过的一方砚台，让人给他送了去。\\n\\n——\\n\\n后来你去看他，他正在读书。\\n\\n阿哥所的屋里没有炭。你推门进去的时候，呵出的气在眼前凝成白雾。他坐在案前，握笔的手指冻得发僵，写出来的字歪歪扭扭的，墨迹断断续续。他写错了一个字，放下笔，把笔塞进怀里焐了一会儿，又拿出来继续写。\\n\\n你问他冷不冷。\\n\\n他说不冷。\\n\\n但他的嘴唇是紫的。\\n\\n你看着他把手从袖子里拿出来，手指已经冻得没了知觉，但他只是用力攥了攥拳头，像是这样就能把血重新逼回指尖。然后他又拿起笔，继续写。\\n\\n你环顾了一圈——屋里除了一张床、一张案、一摞书，什么都没有。墙角堆着几件衣服，洗得发白，叠得整整齐齐。你注意到最上面那件是他常穿的，袖口磨出了毛边，但他用针线细细地收了一圈，不让它继续散开。\\n\\n你没有说话。你坐下来，拿起他的书，翻了几页。\\n\\n他写的是《论语》，「士不可以不弘毅」那一段。他写到「弘毅」两个字的时候停了一下，然后用力地、一笔一画地，把这两个字写得比别的都大，墨洇透了纸背。\\n\\n你没有问他为什么。\\n\\n你从袖子里掏出一块帕子，递给他。\\n\\n「擦擦手，」你说，「墨都冻住了。」\\n\\n他接过去，手指碰到你的指尖，冰凉冰凉的。\\n\\n——\\n\\n从那以后你时不时地去看他。\\n\\n你每次去都带点东西——有时候是一包炭，有时候是一方墨，有时候是一件半旧的棉衣。你从来不说是你给的，只说是宫里发的。\\n\\n他每次都说谢谢，然后继续读书。\\n\\n你坐在旁边看他写。他的字一天比一天好，从一开始的歪歪扭扭，到后来的端正有力。他写字的时候很专注，嘴唇微微抿着，眉头微微皱着，像是每一个字都要跟它较劲。\\n\\n你有时候会问他读的是什么。他就给你讲，声音很轻，但一字一句都很清楚。你发现他读书不是为了应付差事，他是真的想弄明白。\\n\\n你问他：「你读书是为了什么？」\\n\\n他想了想，说：「为了堂堂正正地活着。」\\n\\n——\\n\\n有一年夏天，你去看他的时候他不在。\\n\\n你在他的书桌上看到一张纸，上面写着满满一页的字。你拿起来看，是他的日记——「今日读《孟子》，见「天将降大任」一段，默诵三遍。院中槐树已绿，风过时沙沙作响，似有人在耳边读书。忽想起那年冬天，有人送炭来，不知是谁。」\\n\\n你把纸放回原处，在纸上压了一块镇纸。\\n\\n你走出阿哥所的时候，抬头看了看那棵槐树。叶子很密，遮住了大半个院子。你忽然觉得这个孩子不是没有人疼，只是疼他的人不知道怎么疼他。\\n\\n——\\n\\n有一天夜里你路过阿哥所，透过窗纸看到里面还亮着灯。\\n\\n你停住脚步。\\n\\n他还在读书。桌上摊着好几本，翻开的地方折了角。书旁边放着一张纸，上面歪歪扭扭地写了几个字，像是写了又改，改了又写，纸上被涂了好几道。\\n\\n你凑近了一点，想看清楚。\\n\\n「读书，是为了堂堂正正。」\\n\\n七个字，四个字写得最大。\\n\\n你站在窗外，看着那个十二岁的孩子的背影。他的背挺得很直，像一根在风雪里不肯弯的竹子。窗外的风吹得窗纸哗哗响，他没有回头，只是把手往袖子里缩了缩，继续写。\\n\\n你忽然觉得，这个没人疼的孩子在用所有的力气，做一个值得被记住的人。\\n\\n你回屋的时候，翻出自己珍藏的那套《论语》，第二天一早派人给他送了去。你在扉页上写了一行字——「读书如逆旅，愿君堂堂正正走完。」但没署名。\\n\\n——\\n\\n很多年以后，你进宫拜见新皇。\\n\\n他坐在御花园的老槐树下面，石桌上摊着一本书。你走近了看——是你当年送他的那本《论语》，封面磨得很旧了，边角卷了起来，但书脊被人重新线装过，针脚很密。\\n\\n和当年他裤子上的补丁一样密。\\n\\n他看见你，站起来。他已经比你高很多了，穿着龙袍，戴着朝珠，是全天下最尊贵的人。\\n\\n「我一直留着。」他说。\\n\\n他没有说留着什么。是书？是那句话？还是那个冬天没有炭的房间里，一个陌生人推门走进来的那一刻？\\n\\n你没有问。\\n\\n你低头看了看石桌上的书——「士不可以不弘毅」那一页被翻得最旧，旧到纸面已经快透了光。"},zhenglongke:{n:"郑龙克（慎贝勒）",h:"慎贝勒",hc:"house-h",g:"male",s:{"loyalty": 1, "depth": 1, "bravery": 1, "rebel": 2, "humor": 2, "adventure": 2, "morals": 1, "wisdom": 2},t:["风流多情", "不涉党争", "看似玩世不恭实则清醒", "逍遥王爷"],r:"",tt:"《他什么都不在乎，只在乎一样东西》",tb:"你第一次见慎贝勒，是在京郊的风筝会上。\n\n别的人都在认真比谁的风筝飞得高，他在旁边躺着，嘴里叼着一根草，看着天上的云。他的风筝是一只燕子，竹骨纸面，尾巴上系着三根彩线，飞得最高，但他一眼都没看。\n\n你走过去说：「王爷，你的风筝快飞没了。」\n\n他侧过头看了你一眼，说：「飞没了才好，飞没了就自由了。」\n\n你觉得这个人很奇怪。\n\n——\n\n你有一次路过他府上的后院，隔着墙看到他蹲在院子里做风筝。\n\n他做得极认真——竹条一根一根削，纸面一寸一寸糊，尾巴上的彩线一根一根系。手指被竹篾划了一道口子，出了血，他看都没看，继续在削。\n\n你翻墙进去看他。他抬头看见你，愣了一下，然后笑了。\n\n那个笑和他在风筝会上的笑不一样。风筝会上的笑是懒洋洋的、无所谓的。这个笑是认真的，是那种你只在极度专注的人脸上见过的笑。\n\n「你怎么来了？」\n\n「路过。」你说，「王爷做得这么认真，不像不在乎的人。」\n\n他低下头继续糊纸面，说：「谁说我在乎了？」\n\n「你手都划破了。」\n\n他看了看手上的口子，说：「疼的时候才觉得活着。」\n\n——\n\n他把那只风筝递给你。\n\n「送给你的。」\n\n你接过来，发现风筝的背面写了一行小字，是他的笔迹，很工整，和他平时的潦草完全不一样。\n\n你念出来：「愿有一人，知我不羁是假。」\n\n你抬头看他。他背对着你，在收拾竹条和浆糊，像什么都没写过一样。\n\n「王爷，」你说，「这是写给谁的？」\n\n他停了一下，然后继续收拾。\n\n「写给一个看到我做风筝认真的人。」\n\n你没再问。你拿着那只风筝站在院子里，风吹得燕子尾巴的三根彩线在你手里翻飞。\n\n后来你才知道，他是宫里唯一一个什么都可以放弃的人——权力、地位、名声，他统统不要。但他没有放弃做风筝。\n\n因为他知道，总有一个人在某个春天，会因为一只飞得太高的燕子，而抬头看他。"}};
const QS=[{"t": "选秀那天，你站在太和殿外，听着里面一个个被传唤。你心里想的是什么？", "o": [{"t": "我不想被选中——我只想自由自在地活着", "s": {"rebel": 2, "adventure": 1}}, {"t": "如果进了宫，我要做到最好——不是为了争宠，是为了活下去", "s": {"wisdom": 2, "bravery": 1}}, {"t": "我希望能和喜欢的人一起，不管在哪都好", "s": {"loyalty": 2, "depth": 1}}, {"t": "我有才华，我值得被看见——这是证明自己的机会", "s": {"wisdom": 1, "bravery": 2}}]}, {"t": "你第一次见到皇上，他的一个眼神让你心里一紧。你觉得那个眼神是什么意思？", "o": [{"t": "他在打量我——像在评估一件物品", "s": {"depth": 2, "wisdom": 1}}, {"t": "他对我有好感——这是个好机会", "s": {"bravery": 2, "wisdom": 1}}, {"t": "他看起来很孤独——也许我能理解他", "s": {"depth": 2, "loyalty": 1}}, {"t": "他不过是个男人——和其他男人没什么不同", "s": {"rebel": 2, "adventure": 1}}]}, {"t": "你在后宫里最好的朋友被人陷害，你会怎么做？", "o": [{"t": "不惜一切代价救她，哪怕搭上我自己", "s": {"loyalty": 3, "bravery": 1}}, {"t": "冷静分析局势，找到最稳妥的方式帮她", "s": {"wisdom": 3, "depth": 1}}, {"t": "暂时按兵不动，等时机成熟再出手", "s": {"wisdom": 2, "depth": 2}}, {"t": "直接去找皇上当面理论", "s": {"bravery": 3, "rebel": 1}}]}, {"t": "你最信任的侍女告诉你，有人在皇上面前说了你的坏话。你的第一反应是？", "o": [{"t": "查清楚是谁说的，找到证据再反击", "s": {"wisdom": 3, "depth": 1}}, {"t": "不在意——身正不怕影子斜", "s": {"morals": 2, "rebel": 1}}, {"t": "先反思自己是不是真的做错了什么", "s": {"depth": 2, "morals": 2}}, {"t": "以其人之道还治其人之身", "s": {"bravery": 2, "rebel": 1}}]}, {"t": "你在御花园里遇到了一个身份神秘的人，他和你聊了一下午。你会？", "o": [{"t": "觉得他是有趣的人，不管他是谁", "s": {"adventure": 2, "rebel": 1}}, {"t": "暗自调查他的身份——在宫里不能掉以轻心", "s": {"wisdom": 2, "depth": 1}}, {"t": "享受这次偶遇，但不问太多——有些美好不需要知道全部", "s": {"depth": 2, "adventure": 1}}, {"t": "怀疑他的目的——宫里没有人是无缘无故出现的", "s": {"depth": 2, "wisdom": 1}}]}, {"t": "皇后赏了你一碗汤，你怀疑里面有问题。你会怎么做？", "o": [{"t": "找个借口不喝——但不能让别人看出来", "s": {"wisdom": 3, "depth": 1}}, {"t": "喝了——在皇后面前拒绝太明显", "s": {"bravery": 2, "depth": 1}}, {"t": "先让身边的人试一口", "s": {"wisdom": 2, "morals": 0}}, {"t": "当面喝掉，但提前准备好解药", "s": {"bravery": 3, "wisdom": 1}}]}, {"t": "你发现自己怀孕了，但你不确定孩子的父亲是谁。你会？", "o": [{"t": "这个秘密我会带进坟墓里——谁也不能知道", "s": {"depth": 3, "bravery": 1}}, {"t": "想办法确认——真相比面子重要", "s": {"morals": 2, "bravery": 2}}, {"t": "不管是谁的，我都会保护好这个孩子", "s": {"loyalty": 3, "bravery": 1}}, {"t": "做出最有利于孩子的选择——这不是自私，是负责", "s": {"wisdom": 2, "depth": 2}}]}, {"t": "你在深夜的冷宫里听到有人在哭。你会？", "o": [{"t": "走过去看看——也许我能帮上什么", "s": {"loyalty": 2, "bravery": 1}}, {"t": "站在远处听一听——先弄清楚情况再说", "s": {"wisdom": 2, "depth": 1}}, {"t": "当作没听到——在宫里管闲事会害了自己", "s": {"wisdom": 1, "morals": 0}}, {"t": "让身边的太监去查看", "s": {"wisdom": 1, "adventure": 0}}]}, {"t": "有人送你一支很美的簪子，你很喜欢但你知道送你的人别有用心。你会？", "o": [{"t": "收下但不戴——给对方面子但保持距离", "s": {"wisdom": 3, "depth": 1}}, {"t": "直接拒绝——我不想欠任何人的人情", "s": {"rebel": 2, "morals": 2}}, {"t": "收下然后戴给别人看——让她以为我上钩了", "s": {"wisdom": 2, "bravery": 1}}, {"t": "收下并且真心感谢——也许她不是我想的那样", "s": {"loyalty": 1, "morals": 2}}]}, {"t": "皇上让你在他和另一个女人之间做选择——虽然他没有明说。你会怎么做？", "o": [{"t": "主动退出——如果他心里有别人，我强求不来", "s": {"depth": 2, "morals": 2}}, {"t": "不动声色地争取——爱情本来就是一场博弈", "s": {"bravery": 2, "wisdom": 2}}, {"t": "试探他的真心——如果他真的在乎我，他会做出选择", "s": {"depth": 2, "wisdom": 1}}, {"t": "两个都不要——我不需要在别人心里争一个位置", "s": {"rebel": 3, "adventure": 1}}]}, {"t": "你最好的姐妹背叛了你，把秘密告诉了敌人。你会？", "o": [{"t": "原谅她——我知道她一定有苦衷", "s": {"loyalty": 2, "depth": 2}}, {"t": "和她断绝关系——信任一旦碎了就回不来了", "s": {"bravery": 2, "morals": 2}}, {"t": "表面上当什么都没发生，暗中提防", "s": {"wisdom": 3, "depth": 1}}, {"t": "用她的背叛来反将敌人一军", "s": {"wisdom": 2, "bravery": 2}}]}, {"t": "你在宫里住了五年，回头看发现自己变了。你对这种变化的感受是？", "o": [{"t": "成长是必然的——我不后悔变成了更强大的自己", "s": {"bravery": 2, "depth": 2}}, {"t": "心痛——我失去了那个最纯真的自己", "s": {"depth": 3, "morals": 1}}, {"t": "无所谓——生存本来就需要改变", "s": {"wisdom": 2, "adventure": 1}}, {"t": "愤怒——是这个地方把我变成这样的", "s": {"rebel": 2, "depth": 1}}]}, {"t": "你暗恋的人即将和别人成婚。你会？", "o": [{"t": "祝福他——真正爱一个人就是希望他幸福", "s": {"loyalty": 2, "depth": 2, "morals": 2}}, {"t": "在他成婚前说出自己的心意——至少让他知道", "s": {"bravery": 3, "rebel": 1}}, {"t": "什么都不说，默默祝福——有些爱注定不能说出口", "s": {"depth": 3, "loyalty": 1}}, {"t": "想办法阻止——幸福是需要争取的", "s": {"bravery": 2, "rebel": 2}}]}, {"t": "你在御书房帮皇上整理奏折，发现了一份对你家族不利的奏折。你会？", "o": [{"t": "当作没看见——不能越界", "s": {"wisdom": 2, "morals": 1}}, {"t": "想办法把奏折偷偷毁掉", "s": {"bravery": 2, "rebel": 2, "loyalty": 1}}, {"t": "提醒家人做好准备——但不动奏折", "s": {"wisdom": 2, "loyalty": 2}}, {"t": "向皇上求情——坦诚面对，也许能化解", "s": {"bravery": 3, "morals": 2}}]}, {"t": "宫里举办诗会，所有人都要参加。你会怎么表现？", "o": [{"t": "认真作一首好诗——用才华证明自己", "s": {"wisdom": 3, "depth": 1}}, {"t": "故意写得一般——太出头容易成为靶子", "s": {"wisdom": 2, "depth": 2}}, {"t": "写一首讽刺的诗——借机表达自己的不满", "s": {"rebel": 2, "bravery": 1}}, {"t": "借诗表达心意——希望某个人能读懂", "s": {"depth": 2, "loyalty": 1}}]}, {"t": "你生病了，所有人都来看你。你最希望谁来？", "o": [{"t": "那个我最在意的人——不管他是谁", "s": {"loyalty": 2, "depth": 2}}, {"t": "皇上——这是巩固地位的好机会", "s": {"wisdom": 2, "bravery": 1}}, {"t": "我的侍女——只有她是最真心关心我的", "s": {"loyalty": 2, "morals": 2}}, {"t": "谁都不希望——生病的时候我只想一个人待着", "s": {"depth": 2, "rebel": 1}}]}, {"t": "有人在皇上面前夸你，你心里清楚她是在捧杀你。你会？", "o": [{"t": "谦虚地接受——让她没有把柄", "s": {"wisdom": 3, "depth": 1}}, {"t": "当面揭穿——我不需要这种虚假的赞美", "s": {"bravery": 2, "rebel": 2}}, {"t": "事后找她谈谈——也许她不是恶意的", "s": {"depth": 2, "morals": 2}}, {"t": "顺着她的话演下去——看看她还能玩出什么花样", "s": {"wisdom": 2, "adventure": 2}}]}, {"t": "你在后花园种了一株梅花，冬天来了，它开了。你站在树下，心里想的是？", "o": [{"t": "这花像极了我——在最冷的时候开得最美", "s": {"depth": 2, "bravery": 2}}, {"t": "花开花谢，人生也不过如此", "s": {"depth": 3, "wisdom": 1}}, {"t": "希望有人能和我一起来看这株梅花", "s": {"loyalty": 2, "depth": 1}}, {"t": "梅花虽美但太孤单了——它需要一个伴", "s": {"depth": 2, "adventure": 1}}]}, {"t": "你收到了一个匿名信封，里面是一首你年轻时写过的诗。你会？", "o": [{"t": "猜到是谁写的——心里又喜又忧", "s": {"depth": 2, "loyalty": 2}}, {"t": "立刻烧掉——这种东西不能留", "s": {"wisdom": 2, "bravery": 1}}, {"t": "回一封信——不管他是谁，我想和他说话", "s": {"bravery": 2, "rebel": 1}}, {"t": "装作什么都没收到——有时候沉默是最好的回答", "s": {"wisdom": 2, "depth": 2}}]}, {"t": "皇上问你：'你觉得后宫里最幸福的人是谁？'你会怎么回答？", "o": [{"t": "是那些从不进宫的人——自由才是最大的幸福", "s": {"rebel": 2, "depth": 2}}, {"t": "是那些心里有爱的人——不管爱不被不被回应", "s": {"depth": 2, "loyalty": 2}}, {"t": "是那些不争不抢的人——因为没有期望就没有失望", "s": {"wisdom": 2, "depth": 2}}, {"t": "这个问题我不敢回答——每个人都有自己的苦", "s": {"wisdom": 1, "depth": 2}}]}, {"t": "你最怕的是什么？", "o": [{"t": "被背叛——我付出的信任被辜负", "s": {"depth": 2, "loyalty": 2}}, {"t": "被遗忘——在这个偌大的后宫里没人记得我", "s": {"depth": 3, "adventure": 0}}, {"t": "变得不像自己——为了生存而变成陌生人", "s": {"depth": 2, "morals": 2}}, {"t": "失去爱人的能力——心死了，比什么都可怕", "s": {"depth": 3, "loyalty": 1}}]}, {"t": "除夕夜，宫里放烟花。你站在廊下看着满天的火光，身边只有你一个人。你在想什么？", "o": [{"t": "烟花再美也只是瞬间——就像宫里的恩宠", "s": {"depth": 3, "wisdom": 1}}, {"t": "好美——要是有人和我一起看就好了", "s": {"loyalty": 2, "depth": 1}}, {"t": "我不需要有人陪——一个人看也有一个人的美", "s": {"rebel": 2, "depth": 1}}, {"t": "这烟花和我有什么关系？我更关心明天的局势", "s": {"wisdom": 2, "adventure": 1}}]}, {"t": "如果给你一个机会离开紫禁城，重新选择自己的人生。你会？", "o": [{"t": "毫不犹豫地走——我再也不要回到这里", "s": {"rebel": 3, "adventure": 2}}, {"t": "犹豫——这里有我爱的人和恨的人", "s": {"depth": 2, "loyalty": 2}}, {"t": "不走——我已经走到这一步了，不能放弃", "s": {"bravery": 2, "wisdom": 2}}, {"t": "带着在乎的人一起走——一个人走有什么意义", "s": {"loyalty": 3, "adventure": 1}}]}, {"t": "你的对手跪在你面前求饶，你会怎么做？", "o": [{"t": "扶她起来——赢的人不需要踩输的人", "s": {"morals": 2, "depth": 2}}, {"t": "冷眼看着她——让她记住今天的教训", "s": {"bravery": 2, "depth": 1}}, {"t": "给她一个机会——也许她可以成为盟友", "s": {"wisdom": 2, "adventure": 1}}, {"t": "转身离开——不值得浪费时间和精力", "s": {"wisdom": 1, "rebel": 1}}]}, {"t": "深夜，一个你最不想见到的人来找你。他站在门口，说：'我们能谈谈吗？'你会？", "o": [{"t": "让他进来——逃避解决不了任何问题", "s": {"bravery": 2, "depth": 2}}, {"t": "隔着门说话——有些距离是必须的", "s": {"wisdom": 2, "depth": 2}}, {"t": "不开门——有些话不需要再说第二次", "s": {"rebel": 2, "depth": 1}}, {"t": "开门但保持警惕——谁知道他安的什么心", "s": {"wisdom": 2, "bravery": 1}}]}, {"t": "有人说你变了。你会怎么回应？", "o": [{"t": "承认——人不该永远停在原地", "s": {"depth": 2, "bravery": 2}}, {"t": "反问对方——你觉得我应该是什么样？", "s": {"rebel": 2, "depth": 1}}, {"t": "什么都不说——不需要向任何人解释", "s": {"rebel": 2, "adventure": 1}}, {"t": "微笑——让他们去猜吧", "s": {"wisdom": 2, "depth": 1}}]}, {"t": "你最得意的一件事是什么？", "o": [{"t": "在最难的时候没有放弃", "s": {"bravery": 2, "depth": 2}}, {"t": "看穿了一个人的真心却选择不拆穿", "s": {"depth": 2, "wisdom": 2}}, {"t": "为了重要的人放弃了自己的骄傲", "s": {"loyalty": 3, "depth": 1}}, {"t": "从谷底爬起来，让别人刮目相看", "s": {"bravery": 2, "adventure": 2}}]}, {"t": "你收到了一封信，信里写满了你从未对人说过的心事。写信的人是？", "o": [{"t": "一个懂我的人——哪怕我们从不说话", "s": {"depth": 2, "loyalty": 2}}, {"t": "一个观察我很仔细的人——这让我害怕", "s": {"depth": 2, "wisdom": 1}}, {"t": "我自己——有时候最懂自己的人也最残忍", "s": {"depth": 3, "wisdom": 1}}, {"t": "一个我以为不认识我的人——原来我从未真正隐藏过", "s": {"depth": 2, "adventure": 1}}]}, {"t": "你站在养心殿门口，犹豫要不要进去。里面的人等你很久了。你在犹豫什么？", "o": [{"t": "不是犹豫——是在想该以什么面目见他", "s": {"depth": 2, "wisdom": 2}}, {"t": "怕进去了就出不来了——有些话说了就不能收回", "s": {"depth": 2, "bravery": 1}}, {"t": "其实已经进去了——犹豫只是做给别人看的", "s": {"wisdom": 2, "bravery": 1}}, {"t": "在想要不要转身走——有些决定不需要见面做", "s": {"rebel": 2, "depth": 1}}]}, {"t": "有人问你：'你觉得在宫里活下去最重要的是什么？'你会说？", "o": [{"t": "真心——但只给值得的人", "s": {"loyalty": 2, "depth": 2}}, {"t": "智慧——没有脑子的人活不过三集", "s": {"wisdom": 3, "depth": 1}}, {"t": "运气——再聪明也抵不过命运捉弄", "s": {"depth": 2, "wisdom": 1}}, {"t": "狠心——对别人狠，更要对自己狠", "s": {"bravery": 2, "depth": 2}}]}, {"t": "元宵灯会上，你遇到了一个让你心动的人。你们的对话最可能是怎样的？", "o": [{"t": "他先开口：'姑娘这盏灯选得真好。'你微微一笑：'你也喜欢这个？'", "s": {"depth": 1, "_sel": "f"}}, {"t": "你先开口：'这灯会可真热闹。'他看着你：'不及你。'", "s": {"bravery": 1, "_sel": "m"}}, {"t": "你们什么都不说，只是并肩走了一段路，然后各自离开", "s": {"depth": 2, "_sel": "f"}}, {"t": "你拉住他的袖子：'陪我去看那边那盏灯。'他愣了一下然后笑了", "s": {"adventure": 2, "_sel": "m"}}]}, {"t": "你在御花园的亭子里避雨，另一个人也走了进来。你们被困了半个时辰。你会怎么做？", "o": [{"t": "主动找话题聊——既然走不了，不如认识一下", "s": {"adventure": 1, "_sel": "m"}}, {"t": "安静地站在一旁，看雨——但余光一直在留意他", "s": {"depth": 2, "_sel": "f"}}, {"t": "脱下外衣给他——雨大，他可能没带伞", "s": {"loyalty": 2, "_sel": "f"}}, {"t": "半开玩笑地说：'看来是天意让我们单独待一会儿'", "s": {"humor": 2, "_sel": "m"}}]}];
const D=['loyalty','depth','bravery','rebel','humor','adventure','morals','wisdom'];
let qi=0,sc={},cqs=[];
function sh(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function start(){
    document.getElementById('intro').classList.remove('active');
    document.getElementById('quiz').classList.add('active');
    let genderQs=QS.filter(q=>q.o[0]&&q.o[0].s&&q.o[0].s._sel);
    let normalQs=QS.filter(q=>!(q.o[0]&&q.o[0].s&&q.o[0].s._sel));
    let picked=sh(genderQs).slice(0,2);
    picked=picked.concat(sh(normalQs).slice(0,8));
    cqs=sh(picked);
    sc={};D.forEach(d=>sc[d]=0);window._gm=0;window._gf=0;qi=0;showQ();
}
function showQ(){
    let q=cqs[qi];
    document.getElementById('qt').textContent=q.t;
    document.getElementById('pb').style.width=(qi/10*100)+'%';
    document.getElementById('qn').textContent='第'+(qi+1)+'/10题';
    let od=document.getElementById('os');od.innerHTML='';
    let so=sh(q.o);
    so.forEach(opt=>{
        let b=document.createElement('button');b.className='opt';b.textContent=opt.t;
        b.onclick=()=>pick(opt.s,b);od.appendChild(b);
    });
    let c=document.getElementById('qc');c.classList.remove('fi');void c.offsetWidth;c.classList.add('fi');
}
function pick(s,btn){
    document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
    btn.classList.add('sel');
    for(let k in s){
        if(k==='_sel'){
            if(s[k]==='m')window._gm=(window._gm||0)+1;
            else if(s[k]==='f')window._gf=(window._gf||0)+1;
        }else{
            sc[k]=(sc[k]||0)+s[k];
        }
    }
    setTimeout(()=>{qi++;if(qi>=10)calc();else showQ()},400);
}
function calc(){
    document.getElementById('quiz').classList.remove('active');
    document.getElementById('loading').classList.add('active');
    setTimeout(()=>{
        let gm=window._gm||0,gf=window._gf||0;
        let tg=gm>gf?'female':gm<gf?'male':(Math.random()>0.5?'male':'female');
        let candidates=Object.keys(CHARS).filter(id=>CHARS[id].g===tg);
        let dists={};
        for(let id of candidates){
            let c=CHARS[id],d=0;
            for(let dim of D){let cw=c.s[dim]||0,uw=sc[dim]||0;d+=(cw-uw)*(cw-uw);}
            dists[id]=d;
        }
        let weights={};
        for(let id of candidates)weights[id]=1.0/(dists[id]+1.0);
        let avgW=Object.values(weights).reduce((a,b)=>a+b,0)/candidates.length;
        let minW=avgW*0.25;
        for(let id of candidates)weights[id]=Math.max(weights[id],minW);
        let totalW=Object.values(weights).reduce((a,b)=>a+b,0);
        let r=Math.random(),cum=0;
        let best=candidates[0];
        for(let id of candidates){cum+=weights[id]/totalW;if(r<=cum){best=id;break;}}
        let c=CHARS[best];
        let pct=Math.round(70+Math.random()*25);
        showR({...c,id:best},pct);
    },2500);
}
function showR(c,pct){
    document.getElementById('loading').classList.remove('active');
    document.getElementById('result').classList.add('active');
    let h='';
    h+='<div class="mpct">'+pct+'%</div>';
    h+='<div class="mlbl">命运羁绊匹配度</div>';
    h+='<div class="cname">'+c.n+'</div>';
    h+='<div class="'+c.hc+'">'+c.h+'</div>';
    h+='<div class="trs">'+c.t.map(t=>'<span class="tr">'+t+'</span>').join('')+'</div>';
    h+='<div style="margin:20px 0;color:#c4a882;line-height:1.8;font-size:1rem">'+c.r+'</div>';
    if(c.tb){
        h+='<div class="story">';
        h+='<div class="stitle">'+c.tt+'</div>';
        c.tb.split('\\n').forEach(p=>{if(p)h+='<p style="margin-bottom:15px">'+p+'</p>';});
        window._cs=c.tb;
        window._cn=c.n;
        window._ct=c.tt;
        h+='<div class="cpbtn" id="cpbtn">📋 复制故事，去小红书分享</div>';
        h+='</div>';
    }
    document.getElementById('rc').innerHTML=h;
    let btn=document.getElementById('cpbtn');
    if(btn)btn.onclick=copyStory;
}
function copyStory(){
    let body=window._cs||'';
    let name=window._cn||'';
    let title=window._ct||'';
    let txt='🕯️ 甄嬛传角色匹配测试\n\n我匹配到了'+name+'！\n\n'+title+'\n\n'+body.replace(/\\n/g,'\n')+'\n\n—— 测测你匹配到了谁？👆';
    if(navigator.clipboard){
        navigator.clipboard.writeText(txt).then(()=>{
            let b=document.getElementById('cpbtn');
            if(b){b.textContent='✅ 已复制！快去小红书分享吧';setTimeout(()=>{b.textContent='📋 复制故事，去小红书分享';},3000);}
        });
    }else{
        let ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
        ta.select();document.execCommand('copy');document.body.removeChild(ta);
        let b=document.getElementById('cpbtn');
        if(b){b.textContent='✅ 已复制！快去小红书分享吧';}
    }
}
function restart(){
    document.getElementById('result').classList.remove('active');
    document.getElementById('intro').classList.add('active');
}
(function(){
    let c=document.getElementById('stars');
    for(let i=0;i<80;i++){
        let s=document.createElement('div');s.className='star';
        s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+(Math.random()*2+1)+'px;height:'+(Math.random()*2+1)+'px;--d:'+(Math.random()*3+2)+'s;animation-delay:'+Math.random()*3+'s';
        c.appendChild(s);
    }
})();
