<script>
const CHARS={zhenhuan:{n:"甄嬛",h:"熹贵妃",hc:"house-h",g:"female",s:{"loyalty": 2, "depth": 3, "bravery": 2, "rebel": 1, "humor": 1, "adventure": 1, "morals": 2, "wisdom": 3},t:["聪慧隐忍", "步步为营", "从纯真到狠辣", "为爱付出一切"],r:"你和她一样，有着从纯真走向成熟的心路历程。你不是天生狠辣，但为了守护爱的人，你愿意变成任何样子。",tt:"《碎玉轩的灯还亮着》",tb:"碎玉轩窗外的雪下了三天三夜。炭盆里的红炭烧到了尽头，只剩一层灰白覆盖在上面，像极了她这些年熬过的日子。窗外的老槐树枝桠上压满了积雪，时不时有一块雪\"啪嗒\"一声砸在窗台上，碎成一片白雾。你推开门的时候，冷风裹着雪沫子扑在脸上，你打了个寒战。屋里比外头还冷——炭没了，没人去领。你看见她坐在窗前的榻上，身上裹着一件半旧的狐皮大氅，手里攥着一方旧帕子，帕子边角已经磨出了毛，上面绣的海棠花只剩半边。她听见声响回过头来，你看见她眼底还没来得及褪去的水光。烛火映在她脸上，半明半暗的，你看不清她的表情，但你看见她的嘴唇在微微发抖。这是你第一次看见甄嬛哭。\n\n入宫第三年的春天，你们在御花园的假山后面第一次说话。那天是三月三，上巳节，御花园里的海棠开得正好，风一吹，花瓣落得像下雨。你端着一盘点心去给娘娘们送，迷了路，绕到假山后面，看见她蹲在一丛海棠花旁边，手里拿着一根小树枝，在泥地上画着什么。你凑近了看，她在画一只蝴蝶。她听见脚步声，抬起头来看你，眼睛亮亮的，像碎玉轩清晨窗棂上挂着的露水。你说娘娘对不起，奴婢迷路了。她笑了一下，站起来拍了拍裙摆上的土，说你来得正好，帮我看看这只蝴蝶画得像不像。你说像。她歪了歪头，说你觉得它飞得起来吗？你愣了愣，说蝴蝶当然是要飞的。她看着那只画在泥地上的蝴蝶，轻声说那就好。你说娘娘这簪花真好看。她低头看了看发间那朵新开的海棠，笑了一下，说这是我自己摘的，不是内务府发的。内务府发的那些花，都是绢的，假的。她说这话的时候，手指轻轻碰了碰花瓣，动作很轻，像是怕碰坏了什么。\n\n后来她被封了嫔，又生了公主，又被人陷害，又被贬到甘露寺，在甘露寺里过了三年的苦日子。再回来的时候，已经成了熹贵妃。她回宫那天，你站在碎玉轩门口迎接。她从轿子里走出来的时候，你差点没有认出来——不是变了样子，是她身上多了很多东西。那些东西你说不清楚，只觉得沉，沉得像她头上那支点翠凤钗。她穿了一身大红色的宫装，裙摆上用金线绣了九只凤凰，走在碎玉轩的青石板上，脚步声又重又稳。她看见你，微微笑了一下，说你还在这儿。你说奴婢一直在。她点了点头，没有再说话，径直走进了碎玉轩。那扇你已经三年没有见她推开过的门，被她轻轻一推就开了。\n\n那天夜里她发烧，烧得迷迷糊糊的，嘴里一直喊着一个人的名字。你端着药碗坐在床边，药是她自己开的方子，她懂医术，但她病了，开方子的手在抖。你看着她苍白的脸，汗水把额前的碎发贴在皮肤上。她突然抓住你的手，攥得很紧，指甲掐进你的肉里，疼得你倒吸一口凉气。你说娘娘放开，奴婢要喂您吃药。她摇头，眼睛半睁半闭，瞳孔里映着烛火，摇摇晃晃的。说你不用总是叫我娘娘。只有你叫我嬛儿的时候，我才觉得自己还是从前的那个人。\n\n你手一抖，药洒出来半碗，褐色的药汁溅在被面上，洇开一片。你没有去擦。你说娘娘——她摇了摇头。你说嬛儿——她攥着你的手松了一些。你说嬛儿，奴婢不敢。她笑了，笑得有些凄然，眼角的皱纹在烛光下格外清晰。她说你怕什么，怕皇上听见？还是怕我自己忘了？你沉默了很久。窗外的风把纸窗吹得呼啦啦响，炭火噼啪炸了一声，一颗火星跳出来，落在地上，闪了一下就灭了。你说奴婢不怕。她说我知道你不怕。所以我才愿意让你看见我这样。在外头我是熹贵妃，我每一步都要算得精确，每一句话都要想三遍再说。我对着皇笑脸，对着嫔妃们赔笑，对着下人们板着脸。我谁都不是。只有在这间屋子里，在你面前，我可以不做任何人。\n\n她松开了你的手，手指在你掌心轻轻划了一下，像是写字，但你没有看清她写了什么。她重新把被子拉上去盖住下巴，只露出一双眼睛，在昏暗的光线里亮得惊人。你看她闭上眼睛，呼吸渐渐平稳下来。你以为她睡着了，正要起身，她忽然又开口，声音轻得像一片落叶，落在地上就碎了。她说你还记不记得那年春天的海棠？你说记得。她说那时候我以为这宫里也会有春天。停了一会儿，她又说，原来宫里的春天不在御花园里，在你给我端来第一碗热汤的时候。然后她就真的睡着了，呼吸均匀绵长，像回到了很多年前那个画蝴蝶的春天。\n\n你端着药碗在床边站了很久。烛火摇晃了一下，映在墙上，像一个人影在轻轻晃动。你低头看了看自己的掌心，上面有一道浅浅的白痕，是她指甲掐出来的。你用另一只手摸了摸那道痕，然后拿起药碗吹了吹，把剩下的半碗药喝了。苦得你皱起了眉。你没有吹灭蜡烛就退了出去，轻轻关上门。门缝里最后漏出来一线光，照在雪地上，画出一条金黄的线。你站在雪地里，回头看碎玉轩的窗户，那扇窗户里透出来的光在风雪里晃了晃，像一只不肯闭上的眼睛。很快那条光就被雪夜的黑暗吞没了。\n\n那年你问她后悔吗。她正在剪窗花，剪刀停在半空，红色的纸屑落在她的裙摆上，像一地碎花瓣。她想了很久，久到窗外的日头从东边移到了西边，久到炭盆里的炭烧成了一片灰白。她说，后悔。你说后悔什么。她说，后悔进了宫。你说那如果重新来过呢。她把剪刀放下，看着你，眼角的细纹在暮色里格外温柔。她说如果重新来过，我大概还是会进宫。因为如果不进宫，我就不会遇见你。你手里的纸花掉在了地上，你没有去捡。她弯腰替你捡起来，拍了拍上面的灰，递还给你。她的手指碰到你的手指，凉凉的，像碎玉轩冬天的窗棂。但你知道，那盏灯还亮着。\n\n那之后你再也没有叫过她\"娘娘\"。不是因为你真的改了称呼，而是因为你学会了在某些时刻沉默——沉默本身就是一种叫法，是所有称谓里最温柔的那一种。碎玉轩的炭还是要去领的，早膳还是要按时端进去的，药碗还是要洗干净的。但有些事悄悄变了。你开始在她发烧的夜里多守一个时辰，开始在她写到一半的信笺旁边悄悄压一块镇纸，开始在下雪的早晨先把廊下的积雪扫掉，好让她出来的时候不会湿了鞋。她从来没有说过谢谢。但有一天你端着托盘进门，看见她在窗边站着，手里拿着那枚帕子，对着窗外的雪发呆。你轻声说娘娘，早膳好了。她没有回头，只说了一句：你手上那道疤好了没有？那是很多天前你端药洒出来烫的。你低头看了看，说好了。她嗯了一声，转过身来，坐到桌前，拿起筷子。你退到门口，听见她极轻地说了一句话，轻得你几乎以为是风声：谢谢你在这里。"},huangshang:{n:"皇上（雍正）",h:"皇帝",hc:"house-g",g:"male",s:{"loyalty": 1, "depth": 3, "bravery": 1, "rebel": 0, "humor": 0, "adventure": 0, "morals": 1, "wisdom": 3},t:["多疑深情", "帝王孤独", "爱却不敢信", "权力的囚徒"],r:"你有着和他一样的深度——表面冷静，内心翻涌。你渴望被理解，却又害怕被看穿。",tt:"《朱批未干》",tb:"冬夜，御书房里的炭火噼啪作响，窗外的风卷着碎雪打在窗纸上，发出细细的沙沙声。你端着托盘走进来时，他正伏在案前批折子，右手握着朱笔，左手压着奏折的边角，手腕上的青筋在烛光下隐隐凸起。案上堆着半人高的奏折，每一摞都用红丝线扎着，丝线的颜色深浅不一，有的已经褪成了暗红色，像干涸的血迹。听见脚步声，他没有抬头，只说了两个字：放下。\n\n你照做，把托盘放在一旁的茶几上。汤盅里是他每日必喝的冰糖炖雪梨，已经温了一个时辰，温度刚刚好。你转身欲走，他却放下了笔。\n\n笔尖在纸上顿了一下，留下一小团朱红色的墨渍。他看着那团墨渍，沉默了好一会儿，然后叫你名字。\n\n你回过身，看见他摘下老花镜，揉了揉眉心。那个瞬间，他不是九五之尊，只是一个累了一整天的中年男人。他的眼角有很深的纹路，那些纹路里藏着几十年的猜忌、算计和失去。他说，过来坐。\n\n你犹豫了一下，在他对面的杌子上坐下。他倒了杯茶，推到你面前，杯口冒着热气，氤氲了他的脸。他的手很稳，但倒完茶之后，他把茶壶放下的时候，壶底磕在桌面上，发出很轻的一声响。你不知道这个声音是不是故意的，也许他只是累了，也许他是在用这种方式告诉你，他需要你留下来，陪他坐一会儿。\n\n他说，今日有人弹你。\n\n你心一紧，手指不自觉地攥紧了衣袖。衣袖上的绣线硌着你的掌心，那疼痛让你保持清醒。你想起白天在御花园里，有人跟你说过一句话，你当时没在意，现在想来，那句话也许就是今日这道弹劾的引子。宫里的事从来都不是突然发生的，每一件事都有它的来龙去脉，像一条暗河，在地底下流了很久很久，直到某一天突然涌出地面。\n\n他看着你的反应，沉默了一会儿，说，朕驳了。\n\n你不知该说什么。宫里的人都说他多疑，说他薄情，说他不信任何人。可此刻，他坐在那里，像是一个做错了事的孩子，低声说了一句：你别怪朕。朕不是不信你，朕是不敢信。\n\n你抬起头看他。烛光映着他眼角的细纹，那些纹路像是一张地图，记录着他走过的每一条路、失去的每一个人。他的声音很轻，轻得像是在自言自语：朕见过太多人了。今天对你笑的人，明天就能把你卖了。你说朕多疑，朕承认。可朕若不疑，早就死在龙椅上了。\n\n他把茶杯轻轻推到你面前，又推了推，直到杯底碰到你的指尖。杯壁的温度透过指尖传到你心里，不烫，不凉，是他算好了的温度。他做什么事都要算好——什么时候该杀人，什么时候该赦免，什么时候该笑，什么时候该沉默。但他没有算到的是，你喝下那口茶的时候，眼泪掉进了杯子里。\n\n你没有端杯，只是看着他的手指。那是一双握过兵权、批过死刑、杀过人的手，此刻却在微微发抖。不是因为冷，是因为他不知道自己说完这些话后，你还会不会看他。他的指甲修剪得很短，指关节处有常年握笔留下的茧，那些茧是黄色的，摸上去粗糙得像砂纸。\n\n外头又下雪了。雪片落在窗棂上，融化成一道道水痕，像泪痕一样蜿蜒而下。他没有再说话，你也没有。你们就这样坐着，隔着那张堆满奏折的御案，隔着几十年的帝王生涯，隔着无数双眼睛和无数张嘴，隔着那些他永远不能对你说的话。\n\n后来他重新拿起朱笔，蘸了墨，却迟迟没有落下。笔尖的墨一滴一滴落在纸上，洇开一小团一小团红色，像干涸的血。他看着那些红色的墨渍，忽然说，朕年轻的时候，也想过做一个信人的皇帝。他的声音很低，低到你几乎听不见，低到像是对自己说的，而不是对你说的。\n\n你没有说话。你只是把茶杯端起来，喝了一口。茶是温的，刚刚好。他没有看见你眼角的泪，或者说，他看见了，但他什么也没说。他只是重新提笔，在那份弹劾你的奏折上，又批了两个字：不必。\n\n那天夜里你坐得很久。蜡烛燃了一根又一根，御书房的漏壶一刻一刻地滴，像心跳的节拍。他一直批着折子，你一直坐在对面，谁也没有提起离开。后来他放下笔，揉了揉手腕。他的手腕在腕骨处有一圈细细的红印，是长年握笔磨出来的。他不说话，你也不说，只是这样相对而坐，隔着满案的奏折，隔着那些你们都知道却永远不说出口的话。\n\n再后来，炭火渐渐暗了。他站起来，走到窗边，推开窗子，让外头的冷风进来。雪片飘进来几片，落在他肩上，他没有动。他就这样站在窗边，背对着你，说了一句话：你可知道，朕这一生，没有几个人是真的不怕朕的。你没有回答。他继续说：你进来的时候，脚步声很稳。大多数人来见朕，走路都是飘的，生怕发出声响。你不是。你每次来，朕都听见你的脚步——不快，不慢，落地有声。朕喜欢这个声音。他停顿了一下，又说，朕也不知道为什么，听见这个声音，朕会觉得……安。\n\n那个字说出口，他好像自己也吓了一跳。他没有继续说，把窗子重新关上，转身坐回书案后，重新拿起朱笔，像刚才什么都没有发生过一样。你也没有说话。你只是悄悄把那个字记在了心里——安。那是他这一生里，说过的最柔软的一个字。\n\n那晚你走的时候，脚步依然稳。走过长廊，走过廊灯昏黄的光晕，走进宫道深处的夜色里。你没有回头，但你知道他在看。就像他总是在看，在你不知道的地方，用那双什么都不放过的眼睛，看着你的每一步落地有声。你把那个字——安——藏进了胸口，和心跳放在一起，一起带走。那晚的雪越下越大，把宫道铺成了白色。你的脚印落在雪上，一步一个，清清楚楚，向着黑暗深处延伸。不知道他有没有俯身去看这一行脚印。你想，他大概看了。他是那种会把每一个细节都记住的人，记住你的脚步声，记住你的脚印，记住你把茶杯端起来的那一刻，泪水是怎么无声落进茶杯里的。"},huanghou:{n:"皇后（乌拉那拉·宜修）",h:"皇后",hc:"house-h",g:"female",s:{"loyalty": 0, "depth": 2, "bravery": 1, "rebel": 0, "humor": 0, "adventure": 0, "morals": 0, "wisdom": 3},t:["表面端庄内心狠戾", "被嫉妒吞噬", "一生都在争夺", "可怜又可恨"],r:"你和她一样有着不被理解的痛。你渴望被看见，被珍视，而不是永远活在别人的影子下面。",tt:"《景仁宫的月光》",tb:"景仁宫的灯总是最早灭的。你是皇后宫里值夜的小太监，知道她每天亥时三刻准时吹灯。内务府的规矩，皇后寝殿的灯必须亥时三刻灭，卯时三刻点，一刻都不能差。你知道那只是做给外头看的——等你端着参汤跪在寝殿门外，膝盖被青石板硌得发麻，就能听见里面还有细微的脚步声，来来回回，从东走到西，从西走到东，像一头困在笼子里的兽。那脚步声很轻，轻得几乎听不见，但你知道那是她的步子——不急不缓，每走七步就停一下，像是在数什么。你跪在门外，参汤的热气扑在脸上，湿漉漉的。你不敢抬头，只能盯着门缝里漏出来的那一线光。那一线光从亥时三刻一直亮到丑时，然后才灭了。\n\n你第一次进景仁宫是刚来的时候。那时候你十二岁，不懂规矩，端茶的时候手抖了一下，茶水溅到了皇后的袖口上。明黄色的缎面上洇开一团深色的水渍，像一朵开败的花。你吓得跪在地上，额头抵着冰冷的地砖，以为会被拖出去打死。可她没有。她只是用另一只干净的袖子慢慢把溅到的水渍擦了，一下，两下，三下，擦得很仔细，像是擦一件古董瓷器。然后她说，起来吧，下次小心。声音温柔得像春风拂过柳条。你抬起头，看见她的脸——端庄、平静，挑不出一丝瑕疵。凤冠上的珠串垂在她额前，微微晃动着，映着窗外的光。但你看她擦袖子的那只手，指节白得发青，指甲掐进掌心，手背上的青筋一根一根凸出来，像是用尽了全身的力气才没有甩你耳光。\n\n后来你就知道了，她是个连恨都要藏在端庄里的人。她恨的时候不骂人，不摔东西，不哭不闹。她只是坐在那里，端端正正地坐着，凤冠上的珠串不晃了，脸上的表情不变了，连呼吸都轻得像是没有。但你看得见——她的手在抖。那种抖不是害怕，是压抑，是把所有的情绪都压进骨头缝里，压成一个端庄的壳子，然后把这个壳子戴在脸上，戴一辈子。\n\n有一回你值夜到子时，路过正殿的侧窗。窗纸上糊的是苏州来的明纸，薄得像一层蝉翼。你看见里面映着她的身影，一动不动地站在一幅画像前面。那幅画像挂在景仁宫最深处的暖阁里，从来没有人敢碰。你知道那幅画——纯元皇后的画像。皇后的姐姐。进宫那年就死了，死的时候才十九岁。皇上为她辍朝三日，追封纯元皇后，把她的画像挂在景仁宫最暖的阁子里，一挂就是三十年。你不敢多看，匆匆走过。但就在你拐过回廊的时候，听见身后传来一声极轻的响动，像是瓷器落地碎成齑粉。你回头看了一眼，暖阁里的灯还亮着，但已经没有影子了。你推开门缝往里看——地上碎了一只茶盏，是皇上御赐的汝窑天青釉。她没有叫人来收拾。她就那样站在那幅画像前面，低着头，看着地上的碎片，一站就是半个时辰。\n\n第二天早上，你进殿奉茶，看见她端坐在凤座上，仪态万方，母仪天下。凤冠端端正正地戴在头上，明黄色的宫装没有一丝褶皱，脸上的表情平静得像一潭死水。朝臣们跪在下面，山呼万岁，她微微颔首，动作标准得像用尺子量过。但你的目光落在了她的右手——食指和中指上缠了一层薄纱，隐约透出一点红。那是被碎瓷片割伤的。你没有说话，她也没有解释。早朝散了以后，她叫住你，说去把库房里那只汝窑天青釉拿来。你愣了愣，说娘娘，那只已经——她说我知道碎了。再拿一只一样的来。你去了库房，翻遍了所有柜子，没有找到一样的。你回去禀报，她听完以后沉默了很久，说那就放那儿吧，不用找了。然后她端起你奉上的茶，喝了一口，说今天的茶不错。\n\n那天傍晚，她忽然叫你过去。你跪在她面前，低着头，只能看见明黄色裙摆上的金线凤凰。那凤凰绣得极好，每一根羽毛都栩栩如生，但你注意到凤凰的眼睛是用黑线绣的——纯元皇后画像上的凤凰，眼睛是用金线绣的。她说你跟着我多久了？你说三年了。她说三年。然后停顿了很久，久到你以为她睡着了，久到窗外的天色从橙红变成暗紫，久到景仁宫的灯一盏一盏亮起来。她开口了，声音轻得像从很远的地方传来。她说你觉得我是个什么样的人？\n\n你的额头抵在地上，地砖的寒气渗进骨头里。一个字也说不出来。你能说什么？说您端庄贤淑？说您母仪天下？说您是个好人？还是说您是个坏人？她笑了笑，笑声里没有温度，像是冬天的风吹过空荡荡的宫殿。她说你是不是也觉得，乌拉那拉·宜修只是一个端庄的壳子？你不敢答。她轻轻叹了口气，那声叹息很轻，轻得像一根羽毛落在地上，但你觉得整个景仁宫都跟着颤了一下。她说你去吧。\n\n你退出去的时候，天已经黑了。景仁宫上空的月亮很圆，月光照在琉璃瓦上，冷得刺骨。你想起她手上的纱布，想起那幅永远不能碰的画像，想起她每晚亥时三刻吹了灯又点亮的蜡烛，想起她站在那幅画像前面一站就是半个时辰的背影。你不知道她站在黑暗里看着那幅画的时候会想什么。你想，她大概在想，如果姐姐没有死，如果姐姐还活着，如果自己不是乌拉那拉家的二女儿，如果——没有如果。你只知道，那个母仪天下的皇后，在没有人看见的时候，其实只是一个被影子吞噬了一辈子的女人。\n\n你没有回头。但你听见身后景仁宫的大门缓缓合上的声音，沉重的木门撞在门框上，发出\"砰\"的一声闷响，沉闷得像一声来不及哭出来的叹息。\n\n你后来调到别的宫当差，再见到她已经是一年后的事了。是在御花园的一条小径上，她坐在轿子里，你站在路边等她过去。轿帘垂着，你看不见她的脸。但就在轿子经过你面前的时候，那轿帘被风掀起了一角，你看见了她的侧脸——不是凤冠霞帔的皇后，只是一个头发有些散乱、眼神落在很远处的女人。那一眼只有一瞬，然后轿帘落下，她又被黄色的绸缎遮住了，变回了母仪天下的皇后。你站在原地，直到那顶轿子彻底消失在回廊尽头。你忽然想起她说的那句话：你觉得我是个什么样的人？你站在风里，想了很久。你想，也许她只是一个想要被人看见的女人。不是看见皇后，而是看见乌拉那拉·宜修。那一扇从里面锁上的门，也许从来都不是锁着别人的，是锁着她自己的。"},huafei:{n:"华妃（年世兰）",h:"华贵妃",hc:"house-h",g:"female",s:{"loyalty": 3, "depth": 1, "bravery": 3, "rebel": 2, "humor": 0, "adventure": 1, "morals": 1, "wisdom": 1},t:["骄傲跋扈", "爱得毫无保留", "嚣张但真诚", "悲剧的深情"],r:"你和她一样，爱得毫无保留，哪怕全世界都说你傻。你的骄傲不是装的——是你唯一能保护自己的方式。",tt:"《翊坤宫的欢宜香》",tb:"翊坤宫的门永远是大敞着的。你是华妃身边管香的小宫女，知道她每天早晨起来第一件事就是点欢宜香。那香的味道浓烈霸道，像一盆烧红的炭被人浇了一勺油，\"轰\"地一下窜起来，从殿门口一直飘到长街尽头，像是生怕别人不知道这里住的是谁。皇上赐的欢宜香，说是能安神，助眠，养心。你见过那香的包装——明黄色的锦盒，上面用金线绣着\"御赐\"两个字。但你在她身边待了五年，从来没有见她安过哪怕一天的神。她每天夜里翻来覆去地睡不着，你在外间值夜，能听见她在里面辗转反侧，床板咯吱咯吱地响，像一艘在暴风雨里摇晃的船。\n\n华妃发脾气的时候，整个翊坤宫没有一个人敢喘气。她摔碎的茶盏能铺满一整条回廊，她打下去的巴掌能让一个宫女三天站不起来。你见过最厉害的一次，是因为一个小太监把她的护甲递错了颜色——她今天要金色的，小太监递了一对银色的。她站起来的时候裙摆翻得像一面旗，头上的凤钗撞在珠帘上叮当作响，像碎了一地的铜钱。你说娘娘息怒。她瞪你一眼，眼角的朱砂痣在怒火里红得滴血，你低下了头。但你看见她的胸口在剧烈地起伏，像一头被困住的母兽。但她没有打那个小太监。她只是走过去，拿起那对银色护甲，\"咔嚓\"一声掰成了两截，银片掉在地上，发出清脆的响声。然后她坐回去，端起茶盏，喝了一口，说重新去拿。声音很平，平得像什么事都没发生过。但你看见她端着茶盏的手在抖，茶水溅出来两滴，落在她的裙摆上，洇开两个深色的小点。\n\n你那时候不明白，以为她只是脾气坏。你以为天底下就是有这样嚣张跋扈的女人，仗着家世好，仗着皇上宠，仗着一张脸长得好看，就可以为所欲为。你甚至在心里暗暗讨厌过她——讨厌她把宫女打得站不起来，讨厌她一句话就能让一个人的家破人亡，讨厌她笑的时候那种居高临下的姿态。\n\n直到那年冬天的一个深夜。你在翊坤宫后殿的偏房里收拾香料，路过她的寝殿时听见里面有动静。那动静很轻，不是平时那种摔东西的声音，而是一种沉闷的、压抑的、像是从喉咙深处挤出来的呜咽。你以为是进了贼，推开门的一瞬间，看见华妃跪在佛龛前面。你没有见过她这样——不，准确地说，你从来没有见过华妃跪过任何人。皇上来了她站着，皇后来了她坐着，太后来了她微微欠身。她年世兰这辈子，膝盖从来没有弯过。但那天晚上，她跪在佛龛前面，膝盖重重地磕在蒲团上，蒲团里的荞麦壳从裂开的缝里挤出来，散了一地。她手里攥着一枚玉佩，攥得指节泛白。\n\n她听见你进来，没有回头。她说你过来。声音是哑的，像是哭过，又像是吞了太多的沙子。你走过去，她把手里的玉佩递给你。你接过来，那是一枚羊脂白玉雕的同心佩，温润细腻，边缘已经磨得很圆润了，像被人的体温焐了很多年。上面刻着两个字：世兰。刻痕很深，每一笔都像用刀一点一点凿出来的。\n\n她说这是大将军府的东西。我进宫那年，哥哥亲手交给我的。她说这话的时候声音很平，平得像一面结了冰的湖。湖面上什么都有倒影——天上的云，岸边的树，还有一个站在湖边不肯走的女人。她说哥哥说，世兰，进了宫就不比在家里了。这枚玉佩你随身带着，想家的时候就摸摸它。她停顿了一下，手指无意识地摩挲着玉佩上的字，说哥哥还说，年家的女儿，不哭。\n\n她说皇上赐了我欢宜香，说这香好，让我天天点。我点了五年。五年里，我每天早晨起来第一件事就是点燃它。那香味从香炉里飘出来，飘过整个翊坤宫，飘过长街，飘进每一个嫔妃的窗户里。她们闻到这个味道就知道，年世兰还在，华贵妃还在，皇上最宠的女人还在。我以为是他疼我。我以为这香是他从内务府上千种香料里精挑细选出来的，只赐给我一个人。后来我才知道——\n\n她顿住了。你看见她的肩膀在微微发抖，但她没有哭。年世兰不哭。年家的女儿，不哭。她说那香里有麝香，是让我不能生育的香。\n\n你手里的玉佩差点掉在地上。麝香——你管香料，你比谁都清楚麝香对女人的伤害。那不是普通的香料，那是断了女人一辈子盼望的东西。你看着她跪在佛龛前面，背挺得笔直，像一个宁折不弯的将军。她的凤钗歪了，一缕头发散下来贴在脸颊上，她没有去理。\n\n她转过头来看你，眼睛是红的，像烧透了的炭。但没有眼泪。年世兰不哭。她说你怕我？你说奴婢不怕。她笑了一下，那笑容里没有半点华贵妃的嚣张，只有一个女人的绝望。她说你不怕就对了。我年世兰这辈子不怕天不怕地，也不怕别人知道我是个什么下场。我只怕一件事——\n\n她顿了一下，把玉佩从你手里拿回去，握在掌心，握得很紧，紧到你以为那枚玉佩会被她捏碎。她说我只怕他从来就没有真心待过我一天。\n\n殿里的欢宜香还在燃。你看着那缕青烟从香炉里袅袅升起，飘过她的头顶，飘向黑暗的屋顶。那香味浓烈霸道，像一张网，把她罩在里面，逃不出去。你看着她把玉佩重新放回佛龛上，和那些她每天拜的神佛摆在一起。佛龛里供着观音菩萨，慈眉善目，嘴角含着微笑。她把玉佩放在观音菩萨前面，像是在告诉菩萨：这是我唯一想要的东西，你能给我吗？\n\n她站起来，理了理裙摆，把歪了的凤钗扶正，把散下来的头发重新盘好。她转过身面对你的时候，又是那个不可一世的华贵妃了。眼角的朱砂痣，凌厉的眉眼，微微上翘的嘴角——每一处都是那个让你害怕的华妃。但你知道，在那个跪了一夜的晚上，在那个握着玉佩说只怕他从未真心待过自己的女人身上，你看见了年世兰真正的样子。\n\n那不是华贵妃。那是一个在深宫里等了五年、盼了五年、爱了五年的女人。"},shenmeizhuang:{n:"沈眉庄",h:"惠贵人",hc:"house-h",g:"female",s:{"loyalty": 3, "depth": 2, "bravery": 2, "rebel": 1, "humor": 0, "adventure": 0, "morals": 3, "wisdom": 2},t:["温婉坚韧", "宁折不弯", "清醒而决绝", "最纯粹的友情"],r:"你和她一样，骨子里有着一份宁折不弯的倔强。你可以温柔，但你有底线——触到了，就绝不回头。",tt:"《存菊堂的茶凉了又续》",tb:"存菊堂院子里的那株老梅树是你看着它开花的。你是沈眉庄宫里伺候笔墨的小宫女，从她刚进宫被封为惠贵人那天起，你就在这座院子里了。那株老梅树种在院子的东南角，据说是先帝年间就有的，树干粗得两个人合抱不过来。每到腊月，枝头上就冒出点点红苞，到了正月，花就全开了。花开的时候，整个存菊堂都是梅花的香气，淡淡的，不浓烈，但你一走进院子就能闻到。那种香气像是从很远的地方飘来的，你抓不住，但它一直在。\n\n存菊堂的菊花开得最好，秋天一到，满院子都是淡黄色的花瓣。花瓣落在石桌上，落在井沿上，落在她每天写字用的那方端砚边上。那方端砚是眉州来的，石质细腻如肌肤，砚池里常年积着一层墨。她每天早上起来第一件事不是梳妆打扮，而是研墨。你说娘娘，墨要奴婢来研。她说不用，我自己来。你坐在门槛上看她，她站在窗前，背对着你，肩膀微微前倾，右手握着墨条，在砚池里一圈一圈地转。研墨的声音很轻，沙沙的，像春蚕吃桑叶，又像秋雨打在芭蕉叶上。那声音不急不缓，每一圈都一样，像是她在心里数着节拍。你看着她的背影，觉得这个女人身上有一种很奇怪的东西——不是高傲，不是清冷，而是一种很笃定的安静。好像天塌下来她也不会慌，她只会先把手里的字写完。\n\n她写字的时候不喜欢被人看。你有一次偷偷凑过去看，被她发现了。她没有生气，只是把宣纸翻过来，说还没写完，不好看。你看见那上面写着\"宁可枝头抱香死，何曾吹落北风中\"。你不懂诗，但你觉得那几个字写得特别好看，每一笔都像一根竹子，直直的，不肯弯。\n\n假孕那件事之后，她被贬了位分。从惠贵人降到了答应。内务府立刻换了一副嘴脸，送来的炭全是湿的，冒着黑烟，熏得满屋子都是刺鼻的味道。送来的菜全是凉的，白菜帮子冻得发硬，咬一口\"嘎嘣\"响。你气不过，端着那碗凉白菜去找总管理论。她拉住你的手腕，她的手很凉，像冬天的井水。说你去干什么？让人看笑话吗？你回头看她，她的脸上没有委屈，也没有愤怒，只是平静得像一潭深水。但那潭水的底部，你看得见暗流在涌动。她说把湿炭放在太阳底下晒一晒，凉菜回一回锅也能吃。这宫里的事，忍一忍就过去了。\n\n但你看见她夜里坐在窗前，手指一根一根地掰算着日子。她在纸上写下每一个日期——入宫的日子、被封为贵人的日子、假孕被揭穿的日子、被降位的日子。每一个日期旁边画一个小圈，小圈画得很圆，像一枚枚印章。你问她画圈做什么。她说画满了三百六十五个，就又是一年了。我看看自己能撑多少个三百六十五天。她说这话的时候没有抬头，手里的笔在纸上轻轻一点，又画了一个圈。那个圈的边缘有些发抖，但你没有说。\n\n你心口发酸，像吞了一颗没有熟的青梅。她不让你看她的表情，你就只能看见她握笔的手——骨节分明，指腹有一层薄薄的茧，那是常年写字留下的。指甲修剪得很整齐，不涂蔻丹，干干净净的。手腕上戴着一只银镯子，是进宫那年她母亲给她的。镯子已经很旧了，表面磨得发亮，但她从来没有摘下来过。\n\n后来她复了位分，一切好像又回到了从前。但你发现她变了——不是变得更冷了，而是更清楚了。她清楚这宫里每一个人的心思，清楚每一句话背后的意思，清楚什么时候该说话什么时候该沉默。她不再轻易相信任何人，也不再轻易对任何人笑。但她依然每天早上自己研墨，那沙沙的声音和从前一模一样。她依然在秋天把院子里的菊花采下来，一朵一朵地摆在竹匾里晒干，然后用来泡茶。她依然在有人来告状的时候先让人坐下喝口茶再说，不管来的人位分高低。\n\n有一天下午，阳光很好，透过窗纸照进来，在地板上画出一块方形的暖光。她泡了一壶菊花茶，茶壶是紫砂的，壶嘴冒着热气。她给你倒了一杯，推到桌子对面。你说奴婢不敢。她把茶杯又往前推了一寸，瓷底摩擦桌面，发出细微的声响。说这存菊堂里只有咱们两个人，你喝不喝？你接过来，茶已经凉了一半。你说茶凉了。她拿起茶壶，往你的杯子里续了热水，然后给自己也续了一杯。她说凉了就续热水，续了热水又凉，凉了再续。这茶啊，只要壶里还有水，就总还能喝。她说完拿起自己的茶杯喝了一口，然后低头继续写字。笔尖划过宣纸的沙沙声又响了起来，和很多年前的那个早晨一模一样。\n\n你捧着茶杯，热气扑在脸上，眼睛有些模糊。你把脸埋在茶杯后面，不想让她看见。茶水的温度从掌心传到心里，暖洋洋的。你没有说话，她也没有抬头。窗外的梅花开了第一朵，淡红色的花瓣在风里轻轻颤动。\n\n你记得有一次她被人冤枉偷了内务府的绸缎。管事嬷嬷带着人来存菊堂搜查，翻箱倒柜，把她所有衣服都扔到了地上。她就站在窗前看着，一动不动，像一尊冰雕。嬷嬷搜了半天什么都没找到，临走的时候说沈答应你最好安分些。她听完以后走过去，把地上的衣服一件一件捡起来，叠好，放回柜子里。每一件都叠得整整齐齐，边角对齐，像尺子量过一样。你帮她捡，她不让。她说我的东西我自己整理。她叠完最后一件衣服，转过身，端端正正地坐在椅子上，拿起笔，继续写那篇没有写完的字。好像刚才什么都没发生过。但你看见她写的字变了——之前是娟秀的小楷，现在每一笔都像刀刻，入纸三分，力透纸背。那篇字后来被她裱了起来，挂在存菊堂最显眼的位置。上面只有四个字：宁折不弯。你没有告诉她，那杯续了三次热水的菊花茶，从下午一直暖到了晚上。\n\n那之后你在存菊堂待了很多年。院子里的老梅树开了一年又一年，菊花枯了一茬又一茬。她的身体越来越差，大夫说要静养，她还是每天早上自己研墨。你说娘娘，让奴婢来研吧。她说你研得不对。你说哪里不对？她说力气太大，墨研出来颗粒粗，写出来的字不好看。你愣了愣，说奴婢再练练。她抬起头看你，眼神里有什么东西软下来，她说不用练了，你只管研就好，以后会好的。她后来真的让你研墨了。每天早上你站在窗前，一圈一圈地转着墨条，沙沙的声音在存菊堂里回响。她坐在旁边，看着你的手，偶尔说：慢一点。再慢一点。就这样。你研出来的墨，她说写起来顺手了。你没有说什么，只是把墨条放好，给她重新磨了一次，认认真真地，一圈一圈，就像学了很多年的一件事。"},anlingrong:{n:"安陵容",h:"安答应",hc:"house-h",g:"female",s:{"loyalty": 0, "depth": 3, "bravery": 0, "rebel": 1, "humor": 0, "adventure": 0, "morals": 0, "wisdom": 2},t:["自卑到黑化", "敏感多疑", "才华横溢却得不到认可", "被伤害后选择伤害别人"],r:"你和她一样敏感——能察觉到别人察觉不到的情绪变化。你的痛不是矫情，是你真的感受到了。",tt:"《延禧宫最后一支香》",tb:"延禧宫的角落里永远堆着香料。你是安陵容宫里管熏香的小太监，知道她有多少种香——安息香、凝露香、鹅梨帐中香、苏合香、龙涎香，还有那种她从来不告诉别人的香。那种香她只在深夜点，点的时候会把门窗都关紧，不让一丝烟气飘出去。你有一次偷偷闻过一次，味道很苦，像是把黄连和薄荷混在一起熬成了膏，闻得人心口发闷。她调香的时候很专注，低着头，睫毛在颧骨上投下一小片阴影。手指拈起一撮香料，放在鼻子底下闻一闻，眉头微微皱一下，然后又展开，小心翼翼地放进铜臼里捣碎。铜臼的声音很轻，叮，叮，叮，像寺庙里的木鱼。你站在门口看她，觉得她的侧影像一枝被人遗忘在暗处的白兰花——香得很，但没有光。\n\n她是从松阳县来的。松阳县在江南，你听过她说话的口音——软软的，尾音拖得很长，像春天的柳条拂过水面。刚进宫的时候，她穿着洗得发白的常服，领口磨出了毛边，头上的银簪子还是旧的，簪头的绒花掉了一半。你第一次见她，她对你笑了一下，说以后就麻烦你了。那笑容里有一种讨好的意味，嘴角翘得过高，眼睛弯成两道月牙，但你看得见那两道月牙背后藏着的紧张和不安。你心里莫名地不舒服——不是讨厌她，是心疼。因为这宫里没有人会对一个出身低微、家世寒酸的答应正眼看。内务府的太监给她送东西，随手扔在门口就走。别的宫里的宫女在背后说她，说她身上的穷酸味洗不掉。她不笑，就只能被彻底忽略。\n\n你看着她一点点往上爬。嗓子不好就每天练歌，练到半夜还在院子里咿咿呀呀地唱。她的声音不算好，但你听得出来她在拼命——每一个音都唱得很用力，用力到声音发颤。有一次她唱哑了嗓子，说不出话来，就用手指在桌上比划着旋律。你给她倒了一碗蜂蜜水，她接过来，对你做了一个口型：谢谢。后来她的调香手艺是全宫里最好的，好到连皇后都夸过。皇后当着众人的面说安答应调的香比内务府的还好。她低着头，说奴婢不敢。但你看她回到延禧宫以后，把皇后夸她的那句话写在了一张小纸条上，折好放进了妆匣的最深处。\n\n可她越往上爬，脸上的笑容越少。到后来，你几乎想不起来她上一次笑是什么时候了。她开始穿暗色的衣服——墨绿、藏蓝、深紫。她开始用浓重的香料盖住自己身上原本的味道。她开始不跟你说话了。你给她送东西，她只说一个字：放。你给她端茶，她只说一个字：搁。你站在她面前等吩咐，她看着窗外，很久才说：出去吧。\n\n有一回你帮她收拾妆匣，在匣子最深处摸到一个小布包。布包是粗布的，针脚很密，像是手工缝的。打开来，是一朵已经枯黄的绒花。绒花的花瓣蜷缩在一起，颜色褪成了灰黄色，但你还能看出来它原本是粉色的。你认得那朵花——是她刚入宫那年，甄嬛送她的。那时候她们是好姐妹，一起逛街，一起赏花，一起在碎玉轩的院子里数星星。甄嬛说这花是我自己做的，你喜欢就戴着。安陵容接过来，戴在头上，在铜镜前面照了又照，笑了一整个下午。后来甄嬛得宠了，封了嫔，搬出了碎玉轩。安陵容去看过她一次，回来之后坐在镜子前面坐了一整夜，一句话也不说。第二天早上你进去收拾房间，看见妆匣开着，那朵绒花被取出来放在梳妆台上，旁边是一面铜镜。镜子里映出安陵容的脸——一夜没睡，眼圈发青，嘴唇干裂。她看着镜子里的自己，看了很久，然后把绒花放回了匣子最深处。\n\n你把绒花放回匣子里的时候，她推门进来了。你跪下来请罪。她说起来吧，你翻我的东西？你说是收拾妆匣的时候碰到的。她走过来，看见那朵绒花，愣了一下。那一下很短，短到如果不是你一直看着她，根本注意不到。然后她伸手拿起来，放在鼻尖闻了闻。枯了的花早就没有味道了，但她闻得很认真，眼睛微微闭着，像是在回忆一朵刚摘下来的鲜花应该是什么味道。\n\n她说你还记不记得她第一次叫我的名字？你说记得。她说那时候她叫我陵容，声音甜甜的。后来她叫我安答应。再后来她叫我鹂妃。她每换一个称呼，我们就远了一步。她说这话的时候没有看你，眼睛盯着手里的绒花，手指一根一根地捋过那些蜷缩的花瓣。她的动作很轻，轻得像是在摸一个婴儿的脸。\n\n她把绒花放回匣子，合上了盖子。铜扣\"咔嗒\"一声，像是一个时代的结束。转过身来的时候，脸上又恢复了那种冷淡的表情。她说你去吧，把窗口的香添一添。你说娘娘要什么香？她说随便。什么都行。只要能让我睡一会儿就好。\n\n你退出去的时候，回头看了一眼。她站在镜子前面，镜子里映出她的脸——很美，但美得像一张画，画上没有表情，没有温度，没有那朵枯黄的绒花出现之前的一切。你想起她刚入宫那年戴着那朵绒花在铜镜前面笑了一整个下午的样子，想起她半夜练歌唱到哑了嗓子用蜂蜜水润喉的样子，想起她把皇后夸她的那句话写在纸条上藏进妆匣的样子。你想，如果那天甄嬛没有搬出碎玉轩，如果安陵容没有被选入宫，如果松阳县到京城的路没有那么远——\n\n\n\n你最后一次见她，是在延禧宫最冷的那个冬天。宫道上的雪积了半尺厚，你踩着雪去给她送炭。她的寝殿里没有生火，冷得像冰窖。她蜷缩在榻上，身上只盖了一条薄被，嘴唇冻得发紫。你说娘娘怎么不生火。她说炭不够了，内务府这个月还没送来。你去找内务府要炭，他们说安答应这个月的炭份例已经减了，因为皇上没有召幸。你气得跟他们理论，他们只说这是上面的意思。你空着手回到延禧宫，她看着你，笑了一下。那笑容很淡，淡得像一缕青烟。她说没关系的，我冷一冷就习惯了。你再也忍不住，眼泪掉了下来。她伸出手，替你擦了擦，手指冰得像雪。她说别哭，我不值得你哭。延禧宫的香又燃起来了。这一次是安息香，味道很淡，淡得几乎闻不到。但你站在殿门外，却觉得那香味浓得让人喘不过气来。\n\n你最后一次见到她是在那个冬天。她站在延禧宫的廊下，手里捧着一只白瓷香炉，炉盖已经掉在地上碎了。她没有弯腰去捡，只是站在原地，看着地上的碎片，久久不动。你走过去，蹲下来把碎片一片一片拾起来，拢在手心里，棱角割破了你的指尖，渗出一点血。你站起来，把那些碎片托在手里，问她娘娘，这个还修得了吗？她看了你一眼，又看了看那些碎片，说修不了了。太碎了。你把那些碎片攥在手心里，不知道该怎么办。她忽然开口，声音很平，平得像那年冬夜她点安息香时候的寂静：你还记得我刚进宫的时候，求你帮我找过一根白色的线吗？你说记得，那时候她的绣绷断了线，急着补好，你跑了整个翊坤宫才找到一根。她说那是我进宫以来第一次求人。你是第一个帮我的人。然后她转身走进殿里，再没有回头。廊下的风卷起落叶，把你手心里的碎瓷片吹落了几片，叮叮当当地落在青石板上。你握紧了剩下的，没有松手。"},guojunwang:{n:"果郡王（允礼）",h:"郡王",hc:"house-h",g:"male",s:{"loyalty": 3, "depth": 2, "bravery": 2, "rebel": 2, "humor": 1, "adventure": 3, "morals": 2, "wisdom": 2},t:["风流倜傥", "深情专一", "潇洒外表下的孤独", "为爱放弃一切"],r:"你和他一样，有着浪漫到骨子里的灵魂。你不介意与众不同——你享受它。你愿意为了对的人放弃全世界。",tt:"《折扇上的字》",tb:"三月三，上巳节，曲江池畔柳絮纷飞如雪。你站在曲桥上，看他在对岸的亭子里和人饮酒。他穿一身月白色长衫，腰间悬着一枚青玉佩，笑起来的时候眼尾微微上挑，像一柄刚出鞘的剑。满京城的人都爱看他笑——姑娘们说他风流，文人们说他倜傥，连皇上都说，允礼这孩子，什么都好，就是太不羁。\n\n亭子里坐了好几个人，有人弹琴，有人吟诗，有人在争论一副对联的平仄。他坐在中间，手里端着一杯酒，偶尔插一句话，说得大家都笑起来。他笑的时候，会微微侧过头，露出左颊上的一个浅浅的酒窝。那个酒窝，你只在很近很近的地方看到过。\n\n他注意到你在看他，举起酒杯朝你晃了晃。你也举杯，饮了一口。酒是桃花酿，甜得发腻，但你咽下去的时候，觉得那甜味顺着喉咙一路暖到了胃里，又从胃里一路暖到了指尖。你把手拢在袖子里，觉得这个春天忽然就不冷了。\n\n宴席散了以后，他在桥那头等你。桥很长，九曲回环，石板缝里长着青苔，你走得很慢。每走一步，鞋底都会蹭到石板上湿滑的青苔，发出细微的沙沙声。他折了一枝柳条，在手里来回转动，柳条上的嫩芽沾着他的指尖，留下一点点绿色的汁液。等你走近了，他把柳条递给你。你没有接，他便自己别在了自己的扇骨上。\n\n他说，今日风大，你怎么站在这儿。\n\n你说，看人。\n\n他笑，看谁？\n\n你说，看你。\n\n他不笑了。他把折扇打开，扇面上是你熟悉的字迹——那是你三年前写在浣花笺上的一首诗。你一直以为那张纸早就丢了。三年前那个晚上，你写完那首诗，折好，放在窗台上。第二天早上，纸不见了。你问遍了所有的下人，没有人承认拿过。你以为是风把它吹走了。原来不是风。\n\n他的手指抚过扇面上的字，指腹轻轻压着每一个笔画，像是在抚摸一个他不敢说出口的名字。他的手指修长，骨节分明，指甲修剪得很干净。他说，你写这个的时候，我站在窗外。你不知道。\n\n你不知道。你只知道那天的风很大，你写那首诗的时候，墨被风吹到了袖口上，洗了好几天都没洗掉。你只知道那天的月亮很圆，照在窗纸上，像一面镜子。你只知道你写完那首诗之后，对着它坐了很久，直到蜡烛燃尽，你也没有吹灭它。\n\n他把扇子收起来，别在腰间，转身往前走。你跟在他身后，看着他月白色的背影消失在柳林深处。他的步子不快不慢，刚好够你跟上。他从来没有等过你，但你也从来没有掉队过。柳林里的路很窄，两边的柳枝垂下来，拂过你的脸颊，痒痒的，带着春天的味道。偶尔有一两片柳絮落在他的肩上，他没有拂去。\n\n走到柳林尽头，他停下来，回头看你。他的眼睛在暮色里亮着，像一盏不肯熄灭的灯。他说，回去吧。天要黑了。你说，嗯。他走了几步，又回头，说了一句：你袖口的墨，我替你洗过。\n\n你说什么时候。他说，你不知道的时候。你站在原地，看着他越走越远的背影，忽然觉得袖口那个洗不掉的墨印，忽然就不难看了。\n\n你在原地站了很久，久到暮色彻底沉下来，久到曲江池的水变成了墨色。你把手伸进袖子里，摸到袖口那个旧的墨印——那墨洗了好几遍，只剩下一点淡淡的痕迹，像水墨画里未干的晕染。你忽然想，他说他替你洗过，那时候他是什么心情？是对着那个墨印，像他指尖抚过扇面上的字一样，一点一点地，不舍得用力？\n\n他说他站在窗外看你写诗，你不知道他看了多久。也不知道他是不是也看见了：你写到一半，搁下笔，望着窗外的月亮，低声念了一遍诗里的那句话——那句话你从来没有对任何人说过，只是那天夜里，对着月亮说了一遍，说完觉得心里空了一块，又填进来了什么。\n\n你低头看着自己的袖口。那块淡淡的墨印，他替你洗过了，但没洗干净。你忽然觉得，他大概是故意的。大概在洗的时候，他留了一点，作为某种不会被说出口的纪念。就像他把那张浣花笺裱在扇面上，就像他把柳枝别在扇骨上——他一直在收藏那些你以为丢掉的东西。\n\n你回去的路上，月亮已经出来了，圆的，照着曲江池的水，把一整个天都映进去。你想起他说的那句话，你袖口的墨，我替你洗过。你想，下次见到他，你要告诉他：洗得不干净。他大概会笑，那个眼尾上挑的笑，然后说：我知道。\n\n那晚你把那首诗又默写了一遍，放在窗台上，窗户不关，让夜风吹着。你不知道他会不会再来。你也不知道自己是不是在等他。你只是把诗放在那里，把窗户开着，把灯留着，然后去睡了。第二天早上，纸还在。可纸的旁边，多了一根柳枝，是昨天他别在扇骨上的那一根，带着嫩芽，还新鲜着。你把柳枝拿起来，指尖碰到那几片嫩芽，软软的，还带着潮气。你不知道他什么时候放的，也不知道他有没有看见那首新写的诗。你把柳枝插进窗台上的花瓶里，看着它在晨光里亮着嫩绿的颜色，觉得那颜色比任何颜色都好看。\n\n那根柳枝在花瓶里活了整整七天，第八天早上，你看见它发了新芽，嫩黄色的，细细的，顶着一粒露水。你站在窗边看它，看了很久。你想，他大概是世上最懂得收藏的人。那些别人以为丢失的东西，在他这里，从来都没有丢。他从来不说喜欢，但你知道喜欢长什么样子——它长得像一根柳枝，一把折扇，还有一个窗台上永远开着的窗。\n\n后来你才知道，他那把折扇上写满了你的名字。不是工整的小楷，是歪歪扭扭的、像是喝醉了以后写的字。每一个名字都不一样——有的用了你的封号，有的用了你的闺名，有的只是画了一个小小的花。你看到那些字的时候，他没有解释，只是把折扇合上，插回腰间。他的动作很慢，像是怕把那些字弄坏了。你说王爷。他说叫我允礼。你说允礼。他笑了一下，眼尾又上挑了，像一柄剑。那柄剑在你心里，从此以后再也没有收鞘。"},jingfei:{n:"敬妃（冯若昭）",h:"敬妃",hc:"house-h",g:"female",s:{"loyalty": 2, "depth": 2, "bravery": 1, "rebel": 0, "humor": 0, "adventure": 0, "morals": 2, "wisdom": 3},t:["隐忍大度", "不争但智慧", "在夹缝中求生", "温柔的保护者"],r:"你和她一样，不张扬但有力量。你知道什么时候该说话，什么时候该沉默——这种智慧比锋芒更难得。",tt:"《咸福宫的数砖人》",tb:"咸福宫的砖你一块一块数过，不是因为无聊，是因为敬妃数过。她是宫里最安静的女人——安静到有时候你会忘记这座宫殿里还住着一个人。你是咸福宫当差的小宫女，进宫第一天就被嬷嬷嘱咐，说伺候敬妃娘娘不用太机灵，因为她不会难为任何人。也不用太笨，因为她什么都看在眼里。嬷嬷说这话的时候，眼睛看着咸福宫的方向，语气里有种你当时听不懂的意味。后来你明白了——嬷嬷是在告诉你，这个女人不靠脾气立威，不靠恩宠压人，她靠的是一种你说不清楚的东西。\n\n她的日子过得很规律，规律到你可以用她的作息来对时辰。卯时起身，辰时吃早膳，巳时坐在窗前做女红，午时用膳，未时午睡半个时辰，申时继续做女红，酉时念经，戌时用晚膳，亥时安歇。三十年如一日，没有一天变过。她绣的花是整个宫里最好的，不是华丽的那种好，而是细致——细到每一根丝线的走向都一模一样。你有一次凑近看，数了一朵牡丹花瓣上的针脚，不多不少，正好三十六针。你问她为什么是三十六针。她说因为我年轻的时候数过一遍，从那以后就再没有变过。她说这话的时候头也不抬，手里的针穿过绸缎，拉出一根粉红色的丝线，又在花瓣的边缘落下第二针。她的针法很稳，每一针的距离都一样，像是用尺子量过。你看着她的手——手指纤细，关节处有长期握针留下的茧，指甲修剪得很短，不涂蔻丹，干干净净的。\n\n她在宫里活了三十年。三十年里，她没有争过宠，没有害过人，没有在任何一个妃嫔的争斗里站过队。皇上来的时候她恭恭敬敬地迎，端茶倒水，陪说话，皇上下棋她就陪着下，皇上走了她安安静静地坐着。别人笑她懦弱，她也不恼。有一次你在御花园里听见两个宫女在背后议论她，说冯若昭就是个没用的女人，连争宠都不会，活该一辈子是个妃。你气得想冲过去理论，但你忍住了。你回去以后忍不住对她说，娘娘，外头的人说您——她说什么？你低着头说没什么。她笑了一下，那笑容很淡，像水面上泛起的涟漪。说你以为我不知道他们说什么吗？他们说冯若昭是个没用的女人。她把针插在绸缎上，抬起头看着你，眼睛平静得像秋天的湖水。我确实没用。没用的人才能活得久。\n\n你那时候不懂，觉得她太消极了。你觉得活着不该是这样——活着应该去争，去抢，去要自己想要的东西。你见过华妃发脾气，见过甄嬛步步为营，见过皇后端庄背后藏着刀子。你觉得活着就应该像她们那样，要么轰轰烈烈，要么干脆利落地死。你不懂为什么有人愿意安安静静地活三十年，绣三十年的花，数三十年的砖。\n\n直到有一次，一个新来的小宫女被别的宫里的管事嬷嬷欺负了。那个小宫女才十三岁，比你刚进宫的时候还小。她被罚跪了两个时辰，膝盖肿得走不了路，躲在咸福宫的角落里哭，哭得喘不上气来。敬妃发现了，什么也没问，没有骂那个管事嬷嬷，没有去找皇后告状，没有做任何一件你会做的事。她把小宫女带到自己房里，让她坐在椅子上，给她倒了一杯热茶。茶是菊花茶，淡黄色的，冒着热气。然后她坐在小宫女旁边，继续绣她的花。绣了半天的花，一针一线，沙沙的。小宫女哭着喝着茶，哭声从大到小，从急到缓。等她不哭了，敬妃放下手里的针线，说好了，喝口茶，回去做事吧。小宫女说谢谢娘娘，站起来走了。从头到尾，敬妃没有说一句安慰的话。\n\n但你看见那个小宫女走出咸福宫的时候，脸上的表情变了。不是那种被安慰了的高兴，不是那种有人替她出头了的解气，而是一种很踏实的平静。好像只要有那杯茶和那半天的陪伴在，天大的委屈也能咽下去。好像只要有一个人愿意在你哭的时候坐在你身边绣半天花，这宫里就没有什么过不去的坎。\n\n后来你才明白，这就是敬妃活着的方式。她不说漂亮话，不做惊天动地的事，不站队不争斗。她只是在那里——像咸福宫院子里那棵老槐树一样，不声不响地立着，春天发芽，夏天撑荫，秋天落叶，冬天光秃秃的，但根扎得很深。你累了的时候，总能在树荫底下坐一会儿。你哭的时候，总有人给你倒一杯热茶。你不需要她说什么，因为她的存在本身就是答案。\n\n有一天傍晚，夕阳把咸福宫的屋顶染成了橘红色。你帮她收拾房间，看见柜子里放着一面铜镜。镜面已经有些模糊了，照出来的影子朦朦胧胧的，像隔了一层雾。但镜框上雕的花纹还很清晰——是一对鸳鸯，游在水面上，水波纹一圈一圈的。你说娘娘这镜子真好看。她说这是我进宫那年，我娘留给我的。三十年了。你把镜子拿在手里翻来翻去地看。铜镜很沉，比你想的要沉。镜框上的鸳鸯被摩挲了三十年，边缘已经圆润了。你说娘娘这鸳鸯雕得真好。她说你别看了，就是一个旧物件。我说的是三十年。\n\n你抬起头看她。她正在窗前坐着，夕阳从窗户照进来，把她的影子拉得很长，长得一直延伸到门槛外面。她没有回头，手里的针线还在继续。你忽然觉得，这个女人用三十年的时间只做了一件事——在这个人人都想成为谁的宫殿里，她只做了一面镜子，照见了自己，也照见了别人。\n\n你没有再说话。咸福宫的晚钟响了，一声接一声，沉沉的，像一块石头落入深井。钟声在宫殿之间回荡，穿过回廊，穿过庭院，穿过三十年的光阴，最后落在咸福宫的青石板上，碎成了一片寂静。"},duanfei:{n:"端妃（耿月宾）",h:"端妃",hc:"house-h",g:"female",s:{"loyalty": 1, "depth": 3, "bravery": 1, "rebel": 0, "humor": 0, "adventure": 0, "morals": 1, "wisdom": 3},t:["沉稳老练", "隐忍多年", "看透一切", "幕后操盘手"],r:"你和她一样，不急于一时的胜负。你相信时间和耐心比冲动更有力量。你的沉默不是软弱——是在等待。",tt:"《延禧宫窗外的棋局》",tb:"延禧宫里有一盘永远下不完的棋。你是端妃宫里的小太监，知道她每天下午都会在窗前的石桌上摆一局残棋。那盘棋不知道是谁留下的——也许是前任住在这里的娘娘，也许是很多年前的某个人。棋子是黑白的，黑白分明，像这宫里所有的人。棋盘是木质的，上面有一道很深的划痕，从左上角斜着划到右下角，把棋盘分成了两半。你说娘娘这棋盘该换了。她说不用，这道划痕是三十年前留下的，换了就没有意思了。你没有问她划痕是怎么来的。在宫里待久了你就知道，有些问题不该问，因为答案往往比问题更沉重。\n\n端妃病了大半辈子。你刚来的时候，她连下床都困难。每天早上你端着汤药进殿，看见她靠在枕头上，脸色苍白得像宣纸，嘴唇几乎没有血色。她的头发已经花白了，一半是白的，一半是黑的，白得像雪，黑得像墨。她每天早上端进来的汤药，喝下去之后总要皱一下眉，然后把碗放下，说今天的药比昨天的苦。你以为是药方换了。她说没有换，是我老了，舌头不中用了。你偷偷尝了一口她的药，苦得你差点吐出来。那药汁是深褐色的，粘稠的，喝下去之后嗓子眼像是被什么东西堵住了。但她每天喝，喝了十几年，眉头只皱一下，然后就放下了碗。你问她娘娘为什么不多喝几口。她说喝多了也没用。病是喝不好的。\n\n她很少说话。你不问，她不说。但她每次开口，说的话都值得你记在心里。你每次问她问题，她的回答总是刚好够用——不多一个字，也不少一个字。你说娘娘今天天气不错。她说嗯。你说娘娘要不要去院子里走走？她说不了，风大。你说娘娘想吃点什么？她说清淡些的。你觉得她冷淡，觉得她孤僻，觉得她像一个活在壳子里的人。但时间长了你发现，她不是冷淡，她只是把所有的力气都省下来了——省下来用在该用的地方。她把说话省下来，把走路省下来，把情绪省下来，把眼泪省下来。她把自己缩成一个小小的、安静的、不起眼的存在，然后在这个存在里，蓄着足以颠覆整个后宫的力量。\n\n有一次宫里的几个妃嫔起了争执，闹到了皇上面前。争执的起因是一件很小的事——一个妃嫔在皇上面前说了另一个妃嫔的坏话，被对方听见了，两个人当场吵了起来。事情越闹越大，牵扯出好多旧账，闹得整个后宫鸡犬不宁。那天晚上你来给端妃送晚膳，她正在下那盘残棋。夕阳从窗户照进来，把棋盘照得一半明一半暗。她说娘娘您听说了吗？她说听说了。你说那您怎么看？她拈起一枚白子，放在棋盘上，落子的声音清脆，像一颗石子落入水中。她说你看这盘棋，黑棋占了先机，前三十手都是黑棋在攻，白棋一直在守。但你仔细看，白棋虽然守，却步步留了后手。你以为黑棋赢了，其实白棋等的就是黑棋落子的那一步——那一步走错了，整盘棋就翻过来了。\n\n你看着棋盘，半天没看懂。棋盘上的黑白棋子密密麻麻的，像是后宫里盘根错节的关系网。你看得出来黑白双方在厮杀，但你看不出谁胜谁负。她轻轻笑了笑，那笑声很轻，像风吹过窗纸。说你看不懂就对了。这宫里的事情，看懂的人都不说，说的人都没看懂。\n\n三个月后，那场争执的结果出来了——表面上闹得最凶的那个妃嫔被降了位分，理由是\"口出狂言，有失体统\"。而另一个妃嫔虽然没有被降位，但从此以后再也没有得过皇上的宠幸。而从头到尾一言不发的端妃，被晋了位。不是她自己求的，是皇上下旨晋的。理由是她\"沉静守分，不涉争端，堪为后宫表率\"。你来禀报这个消息的时候，她正在窗边晒太阳，手里还是那盘棋。阳光照在她的脸上，照出那些细密的皱纹。她听完以后点了点头，说知道了。然后她把那枚三个月前拈起来的黑子放了下去——落子的位置和你记忆中的一模一样。\n\n你忽然浑身发冷——三个月前那盘棋，她就已经知道结局了。她不是在看棋，她是在看人。\n\n那天傍晚，你帮她收拾房间，在柜子最上面一层发现了一本旧账册。账册的封面已经泛黄了，边角卷曲着。你翻开来看，里面记录的不是银两数目，而是宫里每一个人的升迁贬谪——什么时候谁被封了嫔，什么时候谁被降了位，什么时候谁生了孩子，什么时候谁失了宠。一笔一笔，记得清清楚楚，日期、事由、结果，像史官的笔。账册的最后一页写着一行字：静观其变，后发制人。那行字的墨迹已经很淡了，但你看得出来，写这行字的人手很稳，每一笔都像刀刻的一样。\n\n你没有合上账册。窗外传来端妃落子的声音——啪，一声轻响。然后是她的声音，不大，但每个字都清清楚楚，像是从很远的地方传来，又像是贴在你的耳边。她说你把窗户关上吧，起风了。\n\n你走到窗前关窗。棋盘上的白子已经占了大半壁江山，黑棋被困在角落里，只剩一口气。\n\n你有一次大着胆子问她：娘娘这盘棋到底是谁留下的。她放下棋子，看着窗外的夕阳。夕阳的光把棋盘照成两半，一半是金色的，一半是暗的。她说是一个故人。你说什么样的故人。她笑了一下，那笑容很短，短到你差点没看见。她说一个和我下了一辈子棋，却没有下完的人。你说他后来呢。她说他赢了半盘棋，然后走了。再也没有回来。你看着她脸上的表情，忽然觉得那盘棋不是棋，是一封没有写完的信，一封写了三十年还没有写完的信。每一个棋子都是一句话，每一道划痕都是一段回忆。她每天下一子，不是在跟自己对弈，是在跟一个已经不在的人说话。那盘下了几十年的棋，在这一刻终于有了答案。你没有说话。端妃也没有解释。但你知道，那盘棋从来不是为了下的——那是她看这盘后宫大局的方式。\n\n那本账册你又看过一次，是很久以后的事了。那时候她已经不在了，延禧宫换了新的主人，那本账册被遗忘在柜子角落里，蒙了一层薄灰。你翻开来，在最后那行\"静观其变，后发制人\"下面，发现还有一行字，字迹很淡，淡得你差点没看见。那行字写的是：棋局终有散时，看透的人，不过是最后一个收棋的人。你把账册合上，重新放回柜子角落。窗外的石桌上那盘残棋还在，风把几枚棋子吹落在地，黑白相间，散落在青砖缝里。你没有去捡。你想起她说的，这道划痕是三十年前留下的，换了就没有意思了。那道横贯棋盘的划痕还在，把棋局分成两半，一半光，一半阴。那盘棋，从来就不是为了赢的。"},wenchuchu:{n:"温实初",h:"太医",hc:"house-h",g:"male",s:{"loyalty": 3, "depth": 2, "bravery": 1, "rebel": 0, "humor": 0, "adventure": 0, "morals": 3, "wisdom": 2},t:["默默守护", "深情不求回报", "善良但软弱", "一生只爱一个人"],r:"你和他一样，是那种会默默做很多事但不说的人。你的爱不是轰轰烈烈——是细水长流。",tt:"《三步之外》",tb:"黄昏时分，太医院的廊下挂着一排排风干的药草，当归、白芷、川芎，气味混杂在一起，像一首你听不懂却觉得安心的古曲。你坐在廊下的木凳上，等他。你病了三天，他每日都来请脉，但你从未真正看过他诊病时的样子。今天你第一次起得来床，便悄悄走到了太医院。\n\n你到的时候，他正在药房里抓药，低着头，手里拿着一杆小小的铜秤，称着那些你叫不出名字的药草。他的动作很慢，每称一味药，都要反复核对分量，不多一分，不少一毫。他的背影很瘦，肩胛骨在薄衫下微微凸起，像一只随时准备飞走却又舍不得离开的鸟。药房的光线很暗，只有窗纸上透进来的夕阳是金色的，照在他背上，把他的影子投在地上，拉得很长很长。\n\n他从药房出来，手里拿着一包刚抓好的药，看见你，愣了一下。他没有惊讶，没有喜悦，只是把药包放在桌上，走到你面前，伸出三根手指，搭在你的腕上。他的指尖微凉，按得很轻，轻到你几乎感觉不到他的存在。可你知道他在。你甚至能感觉到他指尖的温度在一点点升高，从微凉变成温热，像一壶慢慢烧开的水。\n\n他说，脉象比昨日好一些，但还需静养。\n\n你问他，我得的什么病。\n\n他收回手，垂着眼睑说，不是什么大病，只是劳神过度，思虑过重。\n\n你看着他低垂的睫毛，那睫毛很长，在夕阳的余晖下投下一小片阴影，落在他的颧骨上。你忽然说，我思虑的不是病。\n\n他沉默了。他的沉默是你最熟悉的东西。每次你说出一句让他为难的话，他就是这样沉默——不躲闪，不反驳，只是站着，像一个站在三步之外的人，既不敢靠近，也不肯离开。他的脚尖总是朝着门口的方向，随时准备走，但从未真正迈过那道门槛。\n\n你把他的手拉过来，放在自己的额头上。他的手在发抖，你感觉到了。他的手指很薄，指节上有常年握笔和握银针留下的茧，那些茧硬硬的，硌着你的额头，却让你觉得无比安心。他轻轻按了按你的额头，然后收回手，从袖中取出一枚香囊，递给你。香囊是藏青色的，绣着你不认识的花纹。那花纹不是宫里的样式，倒像是民间的手艺，针脚细密却不规整，像是一个不太会绣花的人，花了很多时间，一针一针缝出来的。\n\n他说，里面是安神的药，放在枕边，夜里能睡得好些。\n\n你接过来，香囊的边角已经磨出了毛边，显然不是新做的。你抬头看他，他避开了你的目光，走到药柜前，拉开抽屉，取出一把铜秤，开始称药。他的背影很瘦，肩胛骨在薄衫下微微凸起。你说，温大人，你为什么不说话。他手里的铜秤顿了一下，药粉洒了一点点在桌面上。他没有回头，说，臣该说的，都说完了。\n\n你说，可我想听的，你没说。\n\n他放下铜秤，转过身来。夕阳从窗棂照进来，把他的影子拉得很长，一直延伸到你的脚下。他的影子和你的影子交叠在一起，像两棵并排生长的树，根须在地底下悄悄缠绕，而地面上，它们始终保持着三步的距离。\n\n他说，你回去吧。药我会送到你府上。\n\n你说，我不走。\n\n他看着你，看了很久，然后走到门口，把门关上。门关上以后，屋里暗了下来。你听见他在门外站了一会儿，脚步声很轻，轻到你以为他已经走了。可你打开门的时候，他还站在那里，手里多了一把伞。他说，要下雨了，我送你回去。\n\n你抬头看天，天边只有一丝若有若无的乌云。可你知道，他会等到下雨为止。就像他一直等你开口为止。\n\n回去的路上，下雨了。他打着伞，走在你前面半步的距离，伞倾向你这边，自己的肩头露在雨里。你发现他肩膀上的薄衫被雨水打湿了，深蓝色变成了深黑色，贴着他瘦削的肩胛骨。你说，你伞倾得太偏了，你自己都淋着了。他说，没关系，这点雨算不了什么。你说，你是大夫，自己淋了雨不知道不好吗。他停下来，转头看你，脸上第一次有了一点不那么克制的表情，那表情里有一丝无奈，也有一丝他藏不住的东西。他说，我知道。\n\n他重新调整了伞的方向，倾向正中间，刚好把你们两个都罩进去。这样你们必须走得很近，近到他的衣袖偶尔会碰到你的手背。他的衣袖是干净的布料，洗得发白，摸上去软软的，带着一股淡淡的草药香。那是他身上常年的味道，当归、茯苓，还有一丝你叫不出名字的东西，像是他自己的气息混进了药香里，分不清界限。\n\n你们就这样走着，谁也没有说话。雨声密密地落下来，落在伞面上，发出细碎的声响，像有人在低语。走到你院子的门口，他停下来，把伞递给你，说，到了。你接过伞，说，你回去淋雨怎么办。他说，不远，没事。他转身要走，你叫住他。他回过头，雨水落在他脸上，他没有躲。你说，谢谢你。他沉默了一下，说，不用。然后就走了。他的背影很快消失在雨幕里，瘦削，笔直，像一根在风雨里不弯折的芦苇。\n\n雨停的时候，你发现香囊里有一张小纸条，折了很多层，折得很小，塞在药草里。你展开来，上面只有六个字，是他的字迹，写得很小，很慎重：无事也可来寻我。你把那张纸条折回去，重新塞进香囊里。你把香囊放在枕边，像他说的那样。那晚你睡得很好，比过去三天都好。不是因为药，是因为那六个字。是因为那六个字里，有一个人站在三步之外，用最轻的声音，说了一句他从来没有说过的话：你可以靠近。\n\n你后来嫁了人，搬出了那个他每天请脉的院子。他再也没有来过。但你偶尔会在药房的窗口看到他——他站在窗口后面，手里还是那杆小铜秤，称着那些你叫不出名字的药草。他的背影还是那么瘦，肩胛骨还是那么凸，像一只随时准备飞走却永远舍不得离开的鸟。你有一次让丫鬟送去一包点心给他。他收到以后，对着那包点心看了很久，然后说替我谢过夫人。丫鬟说娘娘还有一句话。他说什么。丫鬟说你以前说的，三步之外也是照顾。他听了以后，低下头，嘴角微微动了一下，像是想笑又忍住了。"},meiren:{n:"叶澜依（宁贵人）",h:"宁贵人",hc:"house-h",g:"female",s:{"loyalty": 1, "depth": 2, "bravery": 3, "rebel": 3, "humor": 0, "adventure": 2, "morals": 1, "wisdom": 1},t:["野性不羁", "冷面热心", "宁为玉碎不为瓦全", "一生只忠于自己"],r:"你和她一样，不屑于讨好任何人。你宁愿孤独也不要虚伪——这种野性，是你最珍贵的东西。",tt:"《春禧殿外的豹影》",tb:"春禧殿外面的围场里养着一只豹子。你是叶澜依宫里的小太监，知道她每天清晨都会去围场看那只豹。天还没亮她就去了，披着那件半旧的灰蓝色斗篷，头发随便挽了一个髻，簪子插得歪歪斜斜的。她不喂它，不逗它，就站在栏杆外面看。豹子在笼子里走来走去，金色的皮毛在阳光下一闪一闪。它的步子很慢，每一脚踩在地上都悄无声息，但你能感觉到那具身体里蓄着的力量——像一张拉满的弓。她看豹，豹也看她。豹子走到笼子最靠近她的地方，停下来，金色的眼睛隔着栏杆盯着她。她也不躲，就那么看着它。你有一次问她，娘娘看什么？她说看它。我说看它什么？她说看它什么时候会咬断栏杆跑出来。\n\n她是驯兽女出身。进宫之前一直在圆明园的围场里驯豹驯鹰，手上全是被野兽抓出来的疤。那些疤痕纵横交错，像一张画在地形图上的河网——有的深，有的浅，有的已经变成了白色的，有的还是粉红色的。你第一次见她的时候，她的手搭在桌沿上，阳光从窗户照进来，照在那些疤痕上，每一道疤都像一条小河。你说娘娘的手——她说怎么了？你说不好看。她笑了。那是你唯一一次见她笑。她的笑不是宫里女人那种温温柔柔的笑，而是从嘴角一直咧到耳根的笑，像围场里驯豹的女人在豹子扑过来的时候笑。她说手好不好看无所谓，能活命就行。\n\n她确实不在乎。别的妃嫔穿什么料子、戴什么首饰、梳什么发式，她一概不关心。皇上赏她的东西，她随手就放在柜子里，从来不拿出来用。内务府送来新衣服，她看都不看就扔给下人。内务府的总管太监气得直跳脚，说宁贵人你这也太——她抬起眼皮看了他一眼，他就闭嘴了。有一次皇后宫里的人来传话，说你主子也该学学规矩。她听完之后站起来，走到那个人面前，居高临下地看着他。她比那个传话的太监高整整一个头，站在他面前的时候像一座山。说你回去告诉皇后，我叶澜依进宫之前驯豹子，豹子不听话我就抽它。你们要我学规矩，行啊——先让豹子学会跪着。\n\n那个人吓得腿都软了，连滚带爬地跑了。你站在门口看着，心都提到了嗓子眼。你怕皇后知道了会降罪，怕皇上知道了会不悦，怕整个后宫都会因为这个女人而掀起一场风浪。她转过身，看见你一副要死的样子，撇了撇嘴说怕什么，我又没真打他。你说娘娘万一——万一什么？她说万一皇上怪罪。她坐下来，端起茶杯喝了一口。茶杯是粗瓷的，不是宫里那些精致的瓷器。她说那他就怪罪呗。我还怕这个？\n\n但你知道她怕过。不是怕皇上，不是怕皇后，是怕另一种东西——那种所有人都觉得她应该感恩戴德、应该知足、应该安安分分在后宫里了此一生的东西。那种东西叫\"规矩\"，叫\"本分\"，叫\"女人就该这样\"。她不怕豹子，不怕刀子，不怕死，但她怕被关在笼子里。\n\n有一回你在春禧殿后面砍柴，听见里面有声音。不是说话的声音，是一种低沉的、像是从胸腔里发出来的声音。你放下斧头，偷偷走到窗边，透过窗纸的缝隙看进去。她坐在窗边的地上，背靠着墙，怀里抱着一把弓。那把弓是她在围场时候用的，弓身是柘木的，弓弦已经松了，上面缠着一圈一圈的麻线。她低着头，手指一根一根地摸过弓身上的纹路——那些纹路是弓身天然的木纹，摸起来粗糙但温润。你听见她说了一句话，声音轻得几乎听不见，但你听见了。她说我宁愿和豹子关在一起，也不想穿这身衣服。她身上穿着的是宫里统一发的宫装，粉红色的缎面，上面绣着蝴蝶和花。那件衣服穿在她身上，像一只被关在金丝笼里的豹子。\n\n你手里握着斧头，站在原地不敢动。你没有见过这样的叶澜依——不是那个嚣张跋扈的宁贵人，不是那个敢当面顶撞皇后的野女人，而是一个抱着旧弓坐在地上说自己宁愿和豹子关在一起的女人。她没有哭，但她的手在抖。那双手能驯服最凶猛的豹子，能在豹子扑过来的时候稳稳地举起鞭子，却在摸到那件宫装的时候抖得厉害。\n\n后来你长大了些，慢慢明白了她为什么抖。因为她是一头被关在笼子里的豹子——金色的皮毛、矫健的四肢、锋利的爪子，全被锁在了这四四方方的宫殿里。她不在乎规矩，不在乎尊卑，不在乎别人怎么说她。因为她知道，这些东西对一头豹子来说没有意义。豹子只在乎两件事——自由，和活着。\n\n但她会在乎你。你问她为什么？她没说。但有一次你发高烧，烧到说胡话，整个春禧殿的人都以为你挺不过去了。太医来看过，开了方子，说听天由命吧。她坐在你床边守了一整夜，手里还是那把弓。弓弦上系着一根红色的穗子——是你进宫那年，她随手编了送给你的。她用弓弦当枕头，把弓横在膝盖上，靠在椅子上。第二天你醒了，看见她睡着了，嘴微微张着，呼吸均匀。阳光从窗户照进来，落在她的脸上，落在她手上的疤痕上，落在那根红色穗子上。你没有叫醒她。你静静地躺在那里，看着那根红色穗子在阳光下一闪一闪的，像一只不会飞的小鸟。\n\n春禧殿外的豹子吼了一声。声音浑厚，传得很远。她没有醒。窗外的阳光越来越亮，照在春禧殿的青砖地上，画出一块一块的光斑。\n\n春禧殿的围场后来荒了。豹子被迁到了别的园子，栏杆拆了，草长得比人高。她站在空荡荡的围场中间，看着那片杂草，站了很久。你说娘娘我们回去吧。她说再等一会儿。你问她等什么。她说等豹子回来。你心里发酸。你知道豹子不会回来了，就像她知道有些东西再也回不来了。但她还是在等——站在那片杂草中间，披着那件灰蓝色的斗篷，像一个等了一辈子的人。风从空旷的围场吹过来，吹起她的衣角，吹乱她的头发。她没有动。你站在她身后，忽然觉得这个什么都不怕的女人，其实最怕的不是死，不是关在笼子里，是忘了自己曾经是谁。你知道这宫里能让她安心睡着的地方，只有这间屋子，和屋子里这个她亲手系了红穗子的你。\n\n那根红色穗子你后来拆开看过，里面编着三根头发，拧在一起，压在穗子的芯里。你不知道是谁的头发。你把穗子重新系好，挂回弓弦上。弓还放在她的枕边，弓弦的松紧度从来没有人调过，就那样松着，像一个人的心弦，绷了太久，终于放开了一点。春禧殿外的围场后来空了，那只豹子不知去向。她站在空了的笼子前面站了很久，没有说话。你站在她身后，看见她的肩膀微微起伏了一下，像是深吸了一口气，又慢慢呼出去。她转过身，看见你，说走了？你说走了。她点点头，说那就好。她说这话的时候，眼睛看着远处，看着宫墙之外你们都看不见的地方。你没有问她觉不觉得好。你只是跟着她走回春禧殿，走进那间挂着旧弓和红穗子的屋子，帮她把窗户关上，把灯点亮。"},jinyu:{n:"槿汐",h:"甄嬛侍女",hc:"house-h",g:"female",s:{"loyalty": 3, "depth": 1, "bravery": 2, "rebel": 0, "humor": 0, "adventure": 1, "morals": 2, "wisdom": 3},t:["忠心耿耿", "智勇双全", "在低位但有高智慧", "一生只忠于一个人"],r:"你和她一样，是那种站在别人身后但不可或缺的人。你不需要站在聚光灯下——你知道自己的价值。",tt:"《她站在你身后》",tb:"\"ç¢çè½©ççªæ£ä¸ç»äºéï¼ä½ æ¨é¨è¿æ¥çæ¶åï¼ç­ç«å·²ç»ç­äºåæªã\n\nå¥¹è·ªå¨ç­çæï¼ææå»å¾åçº¢ï¼æ­£ä¸åä¸åå¾éæ·»é¶éª¨ç­ãå¬è§èæ­¥å£°ï¼å¥¹æ²¡åå¤´ï¼åªæéçå¾ä½ é£è¾¹æªäºä¸å¯¸ãéçåºæ©æ¦å°é¢ï¼ååºå¾è½»çä¸å£°åï¼åææéäºä»ä¹ã\n\nä½ é®å¥¹æä¹ä¸å«å°å¨æ¿çäººæ¥å¼ãå¥¹ç«èµ·èº«ï¼æäºæè¡£æä¸çç°ï¼è¯´å°å¨æ¿çäººæç¬¨ï¼ç­æ¾å¤äºåäººï¼æ¾å°äºä¸æãå¥¹è¯´è¯çæ¶åç¼çççç­çï¼ä¸çä½ çè¸ãä½ ççå¥¹å»è£çæå°ï¼æ³è¯´äºä»ä¹ï¼å¥¹å·²ç»å»åè¶äºã\n\næä¸åä½ åå¤éæ¥ï¼çè§å¤é´çç¯è¿äº®çãä½ æå¼å¸å­ä¸çï¼æ§¿æ±åå¨ç®å³ä¸ç»ä½ ç¼æ«é£ï¼éçº¿å¨å¥¹æéç©¿æ¢­ï¼å´åå¾®å¾®ç¿å¨ï¼åæ¯å¨é»æ°éèãä½ é®å¥¹æä¹è¿ä¸ç¡ï¼å¥¹è¯´è¿ä»¶æ«é£ä½ ææ¥è¦ç©¿çï¼å¾èµ¶åºæ¥ãä½ æ¸äºä¸ææ«é£çé¢æï¼åè¡¬å·²ç»çµ®äºä¸å±èæ£ï¼éè 我本来也想走过去的。但我没有。他说，从那以后，每次看到你，我就会想起那件披风。不是因为你做了什么了不起的事，而是因为你在做那件事的时候，脸上没有那种故作高尚的表情。你只是做了。做完了就走。像什么都没发生过一样。\n\n你把灯笼拿起来，凑近了看。那只兔子画得很丑，耳朵一长一短，眼睛一大一小。你说，这兔子是你画的。他说，嗯。你说是你画的，我就信。他又笑了一声，这次笑的时间长了一点，嘴角的弧度也深了一点。\n\n他说，你别信我。这宫里的人，谁都信不得。包括我。你说，可我相信。他说，你太傻。你说，傻就傻吧。\n\n灯笼里的蜡烛烧到了一半，烛泪滴在纸面上，烫出了一个小洞。那只兔子的耳朵被烧掉了一半，看起来更丑了。你没有觉得不好看。你觉得它比任何精美的绢灯都好看。因为它是他画的，在深夜里，在一盏昏黄的灯下，用一只不太听话的笔，画了一只不太像兔子的兔子。然后提着它，走了很远的路，来到你的面前。\n\n他说，该回去了。再不走，天要亮了。你站起来，他没有送你。你走了几步，回头看他。他还坐在廊柱下，背靠着柱子，眼睛闭着，像是一个终于能安心睡一会儿的人。灯笼的光映在他脸上，他的表情很平静，平静得让你觉得，这个人在宫里的四十年，所有的委屈、所有的算计、所有的不动声色，都不重要了。\n\n你走了很远，走到廊道的拐角，忍不住回头。那盏纸糊的小灯笼还亮着，橘黄色的光晕在黑夜里，像一颗没有熄灭的火星。他的轮廓在灯笼光里若隐若现，背靠廊柱，安静得像是那廊柱本身的一部分。\n\n你想起他说的那句话：宫里最可怕的是沉默，所有人都在说话，没有一个人说真话。可他自己，不也是这宫里的沉默本身吗？他走在所有人中间，低眉顺目，察言观色，把所有该说的话说得滴水不漏，把所有不该说的话压进肚子里，一压四十年。你不知道那四十年里，他有没有一个时刻，想要把那些话说出来。也许就是今夜，在这盏歪歪扭扭的兔子灯笼旁边，对着你。\n\n你把那盏灯笼握得紧了一点。灯笼的纸糊得不是很厚，你能感觉到里面烛火的温度，透过纸面传到你的掌心，热的，像一个人体温的余热。你想到他画那只兔子的时候，大概是在灯下，就着一盏小灯，拿着一支不太听话的笔，一笔一笔画。耳朵画长了，眼睛画歪了，他也没有重来，就这样让那只丑兔子留在了灯面上。然后提着它走了很远的路，来到你面前，说：给你的。\n\n你想，他大概不知道，那只丑兔子，是你在这个宫里见过的最好看的东西。"},caoguiren:{n:"曹贵人（曹琴默）",h:"曹贵人",hc:"house-h",g:"female",s:{"loyalty": 0, "depth": 2, "bravery": 1, "rebel": 0, "humor": 0, "adventure": 0, "morals": 0, "wisdom": 3},t:["心机深沉", "为女谋算一切", "表面温和内心狠毒", "母爱扭曲"],r:"",tt:"《她算了一辈子》",tb:"\"ä½ ç¬¬ä¸æ¬¡è®¤ççæ¹è´µäººï¼æ¯å¨ä¸ä¸ªå¾å¹³å¸¸çååãå»¶ç¦§å®«ççªå¼çï¼å¥¹åå¨æ¦»ä¸ç»æ¸©å®ç¼å°è¡£è£³ãéèç»å¯ï¼ä¸è¡ä¸è¡æå¾æ´æ´é½é½ï¼åå¥¹è¿ä¸ªäººä¸æ ·ââè¡¨é¢æ¸©åï¼åéä¸¥è°¨ï¼æ¯ä¸éé½è½å¨è¯¥è½çå°æ¹ãå¥¹ç¼çæ¶åå´åå¾®å¾®æ¿çï¼ç¼çç¯çéå°ï¼æ´ä¸ªäººåä¸æ ¹ç»·å¾å¾ç´§çå¼¦ã\n\nå¥¹æ¬å¤´çè§ä½ ï¼ç¬äºç¬ï¼è¯´å¤«äººæ¥äºï¼ç¶åç»§ç»­ä½å¤´ç¼ãä½ åä¸æ¥ççªå¤ï¼çªå°ä¸æä¸çèèï¼å¼å¾å¾å®éãä½ é®å¥¹æä¹èªå·±ç¼ï¼å¥¹è¯´å¬·å¬·æéï¼ææçå­©å­ãä½ è¯´ä¸å°±æ¯ä¸ä¸ªå°è¡£è£³ãå¥¹çæåäºä¸ç¬ï¼ç¶åè¯´ï¼æ¯ä¸ä»¶è¡£è£³é½æ¯è´´çå­©å­çèç©¿çï¼æä¸ä¸å¥¹å°±ç¼ä¸ä¸ãä½ è¯´è¿è¯çæ¶åå£°é³å¾å¹³ï¼ä½ä½ ,s:{"loyalty": 2, "depth": 1, "bravery": 1, "rebel": 0, "humor": 0, "adventure": 0, "morals": 3, "wisdom": 1},t:["正直古板", "家国情怀", "清官难做", "为女儿骄傲但严厉"],r:"",tt:"《家书》",tb:"济州到京城的路，要走整整十天。你坐在驿站的木床上，手里攥着一封信。信是父亲写来的，字是工整的楷书，一笔一划像他的为人——方方正正，不容半点含糊。信的内容也很方正：问你是否安好，嘱咐你按时用膳，提醒你入秋添衣。没有一句多余的话，没有一个多余的字。你把这封信读了又读，每一个字都像刻在了你的脑子里。你知道这封信的每一个笔画的走向，知道每一个转折的力度，知道每一处收笔的轻重。因为你太熟悉这种字迹了——小时候，他握着你手，教你写第一个字的时候，用的就是这种力度。\n\n可你知道他写信的时候在想什么。因为那封信的末尾，有一滴墨洇开了。不是手抖，是水滴。他在信纸上滴了一滴水。一个从不当着任何人掉眼泪的男人，一个在济州城门口送你时腰板笔直的男人，一个连女儿出远门都不说一句舍不得的男人，在写这封信的时候，掉了眼泪。\n\n你记得他送你出济州的那天。天还没亮，他就站在院子里，穿着一身洗得发白的官服，腰板笔直。你不愿让他送，他偏要送。他说，我送你到城门口。一路上他没有说话，你也没有。街道两旁的铺子都还没开门，青石板路上结了一层薄霜，踩上去吱吱作响。他的靴子踩在霜上，每一步都留下一个清晰的脚印，你跟着他的脚印走，觉得这样走就不会迷路。到了城门口，他从袖中取出一把匕首，塞到你手里。匕首的柄是木头的，磨得发亮，刃口却锋利得能照出你的脸。他说，这是你爷爷传下来的。带着。你说，我不要。他说，带着。没有商量的余地。从小到大，他对你说的话里，带着这两个字的频率最高——带着伞，带着钱，带着衣服，带着书。他从来不问你需不需要，他只知道你必须带着。\n\n你没有说谢谢。你从小就知道，他对你的爱不需要谢谢。他的爱是那把匕首，是他站在城门口看着你的背影直到消失，是他每隔十天写一封方正的信，是他在信的末尾不小心滴落的那滴水。\n\n驿站的窗外传来马蹄声，是驿卒在换马。你走到窗前，看着驿站的院子里，一匹瘦马在啃干草。那匹马很瘦，肋骨一根根凸出来，毛色灰暗，尾巴上有好几个苍蝇叮咬的红点。你忽然想起小时候，他教你骑马，你从马上摔下来，膝盖磕在石头上，血染红了裙子。他没有扶你，只是站在旁边说，自己起来。你哭了他也不管。后来你自己站起来了，他走过来，拍了拍你身上的土，说，好。\n\n只有一个字。好。\n\n可你知道这一个字比任何夸奖都珍贵。因为他从不说假话，从不夸张，从不把你抱在怀里说你是他最骄傲的女儿。他的骄傲都藏在那一个字里，藏在他教你骑马时站在旁边的沉默里，藏在他送你出城时笔直如松的背脊里，藏在他每隔十天写一封方正的信时落笔的轻重里。\n\n你把信折好，放回信封。信封的边角已经起毛了，被你反复打开又合上了无数次。信封上他的字迹有些模糊了，但你不需要看清。那些字你早就背下来了。\n\n你把信封贴在胸口，闭上眼睛。驿站的木床很硬，被子有股霉味，窗外的风穿过破旧的窗纸，发出呜呜的声音。但你睡得很安稳。因为你知道，在千里之外的济州，有一个人正坐在灯下，给你写下一封信。他会用同样的楷书，写同样的话，然后在末尾，再滴落一滴你不知道他愿不愿意承认的眼泪。而他永远不会告诉你那滴水是什么。你也永远不会问他。你们之间有些东西，不需要说。\n\n你在驿站住了两夜，等驿马换好，等官道上的泥泞稍微干一些。两夜里你把那封信又读了许多遍，每一遍都在那滴墨渍上停留一会儿。那滴墨渍洇开来，有点像一朵云，又有点像一片树叶，边缘参差不齐，是水和墨快速混合之后的样子——说明那滴水落得急，没有时间慢慢晕开。\n\n你想起很多年前，他在书房里改你的文章。那是你第一次写策论，写得一塌糊涂，起承转合全乱了，论据也牵强。他坐在书案后，拿着笔，从头到尾批改一遍，红笔的字比你的黑字还多。他批完了，把文章推到你面前，说，重写。你看着那满纸的红字，委屈得眼泪快掉下来。他看见了，说，哭什么，哭就能写好了？你把眼泪憋回去，把文章拿回来，重写。等你写完第二稿，他看了，点头，说，好多了。就这三个字。可那是他给你的最高评价，你知道。\n\n后来你的文章写得越来越好，他有时候会把你写的东西拿出来，反复看，但从来不在你面前说你写得好。直到有一次，你无意中听见他和同僚说话，提到自己的孩子。他说，我家那个丫头，文章写得比我强。他的声音不大，但你听见了。那是他说过的最骄傲的话。\n\n你把信放进行囊最深处，压在最底下。路还有八天，你会把这八天用来，想他还在世上的每一个细节。\n\n第三天，你在驿站门口遇见一个老乡。他从济州来，路过此地，说到济州的近况，说到今年的收成，说到协领大人最近在城里新修了一口义井，让百姓免费用水。你说，义井是谁出的钱。他说，是协领大人自己出的，没有动公款，一文不差。你说，他做这件事，有没有说为什么。老乡摇头，说，协领大人从来不说为什么，就是做了。就是做了。你低下头，把行囊带子握了握，想起他教你写那个字的时候说过的一句话：做了是真的，说了不算。这八天，就是他。就是他全部的样子。如此而已。\n\n后来你回了济州。父亲还是那样，腰板笔直，不苟言笑。但有一天你经过他的书房，看见他在写字。你从门缝里看进去，他写的是你的名字——不是大名，是你小时候他给你起的乳名。那张纸他写了一遍又一遍，写了满满一页。写完以后，他把那张纸折好，放进了抽屉的最深处。你站在门外没有进去。你知道一个男人的爱有时候不是拥抱不是夸奖不是温柔的话语——是他把你名字写了整整一页纸，然后锁在抽屉里，一辈子不让人看见。"},nian_gengyao:{n:"年羹尧",h:"抚远大将军",hc:"house-h",g:"male",s:{"loyalty": 1, "depth": 0, "bravery": 3, "rebel": 2, "humor": 0, "adventure": 2, "morals": 0, "wisdom": 0},t:["功高震主", "跋扈嚣张", "战功赫赫但不懂收敛", "悲剧的功臣"],r:"",tt:"《卸甲》",tb:"西北的风像刀子一样刮过营帐的时候，你第一次见到他。他刚从战场回来，一身铠甲上还沾着血和沙，头盔夹在腋下，头发散乱，眼睛却亮得吓人。营帐里弥漫着血腥味和汗味，混在一起，像一种你从未闻过却一辈子也忘不掉的味道。他没有看你，径直走到帅案前，把头盔重重地摔在案上，震得案上的茶盏跳了一下，茶水溅出来，在桌面上留下了一圈水渍。他解开铠甲的扣子，一颗一颗地解，动作很慢，像是每解一颗，都在卸下一层他不想让别人看到的东西。铠甲解下来之后，他里面的中衣已经被血和汗浸透了，贴在身上，勾勒出他宽阔的肩膀和结实的胸膛。中衣的领口有一道裂口，是刀剑划破的，裂口的边缘已经发硬，像一块干涸的痂。\n\n副将们鱼贯而入，汇报军情。他坐在帅案后，一条腿搭在另一条腿上，听汇报的时候一言不发。他的脸很黑，不是天生的黑，是常年在风沙里暴晒的结果。他的颧骨很高，眉骨突出，眼窝深陷，目光像鹰一样锐利。副将们走后，他才转过头看你。他的目光很沉，像一口深井，你看不清井底有什么，但你知道那下面藏着很多东西——死过的人，杀过的人，失去的人。那些东西沉在井底，像石头一样，压得那口井深不见底。\n\n他说，你来西北做什么。\n\n你说，来看看。\n\n他笑了一声，笑声很粗，带着西北风沙的味道。他说，看什么？看打仗？看死人？\n\n你说，看你。\n\n他不笑了。他站起来，走到营帐门口，掀开帐帘。外头是漫天黄沙，远处的戈壁像一片金色的海，一直延伸到天边。风卷着沙粒打在帐帘上，发出密集的声响，像无数只小虫在啃咬着什么。他说，你看。那就是我待了十年的地方。十年。十年里我杀的人比我认识的人多。他说，你怕我吗。\n\n你说不怕。他回头看你，眼睛里的光比外面的黄沙还刺眼。他说，所有人都怕我。皇上怕我，同僚怕我，连我的兵都怕我。你不怕。你说，我不怕。因为你看到了别人没看到的东西——他脱下中衣擦洗的时候，你看到了他左肩上有一道从锁骨一直延伸到后背的伤疤。那道疤很深，像一条干涸的河床，边缘翻卷着，颜色比周围的皮肤浅一些。那不是普通的刀伤，是一道差点要了他的命的伤。他从不给别人看这道疤。但今天，他没有避着你。\n\n你伸手碰了碰那道疤。你的指尖触到他皮肤的那一刻，他的身体僵了一下，没有躲。你的手指沿着疤痕的走向慢慢滑过，你能感觉到那道疤下面的肌肉在微微颤动。你说，疼吗。他摇了摇头，说，早不疼了。你说，我说的是心里。他沉默了很久，然后从案上拿起一个酒壶，仰头灌了一口。酒从他嘴角流下来，流过下巴，滴在胸前的中衣上。他说，你倒是敢说。\n\n你把酒壶从他手里拿过来，自己也喝了一口。酒很烈，辣得你咳嗽起来。他看着你咳，忽然伸手拍了拍你的背。他的手掌很厚，掌心有茧，拍在你背上的力道不轻不重，刚好够你止住咳嗽。他说，别喝了。这不是你们江南女子喝的东西。你说，我不是江南女子。他说，那你是什么。你没有回答。你把酒壶放回案上，走到营帐门口，和他并肩站着。外头的风还在刮，沙粒打在帐帘上，发出密集的声响。你说，你每次出征之前，害怕吗。他沉默了一会儿，说，怕。但打了这么多年，怕也没有用。你说，那你为什么还打。他说，因为不打，死的人更多。\n\n你转头看他。他站在风里，脸上的表情很平静，平静得不像一个杀人如麻的将军，倒像一个做着自己不喜欢却必须做的事情的普通人。他的铠甲还放在帅案上，金属的表面反射着营帐里微弱的烛光，那些光芒一闪一闪的，像是在诉说着什么他永远说不出口的话。\n\n你没有说什么时候走。他也没有问。第二天清早，营地里号角吹响，士兵们开始拔营，铠甲的碰撞声、马蹄声、命令声交织在一起，震耳欲聋。你站在帅帐外，看他穿甲。他的亲兵替他把铠甲一片一片扣上，每扣一片，他就变得更像那个令人畏惧的抚远大将军，而不是昨夜那个在营帐里，对着你说了一句害怕的普通男人。\n\n铠甲穿好了，他接过亲兵递来的头盔，往腋下一夹，转过身来看你。他站在朝阳里，那道金色的光打在他的铠甲上，把他的影子拉得很长，覆盖了整片营地。他走到你面前，俯身，把什么东西塞进你手里。你低头看，是一枚铜扣，是他铠甲上的，刚才换下来的。铜扣的背面用指甲刻了一个小小的字，刻得很浅，要对着光才能看清。\n\n你抬头看他。他已经转过身，大步往前走，亲兵们跟了上去，马队哗啦啦地跟着动起来。你握着那枚铜扣，对着朝阳，把那个字看清楚了。那是一个等字。\n\n你不知道他刻这个字刻了多久，也不知道他刻的时候在想什么。你只是把铜扣攥紧，攥得掌心发酸，然后看着他的背影消失在黄沙和朝阳里。\n\n很多天以后，你听人说，西北又打了一场仗，这次打赢了，皇上在朝上大加封赏。没有人提到那个铠甲上刻了等字的铜扣，没有人知道那枚铜扣此刻攥在一个人的掌心里，被攥得越来越暖，暖到像是有体温的东西。你展开手，看见铜扣上那个浅浅的等字，对着光，一笔一画都看得清楚。你把它重新握紧，想着那个刻字的人，在刀光剑影里，在血与尘的中间，带着一道深入骨头的疤，还有一个没有说完的，关于恐惧和疲倦的故事。\n\n他走的那天，西北的风特别大。你站在营帐外面看他骑上马，铠甲在风里哗啦啦地响。他没有回头。但你知道他在哭——不是因为怕死，是因为他知道这一去，就再也回不到这片他守了半辈子的土地了。他的背影在风沙里越来越小，最后变成了一个黑点，消失在天地之间。你想起他解铠甲的那个晚上，想起他胸口那道从左肩一直划到右腰的刀疤，想起他说我这一生对得起天下对不起一个人的时候那个平静得像结了冰的湖面的声音。西北的风刮在脸上像刀子，但你没有觉得疼。你只是站在那片空荡荡的营帐前面，站了很久很久。"},hongli:{n:"弘历（四阿哥/乾隆）",h:"四阿哥",hc:"house-h",g:"male",s:{"loyalty": 1, "depth": 2, "bravery": 1, "rebel": 1, "humor": 0, "adventure": 1, "morals": 1, "wisdom": 3},t:["隐忍蛰伏", "少年老成", "野心藏得很深", "善于利用别人的同情"],r:"",tt:"《四阿哥的书》",tb:"阿哥所的院子很小，小到你在门口就能一眼看到头。院子里种着一棵老槐树，秋天的时候落叶铺了满地，踩上去沙沙响。你第一次来这儿，是因为奉命给他送几本书。他跪在院子里接书，双手举过头顶，额头几乎贴着地面。他的膝盖硌在冰冷的青石板上，膝盖处的裤子已经磨出了两个薄薄的补丁，补丁的颜色和裤子不一样，说明是后来补的，补的针脚很密，一针一针扎得很仔细，像是有人花了很长时间才补好。你让他起来，他站起来，低着头，眼睛盯着自己的鞋尖。那双鞋已经很旧了，鞋头磨破了，露出里面发灰的布料。\n\n他那时候才十二岁，瘦得像一根竹竿，脸上没有什么肉，颧骨微微凸出来，看起来比实际年龄大。他说话的时候声音很低，语气却很稳，像一个三十岁的中年人在说话。你说，你多大了。他说，十二。你说，你看着不像十二。他抬起头看你，眼睛里有一种你不该在一个孩子脸上看到的东西——那不是天真，是谨慎。是一个从小就知道自己不被喜欢的人，学会了把所有的想法都藏起来。他的眼睛很黑，黑得像两潭深水，你扔一颗石子进去，也听不到回响。\n\n你把书递给他。他没有立刻接，而是先用袖子把书擦了一遍，才小心翼翼地接过去。他的袖子很干净，虽然旧，但洗得很白，没有一丝污渍。你说，这些书是我挑的，你看看喜不喜欢。他说，只要是书，都喜欢。你把他的书接过来翻了几页，书页很旧，边角都卷了，显然被翻过很多遍。每一页的空白处都密密麻麻地写满了小字，是他的笔记。他的字很小，很工整，一笔一划都写得很认真，像是在对待一件极其珍贵的东西。你说，这些书你看过很多遍了。他说，能找到的书，都看过很多遍了。\n\n你看着他的手指。他的手指很细，指甲修剪得很整齐，指腹上有翻书留下的薄茧。一个十二岁的孩子，手指上已经有了茧。不是因为干活，是因为翻书。翻那些别人不要的书，读那些别人不教他的字。他的手指在翻书的时候会微微颤抖，不是因为冷，是因为兴奋。每翻到一段他喜欢的文字，他的手指就会在那一页多停留一会儿，像是在抚摸一件他舍不得放手的东西。\n\n你在阿哥所坐了一会儿。他给你倒了茶，茶杯是粗瓷的，有裂纹，裂纹从杯口一直延伸到杯底，像一道闪电。茶是普通的碎茶，但他泡茶的动作很认真——先温杯，再放茶，再注水，每一步都做得一丝不苟。他的手指握着茶壶的手柄，手指因为用力而微微泛白。你说，谁教你泡茶的。他说，自己学的。书上看来的。你说，你还会什么。他说，会写字，会背书，会做饭，会缝衣服。他说这些话的时候，语气很平淡，像是在说一件再普通不过的事情。可你知道，一个十二岁的孩子，会缝衣服，会做饭，意味着他从来没有被人好好照顾过。\n\n你走的时候，他送你到门口。槐树的落叶落在他的肩上，他没有拂去。你说，别送了。他说，应该的。你走了几步，回头看他。他还站在门口，双手垂在身侧，腰板笔直，像一个被教过无数次规矩的木偶。可你看到了他眼睛里的那一点光——那一点没有被规矩磨掉的光，那一点还在燃烧的火。\n\n你忽然觉得，这个孩子总有一天会走到所有人都想不到的地方。不是因为命运，是因为他从来没有放弃过。即使没有人给他好杯子，他也会用粗瓷杯泡出最好的茶。即使没有人给他新书，他也会把旧书翻到纸页卷边。即使没有人爱他，他也会学着去爱那些他翻过的书、泡过的茶、写过的字。\n\n你回头看了一眼阿哥所的院门，那扇木门很旧，门上的漆剥落了大半，露出里面灰褐色的木头。但你知道，总有一天，这扇门后面走出的人，会让所有人记住他的名字。\n\n那本书你后来翻过。他说只要是书都喜欢，可你在书里夹着的那页纸上，看见他用极小的字写了一行话，写在书页边角最不起眼的位置，像是随手写下的又像是深思熟虑的：有人来送书，眼神没有居高临下。\n\n就这一句。没有名字，没有时间，没有任何能对应上的信息。但你知道他写的是你。因为在这阿哥所里，来给他送书的人里，只有你，会在他跪着接书的时候，蹲下来，让自己和他一样高，让他抬起头的时候，看见的是平视，而不是俯视。你当时没有意识到自己在做这个动作，只是习惯使然。但他记住了。用最小的字，藏在书页最深的角落里，记住了。\n\n你把那页纸重新放回书里，把书放回原处。院子里的老槐树在风里落着叶子，一片一片，落在石板上，落在木凳上，落在那扇掉漆的旧门上。你站在院子里，忽然想，多少年之后，如果这个孩子真的走到了所有人都想不到的地方，他会不会还记得，在一个秋天的下午，有人蹲下来，和他一样高，让他的眼睛，平平地看见了这个世界。\n\n再后来你又去了几次阿哥所。每次去，他都会提前准备好茶，把粗瓷杯洗得很干净，在杯壁上的裂纹处仔细擦过，然后等你。有一次你去得很早，他正在院子里练字，一张一张地写，写完不满意就揉掉，揉成一团扔在脚边。地上已经落了七八个纸团。你走过去，拿起一个展开，是一个云字，写得其实不错。你说，这个写得好，为什么揉掉。他说，云字要有飘逸的感觉，我这个写得太板正了。你说，板正也有板正的好处。他抬起头看你，那双黑色的眼睛里，那一点火，又亮了一点。他说，你这样说，是在安慰我。你说，不是。板正的字自有骨气，飘逸的字自有风流，各有各的好。他沉默了一会儿，低下头，重新拿起笔，写了一个更板正的云字，这次没有揉掉，放在一边，等它干。\n\n很多年以后，他当了皇上。你来拜见他的时候，他还是坐在那个老槐树下面的石桌旁，手里还是那本书。他看见你，笑了一下——不是皇上那种威严的笑，是那个十二岁的四阿哥才会有的、有点腼腆又有点试探的笑。他说你来了。你说是。他把书放在桌上，那本书还是你当年送他的那本，封面已经磨得很旧了。他说我一直留着。你说我知道。他沉默了一会儿，说这个院子里所有人都走了，只有你还在。你说奴婢不走。他站起来，走到你面前。他已经比你高很多了，但他看着你的眼神，还是那个蹲在青石板上、膝盖磕出两个薄补丁的十二岁少年。"},zhenglongke:{n:"郑龙克（慎贝勒）",h:"慎贝勒",hc:"house-h",g:"male",s:{"loyalty": 1, "depth": 1, "bravery": 1, "rebel": 2, "humor": 2, "adventure": 2, "morals": 1, "wisdom": 2},t:["风流多情", "不涉党争", "看似玩世不恭实则清醒", "逍遥王爷"],r:"",tt:"《风筝》",tb:"京郊的风很大，适合放风筝。你站在山坡上，看他放。他的风筝是一只燕子，竹骨纸面，尾巴上系着三根彩线——红、蓝、绿，三种颜色在风里翻飞，像三条彩色的尾巴。他跑起来的时候，长衫的下摆在风里翻飞，像一只真的燕子。线轴在他手里转得飞快，风筝越飞越高，高到你几乎看不见。你只能看到那三条彩色的尾巴在天际线上晃来晃去，像三条彩色的小蛇在蓝天里游动。山坡上的草被风吹得伏下去又立起来，一波一波的，像绿色的海浪。远处的村子里有炊烟升起，袅袅娜娜的，在风里散开，又聚拢，又散开。\n\n他回头看你，眼睛弯成了月牙。他的眼睛在阳光下一闪一闪的，像两汪清澈的泉水。他说，你来试试。你把线轴接过来，线轴上还留着他的体温，暖烘烘的，带着他掌心的味道——一种淡淡的松木香，像是他经常用松木做的手工。你拉了拉线，风筝在空中晃了一下，差点栽下来。线轴差点从你手里飞出去，你的手指被线勒出了一道红印。他从你身后伸出手，覆在你的手上，帮你稳住线轴。他的手指修长，指甲修剪得很干净，掌心有一层薄茧。那层茧不是因为练武，是因为做风筝。他的手指在你手指上停留了一会儿，然后慢慢松开。他说，放风筝不能硬拉，要顺着风。你一松一紧，它就飞起来了。\n\n你照他说的做。风筝果然稳住了，在蓝天里越飞越高。你说，你常来这里放风筝吗。他说，嗯。别人说我荒唐，堂堂一个贝勒，天天跑来郊外放风筝。你问他，你怎么看。他笑，我说，他们说得对。你愣了一下。你没有想到他会这样说。你以为他会辩白，会解释，会说那些文人雅士也放风筝，会说放风筝是一种风雅之事。可他什么都不说，只是笑着承认自己荒唐。他的笑不是苦笑，不是自嘲，是一种真正的、毫无保留的笑。好像荒唐这件事，对他来说，不仅不是耻辱，反而是一种骄傲。\n\n他把风筝的线从你手里接过去，打了个结，把线头拴在山坡上的一棵松树上。那棵松树很老，树干粗糙得像老人的手，树皮裂成了一块一块的。他说，就让它飞吧。你说，线拴在这儿，万一断了怎么办。他说，断了就断了。风筝本来就不该被线拴着。你说，那你还放它干什么。他说，为了让它高兴一会儿。等它觉得够了，自然会飞走。你忽然觉得，他说的不只是风筝。\n\n你看着他。他的头发被风吹乱了，几缕碎发落在额前，他没有去拨。他的眼睛望着天空，望着那只越飞越远的燕子。他的表情很平静，平静得不像一个风流多情的王爷，倒像一个看透了世事却不肯妥协的少年。他的长衫在风里飘动，衣角上沾着几片草叶，他也没有在意。他的手指松松地握着风筝线，手指关节在阳光下泛着淡淡的粉色。\n\n你说，你不怕断线吗。他收回目光，看着你，说，怕。但我更怕它从来不飞。你忽然明白了。所有人都说他荒唐，说他玩世不恭，说他什么都不在乎。可他在乎。他在乎那只风筝能不能飞起来，他在乎那根线什么时候会断，他在乎每一个愿意停下来看他放风筝的人。他在乎那些别人不在乎的东西——自由、真诚、一个能在山坡上放风筝的下午。\n\n他走到你身边，坐下，从袖中取出一壶酒，拔开塞子，递给你。你喝了一口，酒是梨花白，入口很淡，回味很长。他说，这酒叫梨花白。梨花开的时候酿的。等到梨花落的时候，就喝完了。一年只有这一次。你说，可惜。他说，不可惜。正因为一年只有一次，才值得等。你低头看着手里的酒壶，壶身上有一道浅浅的划痕，不知道是什么时候留下的。你说，这酒壶你用了很多年吧。他说，嗯。第一次放风筝的时候买的。你说，为什么不换一个新的。他说，旧的用着顺手。新的太滑，拿不住。\n\n山坡上的风越来越大了。风筝的线忽然紧了一下，然后松了。你抬头看，线断了。燕子在空中翻了几个跟头，越飞越远，最终消失在天际线。他没有追。他只是坐在那里，仰着头，看着风筝消失的方向，嘴角挂着一抹笑。那抹笑里有一丝不舍，但更多的是释然。你知道，他还会再来，再放一只风筝，再等它飞走。然后等到来年的梨花开了，再酿一壶梨花白，再坐在这棵老松树下，等一个愿意陪他放风筝的人。\n\n你们在山坡上坐到太阳快落山。他把那壶梨花白喝光了，你喝了三口，剩下的都是他的。他喝酒不皱眉，仰头喝，喝完放下壶，抬眼看天，像是在和天上什么人对饮。你说，你喝酒不像在解愁。他说，我没有愁。你说，那你喝酒是为什么。他想了想，说，为了高兴。你说，你现在高兴吗。他把酒壶倒过来，最后一滴酒滴在地上，被草叶吸收，消失了。他说，嗯。\n\n太阳落到山后面，天色变成了橙红色，然后变成紫色，然后变成深蓝色。你们一直坐着，没有人提起走。他把那根断了的风筝线绕在手指上，一圈一圈地绕，绕满了再松开，再绕。他的手指修长，那根细线在他指间绕出了很多圈弯折，像一个你解不开的谜。你伸手把那根线接过来，他没有阻拦。你把线握在手心里，闭上眼睛，感受那根线的重量。很轻，轻到几乎没有，但你知道它在。\n\n他在旁边说了一句话，声音很轻，轻到差点被晚风吹走：下次来，还放燕子吗。你把线握得稍微紧了一点，说，放。他嗯了一声，然后没有再说话。天色又深了一点，山坡上的草叶开始挂上露水，凉凉的，湿润润的气息从地面升起来。你们还是没有动。你知道他不急，他从来不急，从来。"}};
const QS=[{"t": "选秀那天，你站在太和殿外，听着里面一个个被传唤。你心里想的是什么？", "o": [{"t": "我不想被选中——我只想自由自在地活着", "s": {"rebel": 2, "adventure": 1}}, {"t": "如果进了宫，我要做到最好——不是为了争宠，是为了活下去", "s": {"wisdom": 2, "bravery": 1}}, {"t": "我希望能和喜欢的人一起，不管在哪都好", "s": {"loyalty": 2, "depth": 1}}, {"t": "我有才华，我值得被看见——这是证明自己的机会", "s": {"wisdom": 1, "bravery": 2}}]}, {"t": "你第一次见到皇上，他的一个眼神让你心里一紧。你觉得那个眼神是什么意思？", "o": [{"t": "他在打量我——像在评估一件物品", "s": {"depth": 2, "wisdom": 1}}, {"t": "他对我有好感——这是个好机会", "s": {"bravery": 2, "wisdom": 1}}, {"t": "他看起来很孤独——也许我能理解他", "s": {"depth": 2, "loyalty": 1}}, {"t": "他不过是个男人——和其他男人没什么不同", "s": {"rebel": 2, "adventure": 1}}]}, {"t": "你在后宫里最好的朋友被人陷害，你会怎么做？", "o": [{"t": "不惜一切代价救她，哪怕搭上我自己", "s": {"loyalty": 3, "bravery": 1}}, {"t": "冷静分析局势，找到最稳妥的方式帮她", "s": {"wisdom": 3, "depth": 1}}, {"t": "暂时按兵不动，等时机成熟再出手", "s": {"wisdom": 2, "depth": 2}}, {"t": "直接去找皇上当面理论", "s": {"bravery": 3, "rebel": 1}}]}, {"t": "你最信任的侍女告诉你，有人在皇上面前说了你的坏话。你的第一反应是？", "o": [{"t": "查清楚是谁说的，找到证据再反击", "s": {"wisdom": 3, "depth": 1}}, {"t": "不在意——身正不怕影子斜", "s": {"morals": 2, "rebel": 1}}, {"t": "先反思自己是不是真的做错了什么", "s": {"depth": 2, "morals": 2}}, {"t": "以其人之道还治其人之身", "s": {"bravery": 2, "rebel": 1}}]}, {"t": "你在御花园里遇到了一个身份神秘的人，他和你聊了一下午。你会？", "o": [{"t": "觉得他是有趣的人，不管他是谁", "s": {"adventure": 2, "rebel": 1}}, {"t": "暗自调查他的身份——在宫里不能掉以轻心", "s": {"wisdom": 2, "depth": 1}}, {"t": "享受这次偶遇，但不问太多——有些美好不需要知道全部", "s": {"depth": 2, "adventure": 1}}, {"t": "怀疑他的目的——宫里没有人是无缘无故出现的", "s": {"depth": 2, "wisdom": 1}}]}, {"t": "皇后赏了你一碗汤，你怀疑里面有问题。你会怎么做？", "o": [{"t": "找个借口不喝——但不能让别人看出来", "s": {"wisdom": 3, "depth": 1}}, {"t": "喝了——在皇后面前拒绝太明显", "s": {"bravery": 2, "depth": 1}}, {"t": "先让身边的人试一口", "s": {"wisdom": 2, "morals": 0}}, {"t": "当面喝掉，但提前准备好解药", "s": {"bravery": 3, "wisdom": 1}}]}, {"t": "你发现自己怀孕了，但你不确定孩子的父亲是谁。你会？", "o": [{"t": "这个秘密我会带进坟墓里——谁也不能知道", "s": {"depth": 3, "bravery": 1}}, {"t": "想办法确认——真相比面子重要", "s": {"morals": 2, "bravery": 2}}, {"t": "不管是谁的，我都会保护好这个孩子", "s": {"loyalty": 3, "bravery": 1}}, {"t": "做出最有利于孩子的选择——这不是自私，是负 const D=['loyalty','depth','bravery','rebel','humor','adventure','morals','wisdom'];
let qi=0,sc={},cqs=[];
function sh(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function start(){
    document.getElementById('intro').classList.remove('active');
    document.getElementById('quiz').classList.add('active');
    let genderQs=QS.filter(q=>q.o[0]&&q.o[0].s&&q.o[0].s._sel);
    let normalQs=QS.filter(q=>!(q.o[0]&&q.o[0].s&&q.o[0].s._sel));
    let picked=sh(genderQs).slice(0,2);
    picked=picked.concat(sh(normalQs).slice(0,8));
    cqs=sh(picked);
    sc={};D.forEach(d=>sc[d]=0);window._gm=0;window._gf=0;qi=0;showQ();
}
function showQ(){
    let q=cqs[qi];
    document.getElementById('qt').textContent=q.t;
    document.getElementById('pb').style.width=(qi/10*100)+'%';
    document.getElementById('qn').textContent='第'+(qi+1)+'/10题';
    let od=document.getElementById('os');od.innerHTML='';
    let so=sh(q.o);
    so.forEach(opt=>{
        let b=document.createElement('button');b.className='opt';b.textContent=opt.t;
        b.onclick=()=>pick(opt.s,b);od.appendChild(b);
    });
    let c=document.getElementById('qc');c.classList.remove('fi');void c.offsetWidth;c.classList.add('fi');
}
function pick(s,btn){
    document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
    btn.classList.add('sel');
    for(let k in s){
        if(k==='_sel'){
            if(s[k]==='m')window._gm=(window._gm||0)+1;
            else if(s[k]==='f')window._gf=(window._gf||0)+1;
        }else{
            sc[k]=(sc[k]||0)+s[k];
        }
    }
    setTimeout(()=>{qi++;if(qi>=10)calc();else showQ()},400);
}
function calc(){
    document.getElementById('quiz').classList.remove('active');
    document.getElementById('loading').classList.add('active');
    setTimeout(()=>{
        let gm=window._gm||0,gf=window._gf||0;
        let tg=gm>gf?'female':gm<gf?'male':(Math.random()>0.5?'male':'female');
        let candidates=Object.keys(CHARS).filter(id=>CHARS[id].g===tg);
        let dists={};
        for(let id of candidates){
            let c=CHARS[id],d=0;
            for(let dim of D){let cw=c.s[dim]||0,uw=sc[dim]||0;d+=(cw-uw)*(cw-uw);}
            dists[id]=d;
        }
        let weights={};
        for(let id of candidates)weights[id]=1.0/(dists[id]+1.0);
        let avgW=Object.values(weights).reduce((a,b)=>a+b,0)/candidates.length;
        let minW=avgW*0.25;
        for(let id of candidates)weights[id]=Math.max(weights[id],minW);
        let totalW=Object.values(weights).reduce((a,b)=>a+b,0);
        let r=Math.random(),cum=0;
        let best=candidates[0];
        for(let id of candidates){cum+=weights[id]/totalW;if(r<=cum){best=id;break;}}
        let c=CHARS[best];
        let pct=Math.round(70+Math.random()*25);
        showR({...c,id:best},pct);
    },2500);
}

    h+='<div class="trs">'+c.t.map(t=>'<span class="tr">'+t+'</span>').join('')+'</div>';
    h+='<div style="margin:20px 0;color:#c4a882;line-height:1.8;font-size:1rem">'+c.r+'</div>';
    if(c.tb){
        h+='<div class="story">';
        h+='<div class="stitle">'+c.tt+'</div>';
        c.tb.split('\\n').forEach(p=>{if(p)h+='<p style="margin-bottom:15px">'+p+'</p>';});
        window._cs=c.tb;
        window._cn=c.n;
        window._ct=c.tt;
        h+='<div class="cpbtn" id="cpbtn">📋 复制故事，去小红书分享</div>';
        h+='</div>';
    }
    document.getElementById('rc').innerHTML=h;
    let btn=document.getElementById('cpbtn');
    if(btn)btn.onclick=copyStory;
}
function copyStory(){
    let body=window._cs||'';
    let name=window._cn||'';
    let title=window._ct||'';
    let txt='🕯️ 甄嬛传角色匹配测试\n\n我匹配到了'+name+'！\n\n'+title+'\n\n'+body.replace(/\\n/g,'\n')+'\n\n—— 测测你匹配到了谁？👆';
    if(navigator.clipboard){
        navigator.clipboard.writeText(txt).then(()=>{
            let b=document.getElementById('cpbtn');
            if(b){b.textContent='✅ 已复制！快去小红书分享吧';setTimeout(()=>{b.textContent='📋 复制故事，去小红书分享';},3000);}
        });
    }else{
        let ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
        ta.select();document.execCommand('copy');document.body.removeChild(ta);
        let b=document.getElementById('cpbtn');
        if(b){b.textContent='✅ 已复制！快去小红书分享吧';}
    }
}
function restart(){
    document.getElementById('result').classList.remove('active');
    document.getElementById('intro').classList.add('active');
}
(function(){
    let c=document.getElementById('stars');
    for(let i=0;i<80;i++){
        let s=document.createElement('div');s.className='star';
        s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+(Math.random()*2+1)+'px;height:'+(Math.random()*2+1)+'px;--d:'+(Math.random()*3+2)+'s;animation-delay:'+Math.random()*3+'s';
        c.appendChild(s);
    }
})();
</script>
